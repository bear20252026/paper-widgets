<script src="../bosshistory/assets/vendor/three.js"></script>
<script type="module">
const THREE = window.THREE, stage = document.getElementById('stage'), status = document.getElementById('status');
if (!THREE){ status.textContent = 'three.js missing'; throw new Error('deps'); }

/* ---------- the pictures: takes of the SAME body, the mouth alone swapped by hand and cut out by hand (squish/assets/edited,
   shrunk to 3/4): calm (his grin); strained (a frown, while he is pulled); an open smile (letting go); a laugh (the snap-back
   after he tears loose); and a closed smile for when the pointer is near him (he notices you: the eyes follow, the mouth
   softens from the lopsided grin). One more, fainter closed smile sits in the folder (bob-smile-soft) for swapping in.
   One take shows at a time; a change is an 80 ms cut, as in the site this is after. Missing takes fall back to the calm
   one, and the eyes are then drawn by the shader instead. ---------- */
const IMAGES = { calm:'../bosshistory/assets/minions/bob-grin.png', strain:'../bosshistory/assets/minions/bob-frown.png', grin:'../bosshistory/assets/minions/bob-smile-open.png', yell:'../bosshistory/assets/minions/bob-laugh.png', near:'../bosshistory/assets/minions/bob-smile-closed.png' };
const NEAR = { enter: 0.07, leave: 0.12 };            // how close the pointer comes to him (stage units past his outline's box) before he notices, and how far it goes before he forgets
const FIG = { h:0.66, cy:0.50 };                     // the figure's height as a share of the stage, and where its centre sits (0 = bottom)
// the face, measured on bob-grin.png (846×1209, pixel coords, y down; squish/tools/face.py): the lens whites and irises (centre,
// radius), each lower lid's edge as a parabola across its lens (a + b·x + c·x², in lens radii, up from the centre; this render
// has no lower lid, so the edge sits at the lens's bottom, −1, and the lids the shader draws wear the cheek skin), the mouth
// corners, and a patch of cheek skin for the lids. The irises follow the pointer inside the whites; pulled, the lids squeeze
// shut and the mouth corners sag; let go and he smiles again.
const FACE = {
  eyes:[ { white:[265, 248.5, 122.8], iris:[295, 244, 54.9], lid:[-1, 0, 0] }, { white:[590.5, 249, 122.2], iris:[546, 244, 54.9], lid:[-1, 0, 0] } ],
  mouth:{ left:[257, 550], right:[441, 568], radius:48 },
  skin:[427, 437],
};

/* ---------- renderer: a square stage, uv in [0,1]², the paper shows through ---------- */
const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:false });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.autoClear = false;
stage.appendChild(renderer.domElement);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ---------- the rubber: a sheet of G×G cells over the stage, every node carrying a displacement u from where it belongs,
   obeying a damped wave equation with a restoring term (the way rameerez.com's plushie does it):
       ü = c²∇²u − ω²·u − γ·u̇ + ν∇²u̇
   ∇²u is the skin pulling on its neighbours (a pull drags the area around it, waves travel outward on release), −ω²u is the
   skin's attachment to the body underneath (stiffer the further it is from home, so it cannot be pulled out forever), γ is
   how fast the wobble dies, ν∇²u̇ swallows fine ripples while the big slow wobble carries on. The hand is a small round brush
   in the DEFORMED picture: whatever skin is under it takes on the hand's speed, fully at the centre, less toward the rim.
   On top, the whole figure leans toward the pull on a slower, floppier spring, like a toy on soft feet. ---------- */
const G = 80, S = G + 1, N = S * S;                     // cells per side over the stage, nodes per side, nodes
const OPT = { wobble: 2.4, reach: 0.1, damping: 0.16, flesh: 0.35, grabRadius: 0.13, maxPull: 0.55, sway: 1, poisson: 2.5, gummy: 1 };   // Hz; the rest in figure widths (the handful is a palm's worth of a small figure, not a pinch); poisson = how much a stretched bit draws in from the sides; gummy = the roundness shading of a stretched bit
const HARDEST = 8, GRIP = 2500, MAX_STEPS = 48;        // stiffest over-stretched skin gets; how fast held skin takes the hand's speed; steps a frame may afford
const ux = new Float32Array(N), uy = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N), axA = new Float32Array(N), ayA = new Float32Array(N);
const fixed = new Uint8Array(N), lean = new Float32Array(N), lift = new Float32Array(N), strain = new Float32Array(N), divg = new Float32Array(N);
const FEET_Y = FIG.cy - FIG.h / 2;                     // where he stands (stage uv, y up): the pivot of the lean
for (let j = 0; j < S; j++) for (let i = 0; i < S; i++){
  const k = j * S + i, v = j / G;
  fixed[k] = (i === 0 || j === 0 || i === G || j === G) ? 1 : 0;   // the stage's rim never moves
  const t = Math.max(0, Math.min(1, (v - FEET_Y) / (FIG.h * 0.85)));   // how much a node follows the lean: 0 at the feet, 1 up at the head
  lean[k] = t * t * (3 - 2 * t);
}
let figW = 0.6;                                         // the figure's width in stage units (set once the picture is in)
const cellsPerFig = () => G * figW;                     // cells across the figure
function physics(){
  const cells = cellsPerFig(), w = 2 * Math.PI * OPT.wobble, c = OPT.reach * cells * w;
  return { cells, w, w2: w * w, c, c2: c * c, bulk: OPT.poisson * c * c, gamma: 2 * OPT.damping * w, nu: OPT.flesh * c, limit: (OPT.maxPull * cells) ** 2 };
}
function accelerate(p){
  for (let j = 1; j < G; j++) for (let i = 1; i < G; i++){ const k = j * S + i; divg[k] = (ux[k + 1] - ux[k - 1] + uy[k + S] - uy[k - S]) * 0.5; }   // how much the skin has spread here
  for (let j = 1; j < G; j++) for (let i = 1; i < G; i++){
    const k = j * S + i; if (fixed[k]) continue;
    const x = ux[k], y = uy[k];
    const hard = p.w2 * Math.min(HARDEST, 1 + (x * x + y * y) / p.limit);   // skin resists harder the further it is from home
    // the rubber keeps its volume: skin spread thin pulls its surroundings in (∇(∇·u)), so a stretched bit necks like taffy
    axA[k] = p.c2 * (ux[k - 1] + ux[k + 1] + ux[k - S] + ux[k + S] - 4 * x) + p.bulk * (divg[k + 1] - divg[k - 1]) * 0.5 - hard * x - p.gamma * vx[k] + p.nu * (vx[k - 1] + vx[k + 1] + vx[k - S] + vx[k + S] - 4 * vx[k]);
    ayA[k] = p.c2 * (uy[k - 1] + uy[k + 1] + uy[k - S] + uy[k + S] - 4 * y) + p.bulk * (divg[k + S] - divg[k - S]) * 0.5 - hard * y - p.gamma * vy[k] + p.nu * (vy[k - 1] + vy[k + 1] + vy[k - S] + vy[k + S] - 4 * vy[k]);
  }
}
function brush(hx, hy, hvx, hvy, radius, grip, dt){   // whatever skin is under the brush takes on the hand's speed; flat-topped, so the handful moves as one lump
  const r2 = radius * radius;
  for (let j = 1; j < G; j++) for (let i = 1; i < G; i++){
    const k = j * S + i; if (fixed[k]) continue;
    const dx = i + ux[k] - hx, dy = j + uy[k] - hy, d2 = dx * dx + dy * dy;
    if (d2 >= r2) continue;
    const q = 1 - d2 / r2, hold = Math.min(1, q * q * 2.4), blend = 1 - Math.exp(-grip * hold * dt);
    vx[k] += (hvx - vx[k]) * blend; vy[k] += (hvy - vy[k]) * blend;
  }
}
function step(p, dt, hx, hy, hvx, hvy, radius, grip){
  accelerate(p);
  for (let k = 0; k < N; k++){ if (fixed[k]) continue; vx[k] += axA[k] * dt; vy[k] += ayA[k] * dt; }
  if (grip > 0) brush(hx, hy, hvx, hvy, radius, grip, dt);
  for (let k = 0; k < N; k++){ if (fixed[k]) continue; ux[k] += vx[k] * dt; uy[k] += vy[k] * dt; }
}
// run the sheet for `elapsed` seconds while the brush goes from one point to another at the given speed. The integrator is
// explicit, so each step must be short enough for the stiffest thing in the sheet (K·dt² + 2·d·dt < 4), and short enough
// that the brush never jumps past the skin it holds (half its radius at a time); past the frame's budget he runs in slow motion
function simulate(p, elapsed, fromX, fromY, toX, toY, hvx, hvy, radius, grip){
  const K = 8 * p.c2 + 2 * p.bulk + HARDEST * p.w2, d = p.gamma + 8 * p.nu;   // (the volume term's stiffest mode is 2·bulk)
  const stable = (0.8 * (Math.sqrt(d * d + 4 * K) - d)) / K;
  const reach = grip > 0 && radius > 0 ? Math.ceil(Math.hypot(toX - fromX, toY - fromY) / (radius * 0.5)) : 0;
  const steps = Math.min(MAX_STEPS, Math.max(2, Math.ceil(elapsed / stable), reach));
  const dt = Math.min(elapsed / steps, stable), slowed = elapsed / (steps * dt);
  for (let n = 1; n <= steps; n++){ const f = n / steps; step(p, dt, fromX + (toX - fromX) * f, fromY + (toY - fromY) * f, hvx * slowed, hvy * slowed, radius, grip); }
  let bad = false; for (let k = 0; k < N; k += 97) if (!Number.isFinite(ux[k] + vx[k])) bad = true;
  if (bad){ ux.fill(0); uy.fill(0); vx.fill(0); vy.fill(0); }   // numbers that have run away cannot recover by themselves
}
// the whole figure: a slow, floppy lean toward wherever it is being pulled, about the feet, on its own softer spring
const head = { tilt: 0, tiltV: 0, x: 0, xV: 0, y: 0, yV: 0 };
function swayStep(p, dt, pullX, pullY){
  const px = pullX / p.cells, py = pullY / p.cells;    // the pull in figure widths
  const w = 2 * Math.PI * 1.25, k = w * w, c = 2 * 0.2 * w;
  const tiltTo = -px * 0.3 * OPT.sway, xTo = px * 0.06 * OPT.sway, yTo = py * 0.08 * OPT.sway;
  head.tiltV += (k * (tiltTo - head.tilt) - c * head.tiltV) * dt; head.tilt += head.tiltV * dt;
  head.xV += (k * (xTo - head.x) - c * head.xV) * dt; head.x += head.xV * dt;
  head.yV += (k * (yTo - head.y) - c * head.yV) * dt; head.y += head.yV * dt;
}
/* ---------- the sheet as geometry: a node = a vertex; each frame it gets its displacement (skin + lean) and its relief ---------- */
const sheet = new THREE.BufferGeometry();
{
  const pos = new Float32Array(N * 3), uvs = new Float32Array(N * 2), idx = [];
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++){ const k = j * S + i; pos[k * 3] = -1 + 2 * i / G; pos[k * 3 + 1] = -1 + 2 * j / G; uvs[k * 2] = i / G; uvs[k * 2 + 1] = j / G; }
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++){ const a = j * S + i, b = a + 1, c = a + S, d = c + 1; idx.push(a, b, d, a, d, c); }
  sheet.setAttribute('position', new THREE.BufferAttribute(pos, 3)); sheet.setAttribute('uv', new THREE.BufferAttribute(uvs, 2)); sheet.setIndex(idx);
  sheet.setAttribute('disp', new THREE.BufferAttribute(new Float32Array(N * 2), 2)); sheet.setAttribute('relief', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
}
function shade(){                                       // where every node is drawn, and the relief: pulled skin tents up toward the viewer, squeezed skin ridges
  const disp = sheet.getAttribute('disp').array, rel = sheet.getAttribute('relief').array, cells = cellsPerFig();
  for (let j = 1; j < G; j++) for (let i = 1; i < G; i++){
    const k = j * S + i;
    const uxx = (ux[k + 1] - ux[k - 1]) * 0.5, uxy = (ux[k + S] - ux[k - S]) * 0.5, uyx = (uy[k + 1] - uy[k - 1]) * 0.5, uyy = (uy[k + S] - uy[k - S]) * 0.5;
    const area = (1 + uxx) * (1 + uyy) - uxy * uyx - 1;
    lift[k] = Math.hypot(ux[k], uy[k]) * 0.16 - Math.max(-1, Math.min(1.5, area)) * 0.9;
    strain[k] = Math.hypot(uxx, uyy, (uxy + uyx) * 0.7071);   // how stretched (or squashed) the skin is here
  }
  const nx = 0.5 * G, ny = FEET_Y * G, cosT = Math.cos(head.tilt), sinT = Math.sin(head.tilt), hx = head.x * cells, hy = head.y * cells;
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++){
    const k = j * S + i, rx = i - nx, ry = j - ny, b = lean[k];
    disp[k * 2] = (ux[k] + b * (cosT * rx - sinT * ry - rx + hx)) / G;
    disp[k * 2 + 1] = (uy[k] + b * (sinT * rx + cosT * ry - ry + hy)) / G;
    const inner = i > 0 && j > 0 && i < G && j < G;
    rel[k * 3] = inner ? (lift[k + 1] - lift[k - 1]) * 0.5 : 0; rel[k * 3 + 1] = inner ? (lift[k + S] - lift[k - S]) * 0.5 : 0; rel[k * 3 + 2] = strain[k];
  }
  sheet.getAttribute('disp').needsUpdate = true; sheet.getAttribute('relief').needsUpdate = true;
}

/* ---------- the picture, carried by the sheet ---------- */
const drawMat = new THREE.ShaderMaterial({
  vertexShader:`attribute vec2 disp; attribute vec3 relief; varying vec2 vUv; varying vec3 vRelief;
  void main(){ vUv = uv; vRelief = relief; gl_Position = vec4((uv + disp) * 2.0 - 1.0, 0.0, 1.0); }`,
  fragmentShader:`
  precision highp float; varying vec2 vUv; varying vec3 vRelief;
  uniform sampler2D calm, texA, texB; uniform float faceMix, aCalm, bCalm, breath, lid, squeeze, wide, frown; uniform vec2 figPos, figSize, gaze, skin, mouthL, mouthR, mouthRad; uniform sampler2D thick; uniform vec2 thickPx; uniform float gummy;
  uniform vec4 eyeW[2], eyeI[2]; uniform vec3 lidC[2];  // per eye: the white's centre and radii, the iris's centre and radii (picture uv), the lower lid's curve
  vec4 picCalm(vec2 q){ return texture2D(calm, q); }   // the eyes are drawn from the calm take; every take has the same eyes, only the mouth differs
  bool inLens(vec2 q){ for (int i = 0; i < 2; i++){ vec2 d = (q - eyeW[i].xy) / eyeW[i].zw; if (dot(d, d) < 1.0) return true; } return false; }
  vec4 face(vec2 q){
    // the mouth corners sag with the strain: pixels around a corner read from a little above, so the corner comes down
    vec2 dl = (q - mouthL) / mouthRad, dr = (q - mouthR) / mouthRad;
    q.y += frown * 0.045 * (exp(-dot(dl,dl)*1.5) + exp(-dot(dr,dr)*1.5));
    for (int i = 0; i < 2; i++){
      vec4 W = eyeW[i], I = eyeI[i]; vec3 LC = lidC[i];
      vec2 dW = (q - W.xy) / W.zw;
      if (dot(dW, dW) < 1.0){                           // inside the lens
        vec4 white = (picCalm(W.xy + vec2(-0.35, 0.62) * W.zw) + picCalm(W.xy + vec2(0.0, 0.72) * W.zw) + picCalm(W.xy + vec2(0.35, 0.62) * W.zw)) / 3.0;   // clean white off the upper ring, which nothing ever covers
        white.rgb *= 1.0 - 0.05 * smoothstep(0.75, 1.0, length(dW));
        vec4 lidCol = picCalm(skin); bool noLid = LC.x < -0.98;   // the cheek's skin; a render with no lower lid drawn gets its lids in that colour
        float lid0 = LC.x + LC.y * dW.x + LC.z * dW.x * dW.x;   // where his lower lid's edge is at rest
        float rim = W.y - (sqrt(1.0 - min(0.998, dW.x * dW.x)) - 0.03) * W.w;   // the lens's bottom in this column (the lid's skin repeats below it)
        // pulled: an upper lid comes down (a curve, lowest in the middle). The render has none, so it wears the lower lid's skin
        // mirrored: as far into the upper lid as a pixel is, that far below the lower lid's edge it reads
        float top = 1.0 - 2.0 * lid + 0.22 * dW.x * dW.x;
        if (lid > 0.001 && dW.y > top){
          float d = dW.y - top; vec2 s = vec2(q.x, max(rim, W.y + (lid0 - 0.02 - d) * W.w));
          vec2 ds = (s - I.xy) / I.zw; vec4 c = noLid ? lidCol : (dot(ds, ds) < 1.35 ? picCalm(s - vec2(0.0, 0.025)) : picCalm(s));
          if (d < 0.12) c.rgb *= 0.85; return c;
        }
        // his own lower lid, as drawn (its curve and shading): it slides up with the squeeze and drops when he is wide-eyed, so
        // this pixel is lid if the pixel that far below or above it was lid at rest; past the lens's bottom, the bottom row repeats
        float shift = squeeze * 0.5 - wide * 0.45;
        if (dW.y < lid0 + shift){
          if (noLid){ vec4 c = lidCol; if (dW.y > lid0 + shift - 0.1) c.rgb *= 0.85; return c; }   // a lower lid of plain skin, shaded along its edge
          vec2 s = vec2(q.x, max(rim, q.y - shift * W.w));
          vec2 ds = (s - I.xy) / I.zw;
          return dot(ds, ds) < 1.35 ? picCalm(s - vec2(0.0, 0.025)) : picCalm(s);   // (along the iris's old edge, read clean lid from a little lower)
        }
        vec2 d0 = (q - I.xy) / I.zw, dI = (q - I.xy - gaze) / I.zw;
        if (dot(dI, dI) < 1.0){                        // the iris, moved toward the pointer; the part his lid hid at rest is mirrored from the top half
          vec2 sp = q - gaze; vec2 dsp = (sp - W.xy) / W.zw;
          if (dsp.y < LC.x + LC.y * dsp.x + LC.z * dsp.x * dsp.x + 0.02) sp.y = 2.0 * I.y - sp.y;
          return picCalm(sp);
        }
        if (dW.y < lid0 + 0.02){                       // the white his dropped lid uncovered: the white just above the lid's edge, mirrored down
          vec2 m = vec2(q.x, q.y + 2.0 * (lid0 + 0.02 - dW.y) * W.w); vec2 dm = (m - I.xy) / I.zw, dmW = (m - W.xy) / W.zw;
          return (dot(dm, dm) < 1.35 || dot(dmW, dmW) > 0.95) ? white : picCalm(m);
        }
        if (dot(d0, d0) < 1.35) return white;         // the spot the iris left (with its soft edge)
        return picCalm(q);
      }
    }
    return picCalm(q);
  }
  void main(){
    vec2 p = vUv;                                       // the rest position on the sheet: the picture is painted on it (his shadow is on the ground, with the teddies')
    vec2 q = (p - figPos) / figSize + 0.5;              // into the picture's own uv
    q.y = (q.y - 0.0) / breath;                         // idle breath: a hair taller, feet planted at the picture's bottom
    if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0){ gl_FragColor = vec4(0.0); return; }
    // the take on show, cut from the previous one over a few frames; the calm take is the drawn face (eyes that follow, lids)
    bool eye = inLens(q);
    vec4 drawn = (eye || aCalm > 0.5 || bCalm > 0.5) ? face(q) : vec4(0.0);
    vec4 colB = (eye || bCalm > 0.5) ? drawn : texture2D(texB, q);
    vec4 col = faceMix >= 1.0 ? colB : mix((eye || aCalm > 0.5) ? drawn : texture2D(texA, q), colB, faceMix);
    // the rubber's relief (from the sheet): pulled skin tents up, squeezed skin ridges; lit from the upper left, bright on the lit
    // flank, darker on the far one, a soft highlight on the crest; thin, hard-stretched rubber pales a little
    vec2 slope = vRelief.xy * 0.9;
    vec3 nrm = normalize(vec3(-slope, 1.0)); vec3 L = normalize(vec3(-0.45, 0.6, 0.75));
    float diff = dot(nrm, L) - L.z;
    float spec = pow(max(0.0, dot(reflect(-L, nrm), vec3(0.0, 0.0, 1.0))), 28.0) * min(1.0, length(slope) * 1.5) * 0.22;
    float e = vRelief.z;                                // how hard this bit of rubber is stretched

    // lifted off the floor, it shrinks and fades the way the teddies' do; pressed down into the floor, it spreads a little
    const row = Math.round(FEET_Y * G) * S, half = Math.round(G * figW * 0.2), fw = figW * 0.95;
    const kL = row + (G >> 1) - half, kM = row + (G >> 1), kR = row + (G >> 1) + half;
    const sx = (ux[kL] + ux[kM] + ux[kR]) / (3 * G), lift = (uy[kL] + uy[kM] + uy[kR]) / (3 * G);   // stage units: sideways, and up off the floor (negative = pushed into it)
    const up = Math.max(0, lift), down = Math.max(0, -lift), sc = Math.max(0.3, 1 - up * 1.8) * (1 + Math.min(0.35, down * 1.2));
    feetShadow.style.left = ((0.5 + sx - fw / 2) * 100) + '%'; feetShadow.style.top = ((1 - FEET_Y + 0.004 - fw * 0.13) * 100) + '%';
    feetShadow.style.transform = `scale(${sc.toFixed(3)})`; feetShadow.style.opacity = Math.max(0, 1 - up * 2.6).toFixed(3); }
  // where he looks: toward the pointer, as far as the iris can go once the pointer is a third of the stage away
  if (lookAt && now - lookTime < 2500){
    const fp = drawMat.uniforms.figPos.value, fs = drawMat.uniforms.figSize.value;
    const d = lookAt.clone().sub(new THREE.Vector2(fp.x + (EYE_MID.x - 0.5) * fs.x, fp.y + (EYE_MID.y - 0.5) * fs.y));
    const m = Math.min(1, d.length() / 0.33); gazeT.copy(d).normalize().multiplyScalar(m);
  } else gazeT.set(0, 0);
  gazeS.lerp(gazeT, Math.min(1, dt * 12));
  drawMat.uniforms.gaze.value.set(gazeS.x * GAZE_MAX.x, gazeS.y * GAZE_MAX.y);
  drawMat.uniforms.breath.value = 1 + Math.sin(now/1000*2.1) * 0.006;
  renderer.clear(); renderer.render(drawScene, cam);
  requestAnimationFrame(frame);
}
</script>
