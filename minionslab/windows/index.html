<script src="../bosshistory/assets/vendor/three.js"></script>
<script>
// Minion Windows — a red mural house and a beige walk-up; Minions keep tumbling out of the windows,
// and a trampoline that follows your pointer catches them. Hover a window to see who's in; click to send them out.
// Same pixel engine as the Gumball Slide (4 Minion 糖果机): plain three.js geometry rendered small,
// snapped to a fixed palette with ordered dithering, shown enlarged with hard pixels, transparent sky.
// Palette, renderer, helpers, minion() and the pixel pass are copied from there — keep them in step.

const RES = 242;            // render size in pixels (square); 2× = 484 px, the Pixel Town card
const VIEW = 44.5;          // world units across the frame
const T = THREE;
T.ColorManagement.enabled = false;   // colours are used exactly as written

// ---------- palette ----------
const PALETTE = [
  '#ffffff', '#f3efe4', '#d6d3cc', '#a7a6ad', '#74737c', '#46454e', '#1f1e26',
  '#fff38f', '#ffd93b', '#f0b42a', '#b9801c', '#6e4a17',
  '#a9d1f5', '#5f97e0', '#3a66b8', '#243f78',
  '#ffd6e4', '#ff9cc0', '#ec5f8e', '#a8325d',
  '#ff5a4f', '#c62f35', '#7a1c25',
  '#d3ec8a', '#9fd05a', '#6aab3e', '#3f7d2f', '#28502a',
  '#e7c493', '#c39a62', '#8a6a45', '#5a4330',
  '#bff0fb', '#62cbe8', '#2c93b8',
  '#c7a0f0', '#f39a3b',
];
const C = Object.fromEntries([
  ['white', 0], ['cream', 1], ['silverL', 2], ['silver', 3], ['steel', 4], ['charcoal', 5], ['ink', 6],
  ['yellowL', 7], ['yellow', 8], ['yellowD', 9], ['ochre', 10], ['brown', 11],
  ['denimL', 12], ['denim', 13], ['denimD', 14], ['navy', 15],
  ['pinkL', 16], ['pink', 17], ['pinkD', 18], ['berry', 19],
  ['red', 20], ['redD', 21], ['maroon', 22],
  ['grassL', 23], ['grass', 24], ['grassM', 25], ['grassD', 26], ['grassDD', 27],
  ['sand', 28], ['dirt', 29], ['dirtD', 30], ['dirtDD', 31],
  ['waterL', 32], ['water', 33], ['waterD', 34],
  ['lilac', 35], ['orange', 36],
].map(([k, i]) => [k, PALETTE[i]]));

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(RES, RES, false);
renderer.setClearColor(0xffffff, 0);   // white at zero alpha: the glass blends toward white, the sky stays see-through
renderer.outputColorSpace = T.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.BasicShadowMap;

// window.GUMBALL_PAD = [x, y] reserves room around the canvas (the site's header and keys).
// At most 2× (650 px — the width of the site's Teardown card and key row, and a clean whole-number
// zoom of RES 325); narrower screens get the full width less the 16 px gutters, short ones what fits.
function fit() {
  const [px, py] = window.GUMBALL_PAD || [32, 32];
  const size = Math.min(RES * 2, innerWidth - px, innerHeight - py);
  canvas.style.width = canvas.style.height = Math.round(Math.max(RES * 0.5, size)) + 'px';
}
fit(); addEventListener('resize', fit);

const scene = new T.Scene();
// the frame is raised a touch (LIFT world units) so the island, globe to grass edge, sits in the middle of the square
const LIFT = 0.55;
const cam = new T.OrthographicCamera(-VIEW / 2, VIEW / 2, VIEW / 2 + LIFT, -VIEW / 2 + LIFT, 0.1, 200);
cam.position.set(40, 33, 40);
cam.lookAt(0, 7.0, 0);

// three r155+ lights are physical: a Lambert face gets colour × intensity / π
scene.add(new T.HemisphereLight(0xffffff, 0xd8d0c0, 0.5 * Math.PI));
const sun = new T.DirectionalLight(0xfff6e8, 0.55 * Math.PI);
sun.position.set(-6, 30, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -27, right: 27, top: 27, bottom: -27, near: 1, far: 90 });
sun.shadow.bias = -0.002;
scene.add(sun);

// ---------- helpers ----------
const mat = (hex, extra = {}) => new T.MeshLambertMaterial({ color: hex, ...extra });
function mesh(geo, material, x = 0, y = 0, z = 0, parent = scene) {
  const m = new T.Mesh(geo, typeof material === 'string' ? mat(material) : material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d) => new T.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 16) => new T.CylinderGeometry(rt, rb, h, seg);
const sph = (r, seg = 16) => new T.SphereGeometry(r, seg, Math.max(8, seg * 0.75));

// deterministic noise so the still is the same every load
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}



// ---------- layout ----------
// Two buildings stand side by side along x with their fronts at z = FRONT, facing the camera's left.
// The red house is on the left, the beige walk-up on the right; its right side wall is also in view.
const FRONT = -3;
const RED = { x0: -12.5, x1: -1.5, h: 12, d: 7 };
const BEIGE = { x0: -1.5, x1: 8, h: 15.5, d: 7 };
const PPU = 8;   // texture pixels per world unit on the facades

// painted surfaces (the mural, the brick) show their own colours more than the light's, like the gumballs
function paint(tex, mix = 0.45, color) {
  const m = new T.MeshLambertMaterial(tex ? { map: tex } : { color });
  m.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `outgoingLight = mix(outgoingLight, diffuseColor.rgb, ${mix.toFixed(2)});\n#include <opaque_fragment>`); };
  return m;
}
const brightCache = {};
const bright = (hex, mix = 0.4) => brightCache[hex + mix] || (brightCache[hex + mix] = paint(null, mix, hex));

// ---------- painted textures ----------
function canvasTex(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const tex = new T.CanvasTexture(cv); tex.magFilter = tex.minFilter = T.NearestFilter; tex.generateMipmaps = false;
  return { cv, g, tex };
}
// brick: courses of bricks with mortar lines, a few darker bricks for life
function bricks(g, w, h, face, dark, mortar) {
  g.fillStyle = mortar; g.fillRect(0, 0, w, h);
  for (let row = 0; row * 3 < h; row++) for (let col = -1; col * 6 < w; col++) {
    g.fillStyle = hash(row * 3.1, col * 7.7) < 0.18 ? dark : face;
    g.fillRect(col * 6 + (row % 2) * 3, row * 3, 5, 2);
  }
}
const px = (g, col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); };
function blob(g, col, cx, cy, rx, ry) {   // a pixel ellipse
  g.fillStyle = col;
  for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
    if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1);
}
function cloud(g, cx, cy, s) {
  for (const [dx, dy, r] of [[-1.4, 0.3, 1.0], [0, -0.3, 1.3], [1.4, 0.3, 1.0], [0.6, 0.6, 0.9], [-0.6, 0.6, 0.9]])
    blob(g, C.white, cx + dx * s, cy + dy * s, r * s, r * s * 0.8);
}
function daisy(g, cx, cy, r) {
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; blob(g, C.white, cx + Math.cos(a) * r, cy + Math.sin(a) * r, r * 0.6, r * 0.6); }
  blob(g, C.yellow, cx, cy, r * 0.5, r * 0.5);
}
function rainbow(g, cx, cy, r) {
  const bands = [C.red, C.orange, C.yellow, C.grass, C.denimL, C.lilac];
  for (let y = -r; y <= 0; y++) for (let x = -r; x <= r; x++) {
    const d = Math.sqrt(x * x + y * y), k = Math.floor((r - d) / 1.3);
    if (k >= 0 && k < bands.length) px(g, bands[k], cx + x, cy + y);
  }
}

// street trees: yellow-green, like the photo's autumn acacias
const TREES = [[-14.2, 3.5], [-14.0, 8.2], [12.8, 1.0], [12.6, -5.5]];

// ---------- ground: paving in front, a grass rim with a ragged edge ----------
const G = 36, GT = 360;
(function ground() {
  const { cv, g, tex } = canvasTex(GT, GT);
  const img = g.createImageData(GT, GT);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  for (let j = 0; j < GT; j++) for (let i = 0; i < GT; i++) {
    const x = (i + 0.5) / GT * G - G / 2, z = (j + 0.5) / GT * G - G / 2;
    const n = vnoise(x * 0.9, z * 0.9) * 0.6 + vnoise(x * 3, z * 3) * 0.4;
    const R = 16.6, e = Math.pow(Math.pow(Math.abs(x) / R, 4) + Math.pow(Math.abs(z) / R, 4), 0.25);
    const edge = e + (n - 0.5) * 0.14 + (hash(i, j) - 0.5) * 0.06;
    let col = null;
    if (edge < 1) {
      const fine = hash(i * 3, j * 7);
      col = n > 0.66 ? C.grass : n < 0.4 ? C.grassD : C.grassM;
      if (edge > 0.93) col = fine < 0.5 ? C.grassM : C.grass;
      // the street front: big pale pavers from the buildings to the kerb
      if (z > FRONT - 0.2 && z < 9.5 && edge < 0.9) {
        const t = ((Math.floor(x * 0.9) + Math.floor(z * 0.9)) & 1) ? C.cream : C.silverL;
        col = fine < 0.06 ? C.silver : t;
      }
      // a dark kerb and a strip of road along the front
      if (z >= 9.5 && z < 10.0 && edge < 0.92) col = C.steel;
      if (z >= 10.0 && z < 14.5 && edge < 0.92) {
        col = fine < 0.08 ? C.steel : C.charcoal;
        if (z > 12.0 && z < 12.4 && Math.floor(x / 1.6) % 2 === 0) col = C.yellowL;   // centre dashes
      }
      // tree beds: round patches of grass in the paving
      for (const [tx, tz] of TREES) if (Math.hypot(x - tx, z - tz) < 1.5) col = fine < 0.3 ? C.grass : C.grassM;
    }
    const k = (j * GT + i) * 4;
    if (col) { const [r, gg, b] = hex(col); img.data.set([r, gg, b, 255], k); } else img.data.set([0, 0, 0, 0], k);
  }
  g.putImageData(img, 0, 0); tex.needsUpdate = true;
  const m = mesh(new T.PlaneGeometry(G, G), new T.MeshLambertMaterial({ map: tex, alphaTest: 0.5 }));
  m.rotation.x = -Math.PI / 2; m.castShadow = false;
})();

// ---------- the red mural house ----------
const redWindows = [];   // [x, y] centres of the tall pink windows, for the Minions later
(function redHouse() {
  const { x0, x1, h, d } = RED, w = x1 - x0, cx = (x0 + x1) / 2, cz = FRONT - d / 2;
  mesh(box(w, h, d), C.redD, cx, h / 2, cz);
  // facade: bricks + the mural (clouds, rainbows, daisies, a sun) painted straight onto the wall
  const W = w * PPU, H = h * PPU, { g, tex } = canvasTex(W, H);
  bricks(g, W, H, C.red, C.redD, C.maroon);
  const at = (wx, wy) => [(wx - x0) * PPU, (h - wy) * PPU];   // world facade coords → texture pixels
  blob(g, C.yellowL, ...at(x1 - 1.6, h - 1.6), 7, 7);                       // the sun, top right
  for (let i = 0; i < 8; i++) { const a = Math.PI * (0.55 + i * 0.13), [sx, sy] = at(x1 - 1.6, h - 1.6);
    for (let r = 9; r < 15; r++) px(g, C.yellow, sx + Math.cos(a) * r, sy + Math.sin(a) * r); }
  cloud(g, ...at(x0 + 2.2, h - 2.4), 8); cloud(g, ...at(x0 + 7.0, h - 5.2), 7); cloud(g, ...at(x1 - 2.4, h - 5.6), 7);
  cloud(g, ...at(x0 + 1.6, 2.6), 7); cloud(g, ...at(x1 - 1.4, 2.2), 6);
  rainbow(g, ...at(x0 + 3.0, 5.0), 13); rainbow(g, ...at(x0 + 8.4, 2.4), 12);
  for (const [dx, dy, r] of [[4.6, 8.4, 3], [9.4, 7.4, 3], [1.2, 4.6, 3], [6.2, 1.4, 3], [10.2, 3.6, 2.5]]) daisy(g, ...at(x0 + dx, dy), r);
  tex.needsUpdate = true;
  mesh(new T.PlaneGeometry(w, h), paint(tex), cx, h / 2, FRONT + 0.02);
  mesh(box(w, 0.1, d), C.steel, cx, h + 0.62, cz);
  mesh(box(0.9, 1.8, 0.9), C.redD, x0 + 2.0, h + 1.2, cz - 1.5);   // chimney
  // cream cornice and a little parapet
  mesh(box(w + 0.4, 0.6, d + 0.4), C.cream, cx, h + 0.3, cz);
  mesh(box(w + 0.6, 0.25, 0.5), C.sand, cx, h - 0.25, FRONT + 0.2);
  // tall pink windows with white balcony railings, two rows
  for (const wy of [5.2, 8.8]) for (const wx of [x0 + 2.3, x0 + 4.8, x0 + 7.3]) {
    mesh(box(1.1, 2.0, 0.12), C.pink, wx, wy, FRONT + 0.06);
    mesh(box(0.08, 2.0, 0.14), C.pinkD, wx, wy, FRONT + 0.08);              // the two leaves meet in the middle
    mesh(box(1.4, 0.12, 0.5), C.white, wx, wy - 1.05, FRONT + 0.25);        // balcony floor
    mesh(box(1.4, 0.08, 0.06), C.ink, wx, wy - 0.6, FRONT + 0.48);          // railing top
    for (let k = -3; k <= 3; k++) mesh(box(0.05, 0.45, 0.05), C.ink, wx + k * 0.2, wy - 0.82, FRONT + 0.48);
    redWindows.push([wx, wy]);
  }
  // ground floor: purple-framed blue door under the HOME FOR GIRLS arch, iron fence either side
  const gx = x0 + 8.4;
  mesh(box(1.9, 3.0, 0.15), C.lilac, gx, 1.5, FRONT + 0.06);
  mesh(box(1.5, 2.7, 0.18), C.denim, gx, 1.35, FRONT + 0.08);
  const sign = canvasTex(40, 9);
  sign.g.fillStyle = C.redD; sign.g.fillRect(0, 0, 40, 9); sign.g.fillStyle = C.white; sign.g.fillRect(1, 1, 38, 1); sign.g.fillRect(1, 7, 38, 1);
  for (let i = 0; i < 12; i++) sign.g.fillRect(3 + i * 3, 3, 2, 3);       // stand-in lettering: at this size it reads as text
  sign.tex.needsUpdate = true;
  const arch = mesh(box(3.4, 0.8, 0.14), new T.MeshLambertMaterial({ map: sign.tex }), gx, 3.6, FRONT + 0.7);
  arch.rotation.z = 0.06;
  for (const sx of [-1.6, 1.6]) mesh(box(0.1, 3.6, 0.1), C.ink, gx + sx, 1.8, FRONT + 0.7);
  for (let fx = x0 + 0.6; fx < x1 - 0.2; fx += 0.32) if (Math.abs(fx - gx) > 1.7) mesh(box(0.06, 1.3, 0.06), C.ink, fx, 0.65, FRONT + 0.7);
  for (const fy of [0.25, 1.15]) {
    mesh(box(gx - 1.7 - x0 - 0.5, 0.06, 0.06), C.ink, (x0 + 0.5 + gx - 1.7) / 2, fy, FRONT + 0.7);
    mesh(box(x1 - 0.2 - gx - 1.7, 0.06, 0.06), C.ink, (gx + 1.7 + x1 - 0.2) / 2, fy, FRONT + 0.7);
  }
})();

// ---------- the beige walk-up ----------
const beigeWindows = [];   // [x, y, z, facing] window sills, for the Minions
(function beigeBuilding() {
  const { x0, x1, h, d } = BEIGE, w = x1 - x0, cx = (x0 + x1) / 2, cz = FRONT - d / 2;
  mesh(box(w, h, d), C.sand, cx, h / 2, cz);
  for (const [face, len] of [['front', w], ['side', d]]) {
    const W = len * PPU, H = h * PPU, { g, tex } = canvasTex(W, H);
    bricks(g, W, H, C.sand, C.dirt, C.cream);
    // white quoins and a band between floors
    g.fillStyle = C.cream; g.fillRect(0, 0, 4, H); g.fillRect(W - 4, 0, 4, H);
    for (const fy of [3.4, 6.4, 9.4, 12.4]) g.fillRect(0, (h - fy) * PPU, W, 3);
    tex.needsUpdate = true;
    const m = mesh(new T.PlaneGeometry(len, h), paint(tex, 0.35), 0, h / 2, 0);
    if (face === 'front') m.position.set(cx, h / 2, FRONT + 0.02);
    else { m.position.set(x1 + 0.02, h / 2, cz); m.rotation.y = Math.PI / 2; }
  }
  // roof: a wooden water tower on stilts and two vents, New York style
  mesh(box(w - 0.4, 0.1, d - 0.4), C.silver, cx, h + 0.85, cz);
  for (const [dx, dz] of [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]]) mesh(box(0.15, 1.6, 0.15), C.charcoal, x0 + 6.2 + dx, h + 1.7, cz - 0.6 + dz);
  mesh(cyl(1.25, 1.25, 2.0, 12), C.dirtD, x0 + 6.2, h + 3.5, cz - 0.6);
  mesh(new T.ConeGeometry(1.45, 1.0, 12), C.charcoal, x0 + 6.2, h + 5.0, cz - 0.6);
  for (const vx of [x0 + 1.8, x0 + 3.2]) mesh(box(0.9, 0.7, 0.9), C.silverL, vx, h + 1.2, cz + 1.2);
  // heavy white cornice with brackets
  mesh(box(w + 0.6, 0.9, d + 0.6), C.cream, cx, h + 0.15, cz);
  mesh(box(w + 0.9, 0.3, d + 0.9), C.white, cx, h + 0.7, cz);
  for (let bx = x0 + 0.4; bx < x1; bx += 1.1) mesh(box(0.3, 0.5, 0.3), C.white, bx, h - 0.5, FRONT + 0.15);
  // windows: dark panes in white frames, a red awning over each, a flower box under
  const win = (x, y, z, rotY) => {
    const grp = new T.Group(); grp.position.set(x, y, z); grp.rotation.y = rotY; scene.add(grp);
    mesh(box(1.4, 1.9, 0.12), C.white, 0, 0, 0.04, grp);
    mesh(box(1.1, 1.6, 0.14), C.navy, 0, 0, 0.06, grp);
    mesh(box(0.08, 1.6, 0.16), C.white, 0, 0, 0.08, grp);
    const aw = mesh(box(1.6, 0.1, 0.8), C.red, 0, 1.2, 0.35, grp); aw.rotation.x = 0.55;
    mesh(box(1.6, 0.25, 0.06), C.redD, 0, 1.0, 0.7, grp);
    mesh(box(1.3, 0.25, 0.3), C.pinkD, 0, -1.05, 0.2, grp);
    for (const fx of [-0.45, 0, 0.45]) mesh(sph(0.13, 6), fx ? C.pink : C.white, fx, -0.85, 0.22, grp);

// ---------- Minion ----------
const minionMats = {
  yellow: mat(C.yellow), denim: mat(C.denim), ink: mat(C.ink), steel: mat(C.silver),
  white: mat(C.white), brown: mat(C.brown), black: mat(C.ink),
};
function minion({ eyes = 2, tall = 1, arms = 'down', sit = false, hair = 'spiky' } = {}) {
  const g = new T.Group();
  const r = 0.62, len = 0.85 * tall, bodyH = len + r * 2;
  // body: one capsule, coloured by height — yellow on top, denim overalls below
  const geo = new T.CapsuleGeometry(r, len, 6, 14);
  const pos = geo.attributes.position, cols = [];
  const yellow = new T.Color(C.yellow), denim = new T.Color(C.denim);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) + bodyH / 2;           // 0 at the bottom
    const c = y < bodyH * 0.36 ? denim : yellow;
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  const body = mesh(geo, new T.MeshLambertMaterial({ vertexColors: true }), 0, bodyH / 2 + 0.15, 0, g);
  // overall bib
  mesh(box(0.62, 0.38, 0.12), minionMats.denim, 0, bodyH * 0.42 + 0.15, r - 0.04, g);
  // goggles: strap round the head, then 1 or 2 lenses
  const eyeY = bodyH * 0.68 + 0.15;
  mesh(cyl(r + 0.03, r + 0.03, 0.14, 18), minionMats.ink, 0, eyeY, 0, g);
  const xs = eyes === 2 ? [-0.27, 0.27] : [0];
  for (const ex of xs) {
    const rim = mesh(cyl(0.29, 0.29, 0.2, 14), minionMats.steel, ex, eyeY, r - 0.02, g); rim.rotation.x = Math.PI / 2;
    const w = mesh(cyl(0.21, 0.21, 0.04, 14), minionMats.white, ex, eyeY, r + 0.08, g); w.rotation.x = Math.PI / 2;
    const ir = mesh(cyl(0.11, 0.11, 0.04, 10), minionMats.brown, ex * 0.85, eyeY, r + 0.1, g); ir.rotation.x = Math.PI / 2;
    const pu = mesh(cyl(0.05, 0.05, 0.04, 8), minionMats.black, ex * 0.85, eyeY, r + 0.12, g); pu.rotation.x = Math.PI / 2;
  }
  // mouth
  const mouth = mesh(new T.TorusGeometry(0.14, 0.03, 4, 10, Math.PI), minionMats.ink, 0, eyeY - 0.42, r - 0.06, g);
  mouth.rotation.z = Math.PI;
  // hair
  if (hair === 'spiky') for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const s = mesh(cyl(0.015, 0.015, 0.35, 4), minionMats.ink, Math.cos(a) * 0.15, bodyH + 0.28, Math.sin(a) * 0.15, g);
    s.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
  }
  // arms + gloves
  const armGeo = new T.CapsuleGeometry(0.1, 0.5, 3, 6);
  g.userData.arms = []; g.userData.feet = [];
  for (const side of [-1, 1]) {
    const a = new T.Group(); a.position.set(side * (r - 0.02), bodyH * 0.5 + 0.15, 0.05); g.add(a);
    g.userData.arms.push(a);
    const up = arms === 'up' || (arms === 'wave' && side === 1);
    a.rotation.z = up ? side * 2.6 : side * 0.35;
    mesh(armGeo, minionMats.yellow, 0, -0.3, 0, a);
    mesh(sph(0.14, 8), minionMats.ink, 0, -0.62, 0, a);
  }
  // feet
  for (const side of [-1, 1]) {
    const f = mesh(box(0.3, 0.16, 0.42), minionMats.ink, side * 0.25, 0.08, 0.08, g);
    if (sit) { f.position.set(side * 0.25, 0.25, r + 0.2); }
    g.userData.feet.push(f);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  g.userData.h = bodyH;
  return g;
}
const MSCALE = 1.05;   // Minions are drawn bigger than life so the goggles survive the pixel grid
const idlers = [];     // every placed Minion gets a small idle breath
function place(m, x, y, z, faceY = Math.PI / 4, extra = {}) {
  m.position.set(x, y, z); m.rotation.y = faceY; m.scale.setScalar(MSCALE);
  if (extra.tilt) m.rotation.x = extra.tilt;
  if (extra.roll) m.rotation.z = extra.roll;
  scene.add(m); idlers.push(m); return m;
}


// ---------- sound: tiny Web Audio synths (no files), only for what the visitor sets off ----------
// SFX.unlock() must run inside a click/tap first (browsers keep audio off until then); every sound
// takes an optional delay in seconds so it can be booked for a moment later in the animation.
const SFX = (() => {
  let ctx = null, out = null, hiss = null;
  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); out = ctx.createGain(); out.gain.value = muted ? 0 : 0.45; out.connect(ctx.destination);
      hiss = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = hiss.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const on = () => ctx && ctx.state !== 'closed';   // a context still waking up queues the sound; it plays as it resumes
  // the Minion Lab site's mute key (ml-chrome.js) silences everything; standalone there is no such key
  const siteMuted = () => typeof window.mlcMuted === 'function' && window.mlcMuted();
  // one voice: an oscillator (or noise through a filter) with a pitch glide and a quick attack/decay
  function voice({ type = 'sine', f0, f1 = f0, dur, peak = 0.3, delay = 0, attack = 0.005, noise = false, filter = 'bandpass', q = 1 }) {
    if (!on() || siteMuted()) return;
    const t = ctx.currentTime + delay, g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let src, tune;
    if (noise) {
      src = ctx.createBufferSource(); src.buffer = hiss; src.loop = true;
      tune = ctx.createBiquadFilter(); tune.type = filter; tune.Q.value = q; src.connect(tune); tune.connect(g);
      tune.frequency.setValueAtTime(f0, t); tune.frequency.exponentialRampToValueAtTime(f1, t + dur);
    } else {
      src = ctx.createOscillator(); src.type = type; src.connect(g);
      src.frequency.setValueAtTime(f0, t); src.frequency.exponentialRampToValueAtTime(f1, t + dur);
    }
    g.connect(out); src.start(t); src.stop(t + dur + 0.05);
  }
  let muted = false;
  function setMuted(m) { muted = m; if (out) out.gain.value = m ? 0 : 0.45; }
  return {
    unlock, setMuted, get muted() { return muted; },
    coin: (d = 0) => { voice({ type: 'triangle', f0: 1900, f1: 1850, dur: 0.12, peak: 0.25, delay: d });          // ka-
                       voice({ type: 'triangle', f0: 2500, f1: 2450, dur: 0.35, peak: 0.22, delay: d + 0.07 });   // -ching
                       voice({ noise: true, f0: 5000, dur: 0.08, peak: 0.08, delay: d + 0.3, filter: 'highpass' }); },   // drops in the slot
    crank: (d = 0) => { for (let i = 0; i < 4; i++) voice({ noise: true, f0: 2200, dur: 0.04, peak: 0.18, delay: d + i * 0.16, q: 6 }); },
    whoosh: (d = 0, dur = 2.6) => voice({ noise: true, f0: 600, f1: 2400, dur, peak: 0.12, delay: d, attack: 0.6, q: 2 }),
    splash: (d = 0) => { voice({ noise: true, f0: 1400, f1: 300, dur: 0.6, peak: 0.35, delay: d, filter: 'lowpass' });
                         for (let i = 0; i < 4; i++) voice({ f0: 500 + i * 140, f1: 900 + i * 160, dur: 0.07, peak: 0.08, delay: d + 0.2 + i * 0.07 }); },
    bounce: (d = 0, k = 1) => voice({ f0: 520, f1: 260, dur: 0.09, peak: 0.16 * k, delay: d }),
    boing: (d = 0) => { voice({ type: 'triangle', f0: 140, f1: 620, dur: 0.38, peak: 0.3, delay: d });
                        voice({ type: 'sine', f0: 70, f1: 120, dur: 0.2, peak: 0.25, delay: d }); },
    splat: (d = 0) => { voice({ noise: true, f0: 900, f1: 120, dur: 0.25, peak: 0.35, delay: d, filter: 'lowpass' });
                        voice({ f0: 110, f1: 55, dur: 0.18, peak: 0.3, delay: d }); },
    pop: (d = 0) => voice({ f0: 400, f1: 900, dur: 0.08, peak: 0.15, delay: d }),
    honk: (d = 0) => { for (const [o, len] of [[0, 0.16], [0.24, 0.3]]) {                        // beep-beeep, two horns a third apart
                         voice({ type: 'square', f0: 415, dur: len, peak: 0.12, delay: d + o, attack: 0.01 });
                         voice({ type: 'square', f0: 523, dur: len, peak: 0.1, delay: d + o, attack: 0.01 }); } },
  };
})();

// ---------- the game: Minions tumble out of the windows, a trampoline catches them ----------
// Every so often (or when you click a window) a Minion steps out onto a sill and jumps. Front-window
// jumpers come down on the trampoline's line; if the trampoline is under them they boing back up into a
// window, otherwise they go splat, peel themselves up and walk back in through a door. The trampoline
// follows the pointer left and right; with nobody steering, it plays by itself (and misses now and then).
const DT = 1 / 20, GRAV = 20;
const TRAMP_Z = 2.2, BED_Y = 0.95, CATCH_R = 2.1;
const XMIN = RED.x0 + 2, XMAX = BEIGE.x1 - 1.5;
const DOORS = [[RED.x0 + 8.4, FRONT], [BEIGE.x0 + 7.2, FRONT]];
const ease = (k) => k * k * (3 - 2 * k);
const clamp01 = (k) => Math.min(1, Math.max(0, k));
function arms(m, l, r, lx = 0, rx = 0) { const [a, b] = m.userData.arms; a.rotation.set(lx, 0, -l); b.rotation.set(rx, 0, r); }
function feet(m, sit, stride = 0) {
  m.userData.feet.forEach((f, i) => {
    const s = i ? 1 : -1;
    if (sit) f.position.set(s * 0.25, 0.25, 0.82);
    else f.position.set(s * 0.25, 0.08 + Math.max(0, s * stride) * 0.12, 0.08 + s * stride * 0.18);
  });
}

// every window a Minion can come out of: sill position, which way it faces, and whether its jumpers
// land on the trampoline's line (front windows) or on the side lawn (the walk-up's side wall)
const WINDOWS = [
  ...redWindows.filter((_, i) => i !== 4).map(([x, y]) => ({ x, y, sill: new T.Vector3(x, y - 1.0, FRONT + 0.35), rot: 0, front: true })),
  ...beigeWindows.filter(([x, y, z, r]) => !(r === 0 && x === BEIGE.x0 + 4.75 && y === 13.8))
    .map(([x, y, z, r]) => r === 0
      ? { x, y, sill: new T.Vector3(x, y - 1.1, FRONT + 0.35), rot: 0, front: true }
      : { x, y, z, sill: new T.Vector3(x + 0.35, y - 1.1, z), rot: Math.PI / 2, front: false }),
];
// invisible panes over each window, for hover and click
const winHits = WINDOWS.map((w, i) => {
  const m = new T.Mesh(new T.PlaneGeometry(1.5, 2.1));
  if (w.front) m.position.set(w.x, w.y, FRONT + 0.3); else { m.position.set(BEIGE.x1 + 0.3, w.y, w.z); m.rotation.y = Math.PI / 2; }
  m.updateMatrixWorld(true); m.userData.i = i; return m;
});

// the trampoline: red rim, blue bed, held at each end by a Minion
const tramp = new T.Group(); scene.add(tramp);
const rim = mesh(cyl(1, 1, 0.28, 24), C.red, 0, BED_Y - 0.14, 0, tramp); rim.scale.set(CATCH_R, 1, 0.95);
const bed = mesh(cyl(0.86, 0.86, 0.06, 24), C.denimL, 0, BED_Y + 0.01, 0, tramp); bed.scale.set(CATCH_R, 1, 0.95);
for (const [lx, lz] of [[-1.2, -0.6], [1.2, -0.6], [-1.2, 0.6], [1.2, 0.6]]) mesh(box(0.1, BED_Y - 0.2, 0.1), C.charcoal, lx, (BED_Y - 0.2) / 2, lz, tramp);
const holders = [-1, 1].map(s => {
  const m = minion({ eyes: s < 0 ? 2 : 1, tall: 0.9 }); m.scale.setScalar(MSCALE);
  m.position.set(s * (CATCH_R + 0.55), 0, 0); m.rotation.y = s < 0 ? Math.PI / 2 : -Math.PI / 2;
  arms(m, 1.2, 1.2, -1.2, -1.2); tramp.add(m); return m;
});
tramp.position.set(0, 0, TRAMP_Z);

// a pool of Minions for the jumpers
const POOL_N = 16;
const pool = Array.from({ length: POOL_N }, (_, i) => {
  const m = minion({ eyes: i % 3 ? 2 : 1, arms: 'up', tall: 0.85 + (i % 3) * 0.1 });
  m.rotation.order = 'YXZ'; m.scale.setScalar(MSCALE); m.visible = false; scene.add(m); return m;
});

let S;
function reset(seed) {
  pool.forEach(m => (m.visible = false));
  S = { now: 0, actors: [], tx: 0, tvx: 0, aimErr: 0, nextDrop: 0.6, caught: 0, splat: 0, userCaught: 0,
        pointerX: null, lastPointer: -1e9, hover: -1, rng: seed };
}
function srand() { S.rng = (S.rng * 16807) % 2147483647; return S.rng / 2147483647; }
function freeMesh() {
  const busy = new Set(S.actors.map(a => a.m));
  return pool.find(m => !busy.has(m)) || null;
}

function spawnAt(i, hold) {
  if (S.actors.some(a => a.win === i && (a.st === 'peek' || a.st === 'hold'))) return S.actors.find(a => a.win === i);
  const m = freeMesh(); if (!m) return null;
  const a = { m, win: i, st: hold ? 'hold' : 'peek', t: 0, p: WINDOWS[i].sill.clone(), v: new T.Vector3(), user: false };
  S.actors.push(a); return a;
}
function jump(a) {
  const w = WINDOWS[a.win];
  a.st = 'fall'; a.t = 0;
  const vy = 3.5, y0 = a.p.y;
  if (w.front) {
    const tf = (vy + Math.sqrt(vy * vy + 2 * GRAV * (y0 - BED_Y))) / GRAV;   // time to reach the bed's height
    a.v.set((srand() - 0.5) * 1.2, vy, (TRAMP_Z - a.p.z) / tf);
  } else a.v.set(2.4, vy, (srand() - 0.5) * 1.0);
}
// a caught Minion boings back up and in through a random front window
function boing(a) {
  const targets = WINDOWS.map((w, i) => i).filter(i => WINDOWS[i].front);
  const ti = targets[Math.floor(srand() * targets.length)], to = WINDOWS[ti].sill.clone().add(new T.Vector3(0, 0.6, -0.6));
  const Tt = 1.1 + srand() * 0.3;
  a.st = 'boing'; a.t = 0; a.T = Tt; a.from = a.p.clone(); a.to = to;
  a.v.set((to.x - a.p.x) / Tt, (to.y - a.p.y + 0.5 * GRAV * Tt * Tt) / Tt, (to.z - a.p.z) / Tt);
  S.caught++; if (a.user || S.lastPointer > S.now - 5) { S.userCaught++; SFX.boing(); }
  S.bedHit = S.now;
}

function stepActor(a) {
  a.t += DT;
  const w = WINDOWS[a.win];
  if (a.st === 'peek' && a.t > 0.55) jump(a);
  else if (a.st === 'fall') {
    const prevY = a.p.y;
    a.v.y -= GRAV * DT; a.p.addScaledVector(a.v, DT);
    if (w.front && prevY > BED_Y && a.p.y <= BED_Y && Math.abs(a.p.x - tramp.position.x) < CATCH_R && Math.abs(a.p.z - TRAMP_Z) < 1.2) { a.p.y = BED_Y; boing(a); }
    else if (a.p.y <= 0) { a.p.y = 0; a.st = 'splat'; a.t = 0; S.splat++; if (a.user || S.lastPointer > S.now - 5) SFX.splat(); }
  } else if (a.st === 'boing') {
    a.v.y -= GRAV * DT; a.p.addScaledVector(a.v, DT);
    if (a.t >= a.T) a.st = 'gone';
  } else if (a.st === 'splat' && a.t > 1.1) {
    a.st = 'walk'; a.t = 0;
    const [dx, dz] = DOORS.reduce((b, d) => Math.abs(d[0] - a.p.x) < Math.abs(b[0] - a.p.x) ? d : b);
    a.door = new T.Vector3(dx, 0, dz - 0.6);
  } else if (a.st === 'walk') {
    const to = a.door.clone().sub(a.p); to.y = 0;
    const d = to.length();
    if (d < 0.1) a.st = 'gone'; else a.p.addScaledVector(to.normalize(), Math.min(d, 3.0 * DT));
  }
}

function drawActor(a) {
  const m = a.m, w = WINDOWS[a.win];
  m.visible = true; m.position.copy(a.p); m.rotation.set(0, w.rot, 0); m.scale.setScalar(MSCALE);
  feet(m, false);
  if (a.st === 'peek' || a.st === 'hold') {
    // slide out of the window onto the sill and wave
    const k = ease(clamp01(a.t / 0.3)), back = w.front ? new T.Vector3(0, 0, -0.7) : new T.Vector3(-0.7, 0, 0);
    m.position.addScaledVector(back, 1 - k);
    const wave = Math.sin(S.now * 14) * 0.4;
    arms(m, 0.4, 2.4 + wave);
  } else if (a.st === 'fall') {
    m.rotation.z = Math.sin(a.t * 9) * 0.35; m.rotation.x = -0.2;
    const f = Math.sin(a.t * 22) * 0.3;
    arms(m, 2.5 + f, 2.5 - f); feet(m, false, Math.sin(a.t * 18));
  } else if (a.st === 'boing') {
    m.rotation.y += a.t * 9;                         // a happy spin on the way back up
    arms(m, 2.8, 2.8);
    const sq = a.t < 0.12 ? 1 - (0.12 - a.t) * 3 : 1;
    m.scale.set(MSCALE / Math.sqrt(sq), MSCALE * sq, MSCALE / Math.sqrt(sq));
  } else if (a.st === 'splat') {
    const k = a.t < 0.8 ? 1 : ease(clamp01((a.t - 0.8) / 0.3));
    const sy = 0.3 + 0.7 * k, sx = 1.35 - 0.35 * k;
    m.scale.set(MSCALE * sx, MSCALE * sy, MSCALE * sx);
    arms(m, 1.4, 1.4);
  } else if (a.st === 'walk') {
    const to = a.door.clone().sub(a.p);
    m.rotation.y = Math.atan2(to.x, to.z);
    const ph = a.t * 9;
    m.position.y = Math.abs(Math.sin(ph)) * 0.12; m.rotation.z = Math.sin(ph) * 0.12;
    arms(m, 0.4, 0.4, Math.sin(ph) * 0.5, -Math.sin(ph) * 0.5); feet(m, false, Math.sin(ph));
  }
}

function step() {
  S.now += DT;
  // a jumper every 1.2–2.6 s while there aren't too many about
  if (S.now >= S.nextDrop) {
    S.nextDrop = S.now + 1.2 + srand() * 1.4;
    // on their own they only use the front windows (side-wall jumpers land out of the trampoline's reach)
    const fronts = WINDOWS.map((w, i) => i).filter(i => WINDOWS[i].front);
    if (S.actors.length < 7) { const i = fronts[Math.floor(srand() * fronts.length)]; if (S.hover !== i) spawnAt(i, false); }
  }
  S.actors.forEach(stepActor);
  S.actors = S.actors.filter(a => { if (a.st === 'gone') { a.m.visible = false; return false; } return true; });
  // the trampoline: your pointer, or (nobody steering) it chases the next front jumper with a little aim error
  let target;
  if (S.pointerX !== null && S.now - S.lastPointer < 5) target = S.pointerX;
  else {
    // aim for whoever reaches the bed first, at the x where they'll cross it; one in five it fumbles on purpose
    const land = (a) => { const t = (a.v.y + Math.sqrt(Math.max(0, a.v.y * a.v.y + 2 * GRAV * (a.p.y - BED_Y)))) / GRAV; return { t, x: a.p.x + a.v.x * t }; };
    const next = S.actors.filter(a => a.st === 'fall' && WINDOWS[a.win].front && a.p.y > BED_Y).map(a => ({ a, ...land(a) })).sort((p, q) => p.t - q.t)[0];
    if (next && next.a !== S.aimFor) { S.aimFor = next.a; S.aimErr = srand() < 0.2 ? (srand() < 0.5 ? -1 : 1) * (CATCH_R + 0.9) : (srand() - 0.5) * 1.4; }
    target = next ? next.x + S.aimErr : S.tx;
  }
  target = Math.min(XMAX, Math.max(XMIN, target));
  const want = (target - S.tx) * 14;
  S.tvx += (Math.max(-24, Math.min(24, want)) - S.tvx) * 0.6;
  S.tx += S.tvx * DT;
}
function draw() {
  tramp.position.x = S.tx;
  // the bed dips when someone lands
  const since = S.now - (S.bedHit ?? -9), dip = since < 0.3 ? Math.sin(since / 0.3 * Math.PI) * 0.3 : 0;
  bed.position.y = BED_Y + 0.01 - dip;
  holders.forEach((h, i) => { h.position.y = Math.abs(Math.sin(S.tvx * 0.1 + S.now * 8)) * Math.min(0.12, Math.abs(S.tvx) * 0.02); });
  S.actors.forEach(drawActor);
  idlers.forEach((m, i) => {
    const b = 1 + Math.sin(S.now * Math.PI * 2 / 1.25 + i * 1.3) * 0.03;
    const s = m.userData.base || (m.userData.base = m.scale.x);
    m.scale.set(s / Math.sqrt(b), s * b, s / Math.sqrt(b));
  });
}
reset(12345);

// ---------- pixel pass: palette snap with ordered dithering ----------
const rt = new T.WebGLRenderTarget(RES, RES, { magFilter: T.NearestFilter, minFilter: T.NearestFilter, samples: 0 });
const palVec = PALETTE.map(h => new T.Color(h)).map(c => new T.Vector3(c.r, c.g, c.b));
const post = new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({
  uniforms: { tex: { value: rt.texture }, pal: { value: palVec }, res: { value: RES }, amt: { value: 0.05 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tex; uniform vec3 pal[${PALETTE.length}]; uniform float res; uniform float amt;
    varying vec2 vUv;
    float bayer(vec2 p){
      int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      int i = x + y * 4;
      float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
      for (int k = 0; k < 16; k++) if (k == i) return m[k] / 16. - .47;
      return 0.;
    }
    void main(){
      vec4 src = texture2D(tex, vUv);
      if (src.a < 0.05) { gl_FragColor = vec4(0.); return; }   // sky: leave it to the page
      // the clear colour is premultiplied to black, so a see-through pixel (the glass) holds colour × alpha:
      // lay it over white here, the way it looked on the white page
      vec3 c = src.rgb + (1. - src.a);
      c += bayer(floor(vUv * res)) * amt;
      float best = 1e9; vec3 outc = c;
      for (int i = 0; i < ${PALETTE.length}; i++) {
        vec3 d = (c - pal[i]) * vec3(0.9, 1.2, 0.7);
        float e = dot(d, d);
        if (e < best) { best = e; outc = pal[i]; }
      }
      gl_FragColor = vec4(outc, 1.);
    }`,
  depthTest: false, depthWrite: false,
}));
const postScene = new T.Scene(); postScene.add(post);
const postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function frame() {
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

// ---------- pointer: steer the trampoline, hover a window to see who's in, click it to send them out ----------
const ray = new T.Raycaster(), ndc = new T.Vector2(), steerPlane = new T.Plane(new T.Vector3(0, 1, 0), -BED_Y), hitP = new T.Vector3();
function aim(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
}
function windowUnder(e) { aim(e); const h = ray.intersectObjects(winHits, false)[0]; return h ? h.object.userData.i : -1; }
function steer(e) {
  aim(e);
  if (ray.ray.intersectPlane(steerPlane, hitP)) {
    // follow the pointer along the trampoline's line: slide the hit point along the view ray to z = TRAMP_Z
    const d = ray.ray.direction, k = (TRAMP_Z - hitP.z) / d.z;
    S.pointerX = hitP.x + d.x * k; S.lastPointer = S.now;
  }
}
function setHover(i) {
  if (i === S.hover) return;
  S.actors.forEach(a => { if (a.st === 'hold') a.st = 'gone'; });   // the last peeker ducks back in
  S.hover = i;
  if (i >= 0) spawnAt(i, true);
}

// HUD: a catch counter, and a tag under the trampoline until your first catch
const hud = document.getElementById('hud'), hint = document.getElementById('hint');
function drawHud() {
  hud.textContent = `caught ${S.caught}`;
  cam.updateMatrixWorld();
  const v = new T.Vector3(S.tx, 0, TRAMP_Z + 1.4).project(cam);
  hint.style.left = ((v.x + 1) / 2 * 100) + '%'; hint.style.top = ((1 - v.y) / 2 * 100) + '%';
  if (S.userCaught > 0) hint.classList.add('gone');
}

// shaders compile first (off the main thread where allowed), then the stage fades in; ?t=4.2 freezes a frame
const fixedT = new URLSearchParams(location.search).get('t');
const stage = document.getElementById('stage');
const FPS = 20;
function renderAt(t) {
  if (t < S.now - 1e-6) reset(12345);
  while (S.now < t - 1e-6) step();
  draw(); drawHud(); frame();
}
(async function start() {
  await Promise.all([renderer.compileAsync(scene, cam), renderer.compileAsync(postScene, postCam)]).catch(() => {});
  if (fixedT !== null) renderAt(+fixedT);
  else {
    reset(1 + Math.floor(Math.random() * 2147483645));
    canvas.addEventListener('pointermove', (e) => {
      steer(e);
      const i = e.pointerType === 'mouse' ? windowUnder(e) : -1;
      setHover(i); canvas.style.cursor = i >= 0 ? 'pointer' : '';
    });
    canvas.addEventListener('pointerleave', () => setHover(-1));
    canvas.addEventListener('pointerdown', (e) => {
      SFX.unlock();
      const i = windowUnder(e);
      if (i < 0) { steer(e); return; }                      // a tap on the street moves the trampoline (phones)
      let a = S.actors.find(x => x.win === i && (x.st === 'hold' || x.st === 'peek'));
      if (!a) a = spawnAt(i, true);
      if (a) { a.user = true; a.t = Math.max(a.t, 0.3); jump(a); SFX.pop(); }
      if (S.hover === i) S.hover = -1;                      // the next hover over it brings a new peeker
    });
    // sound needs one click or tap before browsers allow it; this button gives steering-only visitors that click
    const snd = document.getElementById('snd');
    snd.addEventListener('click', () => {
      SFX.unlock(); SFX.setMuted(snd.classList.contains('on'));
      snd.classList.toggle('on', !SFX.muted); snd.textContent = SFX.muted ? 'sound off' : 'sound on';
      if (!SFX.muted) SFX.boing();
    });
    canvas.addEventListener('pointerdown', () => { if (!SFX.muted) { snd.classList.add('on'); snd.textContent = 'sound on'; } });
    const t0 = performance.now(); let done = 0;
    draw(); drawHud(); frame();
    (function tick() {
      const due = Math.floor((performance.now() - t0) / 1000 * FPS);
      if (due > done) {
        for (let n = 0; n < Math.min(due - done, 10); n++) step();
        done = due; draw(); drawHud(); frame();
      }
      requestAnimationFrame(tick);
    })();
  }
  requestAnimationFrame(() => { stage.classList.add('ready'); window.__ready = true; });
})();
window.__render = renderAt;
window.__state = () => S;
</script>
</body>
