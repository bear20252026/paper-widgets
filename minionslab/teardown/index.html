const D = {"W":600,"H":440,"V":[0.6496425315582588,0.5451148086276094,0.5299192642332049],"EX":[1.3508065464870924,0.8530791632353498],"EY":[-1.6098285546757438,0.7158184112358299],"EZ":[0,-1.7821577497155658],"pieces":{"goggle":{"name":"Goggle","say":"goggle · 1 ring · 1 lens · 1 eye","about":"goggle · one steel ring, one lens, one eye: about half of all Minions have a single eye"},"head":{"name":"Head shell","say":"head shell · skin, strap, 3 hairs","about":"head shell · the yellow skin with its goggle strap and 0 to 7 hairs, lifted off the frame"},"arms":{"name":"Arms","say":"arms · 2 balls each · 3 fingers","about":"arms · ball shoulders and elbows, three fingers on each hand"},"armL":{"name":"Left arm","say":"","about":""},"armR":{"name":"Right arm","say":"","about":""},"core":{"name":"Banana cell","say":"banana cell · ~105 kcal a banana","about":"banana cell · runs on bananas, about 105 kcal each (invented for this figure)"},"frame":{"name":"Frame and voice box","say":"frame · spine, 2 shelves, voice box","about":"frame and voice box · spine, two shelves, three tie rods; the box speaks Minionese, borrowed from English, Spanish, Italian and Korean (invented)"},"pants":{"name":"Overalls","say":"overalls · blue denim uniform","about":"overalls · blue denim worn over the yellow body; the one garment every Minion wears"},"legs":{"name":"Legs and boots","say":"legs · stubby · 105 cm in all","about":"legs and boots · stubby legs, black boots: a Minion stands about 105 cm tall"},"stand":{"name":"Stand","say":"","about":""}},"stagger":["goggle","armL","armR","head","legs","pants","frame","core","stand"],"spring":{"stagger":0.045,"stiffness":64,"damping":14.2,"substeps":4},"order":["goggle","head","frame","core","arms","pants","legs"]};
const root = document.querySelector(".mt");
const stage = root.querySelector(".mt-stage");
const svg = stage.querySelector("svg");
const engine = svg.querySelector(".mt-engine");
const live = root.querySelector("[data-live]");
const readout = root.querySelector("[data-readout]");
const partButtons = [...root.querySelectorAll(".mt-part")];
const detail = root.querySelector("[data-detail]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

const nodes = [...engine.querySelectorAll(".it")].map((el) => ({
  el,
  piece: el.dataset.piece,
  ride: el.dataset.ride || el.dataset.piece,
  key: Number(el.dataset.k),
  m: el.dataset.m.split(",").map(Number),
  index: Number(el.dataset.i),
  shown: "",
}));
for (const node of nodes) node.lift = node.m[0] * D.V[0] + node.m[1] * D.V[1] + node.m[2] * D.V[2];
let order = nodes.map((_, index) => index);

const IDS = Object.keys(D.pieces);
const STAGGER = D.stagger;
const SPRING = D.spring;
const piece = Object.fromEntries(IDS.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));

let clock = 0;
let apart = false;
let selected = null;
let inside = false;
let leaveTimer = 0;
let touring = !still.matches;
let tourClock = -1;
let idleTimer = 0;
let visible = false;
let frame = 0;
let last = 0;

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
function announce(text) {

}
function describe() {
  const text = selected ? D.pieces[selected].about : apart ? `apart · ${D.order.length} assemblies` : "assembled · 105 cm · one eye";
  if (stage.getAttribute("aria-valuetext") !== text) stage.setAttribute("aria-valuetext", text);
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (!piece[id]) continue;
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  announce(on ? "taking apart" : "closing up");
  describe();
  run();
}

function select(id) {
  if (id === "stand") id = null;
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    if (id !== null && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  if (id) stage.setAttribute("data-focus", "");

  }
  describe();
}

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;

  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function place() {
  for (const node of nodes) {
    const share = piece[node.ride] ? piece[node.ride].x : 0;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const shareOf = (node) => (piece[node.ride] ? piece[node.ride].x : 0);
  const next = nodes.map((_, index) => index).sort((a, b) => nodes[a].key + nodes[a].lift * shareOf(nodes[a]) - (nodes[b].key + nodes[b].lift * shareOf(nodes[b])));
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    engine.appendChild(fragment);
    order = next;
  }
}

const TOUR_STEP = 1.6;
function tourAt(time) {
  const apartFrom = 0.5;
  const listFrom = apartFrom + 1.2;
  const listTo = listFrom + D.order.length * TOUR_STEP;
  const closeAt = listTo + 1.0;
  const restart = closeAt + 2.6;
  if (time < apartFrom) return { apart: false, part: null };
  if (time < listFrom) return { apart: true, part: null };
  if (time < listTo) return { apart: true, part: D.order[Math.floor((time - listFrom) / TOUR_STEP)] };
  if (time < closeAt) return { apart: true, part: null };
  if (time < restart) return { apart: false, part: null };

  return { apart: false, part: null };

function quietTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (inside) return quietTour();
    touring = !still.matches;
    tourClock = -0.6;
    run();
  }, 15000);
}

function idleText() {
  if (selected) return D.pieces[selected].say;
  const moving = IDS.some((id) => Math.abs(piece[id].x - piece[id].target) > 0.002 || piece[id].pending);

function tick(now) {

  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    const step = tourAt(tourClock);
    setApart(step.apart);
    select(step.part);
    wording();

  let moving = false;
  for (const id of IDS) if (steerSpring(piece[id], dt, calm)) moving = true;

  say(idleText());

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();

  { rootMargin: "120px 0px" },
).observe(stage);

  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it") : null;

stage.addEventListener("pointermove", (event) => {

  inside = true;
  clearTimeout(leaveTimer);
  if (touring) quietTour();
  if (apart) select(pieceAt(event));

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {

stage.addEventListener("click", (event) => {

  if (apart) {
    select(null);
    setApart(false);
  } else {
    setApart(true);
    if (event.pointerType !== "touch") select(pieceAt(event));

  run();

partButtons.forEach((button) => {
  const show = () => {
    quietTour();
    clearTimeout(leaveTimer);
    setApart(true);
    select(button.dataset.part);
    wording();
    run();
  };
  const hide = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
      select(null);
    }, 260);
  };
  button.addEventListener("pointerenter", show);
  button.addEventListener("focus", show);
  button.addEventListener("pointerleave", hide);
  button.addEventListener("blur", hide);
  button.addEventListener("click", show);
});

stage.addEventListener("keydown", (event) => {
  const index = selected ? D.order.indexOf(selected) : -1;
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") next = Math.min(D.order.length - 1, index + 1);
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = Math.max(0, index - 1);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = D.order.length - 1;
  else if (event.key === "Escape") {
    event.preventDefault();
    quietTour();
    select(null);
    setApart(false);
    wording();
    run();
    return;
  } else if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    quietTour();
    setApart(!apart);
    if (!apart) select(null);
    wording();
    run();
    return;
  }
  if (next === null) return;
  event.preventDefault();
  quietTour();
  setApart(true);
  select(D.order[next]);
  run();
});
stage.addEventListener("focus", () => announce(selected ? D.pieces[selected].say : apart ? "apart" : "assembled"));

if (still.matches) touring = false;
const narrow = matchMedia("(hover: none), (max-width: 480px)");
const hint = root.querySelector("[data-hint]");
const wording = () => {
  if (!hint) return;
  const verb = narrow.matches ? "Tap" : "Click";
  hint.textContent = apart ? verb + " to put back" + (narrow.matches ? "" : " · hover parts") : verb + " to take apart";
};
wording();
narrow.addEventListener("change", wording);
place();
say(idleText());
