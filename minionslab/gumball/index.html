  #hint.gone { display: none; }

<body>
<script src="../ml-chrome.js" data-page="gumball"></script>
<script>window.GUMBALL_PAD = [32, 174];</script>
<div id="stage"><canvas id="c"></canvas><div id="hint">insert coin ▸</div></div>
<script src="../bosshistory/assets/vendor/three.js"></script>
<script>
// Minion Gumball — a 12-second pixel loop.
// The scene is plain three.js geometry, rendered small (RES px), then snapped to a fixed
// palette with ordered dithering and shown enlarged with hard pixels. The sky is transparent,
// so the page colour shows through (white here, paper on the Minion Lab site).
// The site copy (gumball/ in the site repo) is generated from this file by build-site.mjs.

const RES = 325;            // render size in pixels (square); shown at 2× = 650 px
const VIEW = 43;            // world units across the frame
const T = THREE;
T.ColorManagement.enabled = false;   // colours are used exactly as written

// ---------- palette ----------
const PALETTE = [
  '#ffffff', '#f3efe4', '#d6d3cc', '#a7a6ad', '#74737c', '#46454e', '#1f1e26',
  '#fff38f', '#ffd93b', '#f0b42a', '#b9801c', '#6e4a17',
  '#a9d1f5', '#5f97e0', '#3a66b8', '#243f78',
  '#ffd6e4', '#ff9cc0', '#ec5f8e', '#a8325d',
  '#ff5a4f', '#c62f35', '#7a1c25',
  '#d3ec8a', '#9fd05a', '#6aab3e', '#3f7d2f', '#28502a',
  '#e7c493', '#c39a62', '#8a6a45', '#5a4330',
  '#bff0fb', '#62cbe8', '#2c93b8',
  '#c7a0f0', '#f39a3b',
];
const C = Object.fromEntries([
  ['white', 0], ['cream', 1], ['silverL', 2], ['silver', 3], ['steel', 4], ['charcoal', 5], ['ink', 6],
  ['yellowL', 7], ['yellow', 8], ['yellowD', 9], ['ochre', 10], ['brown', 11],
  ['denimL', 12], ['denim', 13], ['denimD', 14], ['navy', 15],
  ['pinkL', 16], ['pink', 17], ['pinkD', 18], ['berry', 19],
  ['red', 20], ['redD', 21], ['maroon', 22],
  ['grassL', 23], ['grass', 24], ['grassM', 25], ['grassD', 26], ['grassDD', 27],
  ['sand', 28], ['dirt', 29], ['dirtD', 30], ['dirtDD', 31],
  ['waterL', 32], ['water', 33], ['waterD', 34],
  ['lilac', 35], ['orange', 36],
].map(([k, i]) => [k, PALETTE[i]]));

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(RES, RES, false);
renderer.setClearColor(0xffffff, 0);   // white at zero alpha: the glass blends toward white, the sky stays see-through
renderer.outputColorSpace = T.LinearSRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.BasicShadowMap;

// window.GUMBALL_PAD = [x, y] reserves room around the canvas (the site's header and keys).
// At most 2× (650 px — the width of the site's Teardown card and key row, and a clean whole-number
// zoom of RES 325); narrower screens get the full width less the 16 px gutters, short ones what fits.
function fit() {
  const [px, py] = window.GUMBALL_PAD || [32, 32];
  const size = Math.min(RES * 2, innerWidth - px, innerHeight - py);
  canvas.style.width = canvas.style.height = Math.round(Math.max(RES * 0.5, size)) + 'px';
}
fit(); addEventListener('resize', fit);

const scene = new T.Scene();
// the frame is raised a touch (LIFT world units) so the island, globe to grass edge, sits in the middle of the square
const LIFT = 0.55;
const cam = new T.OrthographicCamera(-VIEW / 2, VIEW / 2, VIEW / 2 + LIFT, -VIEW / 2 + LIFT, 0.1, 200);
cam.position.set(40, 33, 40);
cam.lookAt(0, 6.0, 0);

// three r155+ lights are physical: a Lambert face gets colour × intensity / π
scene.add(new T.HemisphereLight(0xffffff, 0xd8d0c0, 0.5 * Math.PI));
const sun = new T.DirectionalLight(0xfff6e8, 0.55 * Math.PI);
sun.position.set(-6, 30, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -27, right: 27, top: 27, bottom: -27, near: 1, far: 90 });
sun.shadow.bias = -0.002;
scene.add(sun);

// ---------- helpers ----------
const mat = (hex, extra = {}) => new T.MeshLambertMaterial({ color: hex, ...extra });
function mesh(geo, material, x = 0, y = 0, z = 0, parent = scene) {
  const m = new T.Mesh(geo, typeof material === 'string' ? mat(material) : material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d) => new T.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, seg = 16) => new T.CylinderGeometry(rt, rb, h, seg);
const sph = (r, seg = 16) => new T.SphereGeometry(r, seg, Math.max(8, seg * 0.75));

// deterministic noise so the still is the same every load
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------- ground: one painted texture, ragged edge by alpha ----------
const G = 38, GT = 400;       // ground size in world units, texture size
const PLAY = { x0: 0.6, x1: 13.0, z0: 0.4, z1: 13.0 };   // playground floor
const POOL = { x: 7.4, z: 7.6, r: 2.8 };
(function ground() {
  const cv = document.createElement('canvas'); cv.width = cv.height = GT;
  const g = cv.getContext('2d'), img = g.createImageData(GT, GT);
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  for (let j = 0; j < GT; j++) for (let i = 0; i < GT; i++) {
    const x = (i + 0.5) / GT * G - G / 2, z = (j + 0.5) / GT * G - G / 2;
    const n = vnoise(x * 0.9, z * 0.9) * 0.6 + vnoise(x * 3, z * 3) * 0.4;
    const R = 17.6, e = Math.pow(Math.pow(Math.abs(x) / R, 4) + Math.pow(Math.abs(z) / R, 4), 0.25);
    const edge = e + (n - 0.5) * 0.14 + (hash(i, j) - 0.5) * 0.06;
    let col = null;
    if (edge < 1) {
      const fine = hash(i * 3, j * 7);
      if (edge > 0.93) col = fine < 0.5 ? C.grassM : C.grass;
      else col = n > 0.7 ? C.grass : n < 0.4 ? C.grassD : C.grassM;
      // dirt band just inside the grass rim
      if (edge > 0.89 && edge < 0.92 && fine < 0.55) col = C.dirt;
      // flower patches scattered through the lawn
      const fl = vnoise(x * 0.35 + 40, z * 0.35 + 40);
      if (fl > 0.72 && edge < 0.85 && fine > 0.86) col = [C.pink, C.yellowL, C.white, C.lilac][Math.floor(hash(i * 13, j * 17) * 4)];
      // shop plaza: pale stone
      if (x > -11 && x < -0.6 && z > -11 && z < -0.6) {
        const t = ((Math.floor(x * 1.4) + Math.floor(z * 1.4)) & 1) ? C.cream : C.silverL;
        col = fine < 0.08 ? C.silver : t;
      }
      // playground: blue rubber floor with a white line
      if (x > PLAY.x0 && x < PLAY.x1 && z > PLAY.z0 && z < PLAY.z1) {
        col = fine < 0.1 ? C.denimL : (n > 0.55 ? C.denim : C.denimL);
        const inner = x > PLAY.x0 + 0.5 && x < PLAY.x1 - 0.5 && z > PLAY.z0 + 0.5 && z < PLAY.z1 - 0.5;
        if (!inner) col = C.white;
      }
      // splash pool
      const pd = Math.hypot(x - POOL.x, z - POOL.z);
      if (pd < POOL.r + 0.35) col = C.white;
      if (pd < POOL.r) col = (hash(i, j * 5) < 0.12 || (pd > POOL.r - 0.6 && fine < 0.4)) ? C.waterL : C.water;
      // a dirt path from the plaza to the playground gate
      if (Math.abs(x + z + 1.0) < 0.9 && x > -1 && x < 1.2 && fine > 0.2) col = C.sand;
      // a winding sand path across the front lawn
      const wz = 6 + Math.sin(x * 0.35) * 2.2;
      if (x < 0.2 && x > -16 && Math.abs(z - wz) < 0.75 && fine > 0.15) col = C.sand;
    }
    const k = (j * GT + i) * 4;
    if (col) { const [r, gg, b] = hex(col); img.data.set([r, gg, b, 255], k); }
    else img.data.set([0, 0, 0, 0], k);
  }
  g.putImageData(img, 0, 0);
  const tex = new T.CanvasTexture(cv);
  tex.magFilter = tex.minFilter = T.NearestFilter; tex.generateMipmaps = false;
  const m = mesh(new T.PlaneGeometry(G, G), new T.MeshLambertMaterial({ map: tex, alphaTest: 0.5 }));
  m.rotation.x = -Math.PI / 2; m.castShadow = false;
})();

// ---------- the candy shop ----------
const SHOP = { x: -6, z: -6.5, w: 10, d: 7, h: 8.5 };
function stripeTex(a, b, n, vertical = true) {
  const cv = document.createElement('canvas'); cv.width = n * 2; cv.height = 1;
  const g = cv.getContext('2d');
  for (let i = 0; i < n * 2; i++) { g.fillStyle = i % 2 ? b : a; g.fillRect(i, 0, 1, 1); }
  const t = new T.CanvasTexture(cv); t.magFilter = t.minFilter = T.NearestFilter; t.generateMipmaps = false;
  return t;
}
(function shop() {
  const { x, z, w, d, h } = SHOP, front = z + d / 2;
  mesh(box(w, h, d), C.pink, x, h / 2, z);
  // brick side wall with two windows
  const bc = document.createElement('canvas'); bc.width = bc.height = 32;
  const bg = bc.getContext('2d'); bg.fillStyle = C.pinkL; bg.fillRect(0, 0, 32, 32);
  for (let row = 0; row < 16; row++) for (let col = 0; col < 8; col++) {
    bg.fillStyle = (row * 7 + col * 3) % 5 === 0 ? C.redD : C.red;
    bg.fillRect(col * 4 + (row % 2) * 2, row * 2, 3, 1);
  }
  const brick = new T.CanvasTexture(bc); brick.magFilter = brick.minFilter = T.NearestFilter; brick.generateMipmaps = false;
  const side = mesh(box(0.1, h - 0.6, d - 0.6), new T.MeshLambertMaterial({ map: brick }), x + w / 2 + 0.05, h / 2 - 0.1, z);
  for (const wz of [-1.5, 1.5]) for (const wy of [2.4, 5.6]) {
    mesh(box(0.15, 1.6, 1.2), C.denimL, x + w / 2 + 0.1, wy, z + wz);
    mesh(box(0.3, 0.2, 1.5), C.white, x + w / 2 + 0.15, wy - 0.9, z + wz);
  }
  // cornice + base trim
  mesh(box(w + 0.5, 0.5, d + 0.5), C.white, x, h + 0.05, z);
  mesh(box(w + 0.2, 0.35, d + 0.2), C.white, x, 0.17, z);
  // shop window + door on the front
  mesh(box(3.2, 2.2, 0.15), C.waterL, x - 2.2, 1.9, front + 0.05);
  mesh(box(3.5, 0.25, 0.25), C.white, x - 2.2, 0.75, front + 0.1);
  mesh(box(1.4, 2.6, 0.15), C.pinkD, x + 1.2, 1.3, front + 0.05);
  mesh(box(0.15, 0.15, 0.1), C.yellow, x + 1.7, 1.3, front + 0.15);
  // upper windows
  for (const wx of [-3.0, 0, 3.0]) {
    mesh(box(1.3, 1.7, 0.15), C.denimL, x + wx, 5.4, front + 0.05);
    mesh(box(1.6, 0.2, 0.3), C.white, x + wx, 4.45, front + 0.1);
    // flower box under each upper window
    mesh(box(1.4, 0.3, 0.35), C.pinkD, x + wx, 4.25, front + 0.25);
    for (const fx of [-0.45, 0, 0.45]) mesh(sph(0.16, 6), fx ? C.yellow : C.white, x + wx + fx, 4.5, front + 0.3);
  }
  // striped awning: a slanted board over the shop front
  const aw = mesh(box(w + 0.6, 0.12, 2.2), new T.MeshLambertMaterial({ map: stripeTex(C.pink, C.white, 9) }), x, 3.35, front + 0.95);
  aw.rotation.x = 0.42;
  const valance = mesh(box(w + 0.6, 0.45, 0.12), new T.MeshLambertMaterial({ map: stripeTex(C.pink, C.white, 9) }), x, 2.75, front + 1.95);
  // little sign: a banana on a white plate
  mesh(box(2.4, 1.0, 0.15), C.white, x, h - 1.0, front + 0.08);
  const ban = mesh(new T.TorusGeometry(0.42, 0.13, 6, 12, Math.PI * 0.8), C.yellow, x, h - 0.9, front + 0.2);
  ban.rotation.z = Math.PI * 1.1;
})();

// ---------- the gumball machine on the roof ----------
const MACH = { x: -6, y: SHOP.h + 0.3, z: -6.0 };
const GLOBE = { r: 4.0 };
GLOBE.y = MACH.y + 1.9 + GLOBE.r * 0.92;
// Minions waiting inside, as body centres relative to the globe centre — all on the camera side
// so they show between the gumballs. [x, y, z, eyes, arms]
GLOBE.pockets = [
  [1.6, -1.3, 1.6, 2, 'up'], [-0.9, -1.1, 2.3, 1, 'wave'], [2.3, -1.0, -0.8, 2, 'down'],
  [0.5, 0.7, 2.2, 2, 'wave'], [2.2, 0.6, 0.6, 1, 'up'],
];
const gum = {};   // the moving parts of the machine: crank, coin, gumballs
(function machine() {
  const { x, y, z } = MACH;
  mesh(cyl(2.3, 2.7, 1.9, 24), C.red, x, y + 0.95, z);
  mesh(cyl(2.75, 2.75, 0.25, 24), C.redD, x, y + 0.1, z);
  mesh(cyl(2.35, 2.35, 0.2, 24), C.silverL, x, y + 1.95, z);
  // coin plate + crank on the front
  const plate = mesh(box(1.4, 1.2, 0.3), C.silverL, x, y + 1.0, z + 2.45);
  mesh(box(0.14, 0.5, 0.1), C.ink, x, y + 1.15, z + 2.62);
  // the crank: a disc facing out from the base, with a handle that turns
  const crankG = new T.Group(); crankG.position.set(x + 1.65, y + 1.0, z + 1.9); scene.add(crankG);
  crankG.lookAt(x + 1.65 * 3, y + 1.0, z + 1.9 * 3);
  gum.crank = new T.Group(); crankG.add(gum.crank);
  mesh(cyl(0.38, 0.38, 0.2, 12), C.silver, 0, 0, 0.05, gum.crank).rotation.x = Math.PI / 2;
  mesh(box(0.5, 0.12, 0.1), C.silverL, 0.25, 0, 0.2, gum.crank);
  mesh(sph(0.13, 8), C.red, 0.5, 0, 0.32, gum.crank);
  // the coin that drops into the slot each loop
  // gold face with a dark rim so it reads against the gumballs behind it
  gum.coin = mesh(cyl(0.5, 0.5, 0.14, 12), [new T.MeshBasicMaterial({ color: C.brown }), new T.MeshBasicMaterial({ color: C.yellowD }), new T.MeshBasicMaterial({ color: C.yellowD })], x, y + 3, z + 2.8);
  gum.coin.rotation.x = Math.PI / 2; gum.coin.visible = false;
  gum.slotY = y + 1.15;
  // glass globe — balls first, then the glass shell, then a lid
  const balls = [], ballGeo = sph(0.44, 10), MAXB = 320;
  const ballCols = [C.pink, C.yellow, C.denimL, C.red, C.white, C.lilac, C.orange, C.water];
  // gumballs are candy: lit mostly by their own colour so they stay bright inside the glass
  const inst = new T.InstancedMesh(ballGeo, new T.MeshLambertMaterial({ emissive: 0x000000 }), MAXB);
  inst.material.onBeforeCompile = (s) => {
    s.fragmentShader = s.fragmentShader.replace('#include <opaque_fragment>',
      'outgoingLight = mix(outgoingLight, diffuseColor.rgb, 0.45);\n#include <opaque_fragment>');
  };
  let n = 0; const m4 = new T.Matrix4(), col = new T.Color();
  const pockets = GLOBE.pockets.map(([px, py, pz]) => new T.Vector3(px, py, pz));
  const VIEW_DIR = cam.position.clone().normalize();
  // neighbour check on a coarse grid (cell = ball spacing), so 20k tries stay cheap
  const GAP = 0.84, grid = new Map(), key = (i, j, k) => i + ',' + j + ',' + k;
  const crowded = (p) => {
    const i0 = Math.floor(p.x / GAP), j0 = Math.floor(p.y / GAP), k0 = Math.floor(p.z / GAP);
    for (let i = i0 - 1; i <= i0 + 1; i++) for (let j = j0 - 1; j <= j0 + 1; j++) for (let k = k0 - 1; k <= k0 + 1; k++)
      for (const b of grid.get(key(i, j, k)) || []) if (b.distanceTo(p) < GAP) return true;
    return false;
  };
  for (let tries = 0; tries < 20000 && n < MAXB; tries++) {
    const p = new T.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).multiplyScalar(GLOBE.r - 0.5);
    if (p.length() > GLOBE.r - 0.5 || p.y > 2.0) continue;
    if (crowded(p)) continue;
    // keep room round each waiting Minion, and a clear line from its face to the camera
    if (pockets.some(q => {
      if (Math.hypot(q.x - p.x, (q.y - p.y) * 0.7, q.z - p.z) < 1.15) return true;
      const d = p.clone().sub(q), along = d.dot(VIEW_DIR);
      return along > 0 && d.addScaledVector(VIEW_DIR, -along).length() < 0.95;
    })) continue;
    balls.push(p);
    const g = key(Math.floor(p.x / GAP), Math.floor(p.y / GAP), Math.floor(p.z / GAP));
    (grid.get(g) || grid.set(g, []).get(g)).push(p);
    m4.makeTranslation(x + p.x, GLOBE.y + p.y, z + p.z);
    inst.setMatrixAt(n, m4); inst.setColorAt(n, col.set(ballCols[Math.floor(rnd() * ballCols.length)])); n++;
  }
  inst.count = n; inst.castShadow = false; inst.receiveShadow = false; scene.add(inst);
  gum.inst = inst; gum.balls = balls; gum.center = new T.Vector3(x, GLOBE.y, z);
  // clear glass: only a faint tint (a blue outline was tried and rejected — it should read as see-through)
  const glass = mesh(sph(GLOBE.r, 32), new T.MeshPhongMaterial({ color: C.waterL, transparent: true, opacity: 0.14, shininess: 80, specular: 0xffffff, depthWrite: false }), x, GLOBE.y, z);
  glass.castShadow = false;
  mesh(cyl(1.3, 1.8, 0.7, 20), C.red, x, GLOBE.y + GLOBE.r - 0.05, z);
  mesh(sph(0.5, 10), C.red, x, GLOBE.y + GLOBE.r + 0.5, z);
})();

// ---------- Minion ----------
const minionMats = {
  yellow: mat(C.yellow), denim: mat(C.denim), ink: mat(C.ink), steel: mat(C.silver),
  white: mat(C.white), brown: mat(C.brown), black: mat(C.ink),
};
function minion({ eyes = 2, tall = 1, arms = 'down', sit = false, hair = 'spiky' } = {}) {
  const g = new T.Group();
  const r = 0.62, len = 0.85 * tall, bodyH = len + r * 2;
  // body: one capsule, coloured by height — yellow on top, denim overalls below
  const geo = new T.CapsuleGeometry(r, len, 6, 14);
  const pos = geo.attributes.position, cols = [];
  const yellow = new T.Color(C.yellow), denim = new T.Color(C.denim);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) + bodyH / 2;           // 0 at the bottom
    const c = y < bodyH * 0.36 ? denim : yellow;
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(cols, 3));
  const body = mesh(geo, new T.MeshLambertMaterial({ vertexColors: true }), 0, bodyH / 2 + 0.15, 0, g);
  // overall bib
  mesh(box(0.62, 0.38, 0.12), minionMats.denim, 0, bodyH * 0.42 + 0.15, r - 0.04, g);
  // goggles: strap round the head, then 1 or 2 lenses
  const eyeY = bodyH * 0.68 + 0.15;

  new T.Vector3(MACH.x, MACH.y + 1.1, MACH.z + 2.6),

  new T.Vector3(POOL.x - 0.4, 0.9, POOL.z - 0.6),
]);
function halfPipe(curve, r, segs = 120, arc = 14) {
  const pts = [], idx = [];
  const frames = curve.computeFrenetFrames(segs, false);
  const upW = new T.Vector3(0, 1, 0);
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const side = new T.Vector3().crossVectors(tan, upW).normalize();
    const up = new T.Vector3().crossVectors(side, tan).normalize();
    for (let k = 0; k <= arc; k++) {
      const a = Math.PI + (k / arc) * Math.PI;   // the lower half of the circle
      pts.push(p.x + r * (Math.cos(a) * side.x + Math.sin(a) * up.x),
               p.y + r * (Math.cos(a) * side.y + Math.sin(a) * up.y),
               p.z + r * (Math.cos(a) * side.z + Math.sin(a) * up.z));
    }
  }
  for (let i = 0; i < segs; i++) for (let k = 0; k < arc; k++) {
    const a = i * (arc + 1) + k, b = a + arc + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pts, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

// ---------- sound: tiny Web Audio synths (no files), only for what the visitor sets off ----------
// SFX.unlock() must run inside a click/tap first (browsers keep audio off until then); every sound
// takes an optional delay in seconds so it can be booked for a moment later in the animation.
const SFX = (() => {
  let ctx = null, out = null, hiss = null;
  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); out = ctx.createGain(); out.gain.value = 0.45; out.connect(ctx.destination);
      hiss = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = hiss.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const on = () => ctx && ctx.state !== 'closed';   // a context still waking up queues the sound; it plays as it resumes
  // one voice: an oscillator (or noise through a filter) with a pitch glide and a quick attack/decay
  function voice({ type = 'sine', f0, f1 = f0, dur, peak = 0.3, delay = 0, attack = 0.005, noise = false, filter = 'bandpass', q = 1 }) {
    if (!on()) return;
    const t = ctx.currentTime + delay, g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let src, tune;
    if (noise) {
      src = ctx.createBufferSource(); src.buffer = hiss; src.loop = true;
      tune = ctx.createBiquadFilter(); tune.type = filter; tune.Q.value = q; src.connect(tune); tune.connect(g);
      tune.frequency.setValueAtTime(f0, t); tune.frequency.exponentialRampToValueAtTime(f1, t + dur);
    } else {
      src = ctx.createOscillator(); src.type = type; src.connect(g);
      src.frequency.setValueAtTime(f0, t); src.frequency.exponentialRampToValueAtTime(f1, t + dur);
    }
    g.connect(out); src.start(t); src.stop(t + dur + 0.05);
  }
  return {
    unlock,
    coin: (d = 0) => { voice({ type: 'triangle', f0: 1900, f1: 1850, dur: 0.12, peak: 0.25, delay: d });          // ka-
                       voice({ type: 'triangle', f0: 2500, f1: 2450, dur: 0.35, peak: 0.22, delay: d + 0.07 });   // -ching
                       voice({ noise: true, f0: 5000, dur: 0.08, peak: 0.08, delay: d + 0.3, filter: 'highpass' }); },   // drops in the slot
    crank: (d = 0) => { for (let i = 0; i < 4; i++) voice({ noise: true, f0: 2200, dur: 0.04, peak: 0.18, delay: d + i * 0.16, q: 6 }); },
    whoosh: (d = 0, dur = 2.6) => voice({ noise: true, f0: 600, f1: 2400, dur, peak: 0.12, delay: d, attack: 0.6, q: 2 }),
    splash: (d = 0) => { voice({ noise: true, f0: 1400, f1: 300, dur: 0.6, peak: 0.35, delay: d, filter: 'lowpass' });
                         for (let i = 0; i < 4; i++) voice({ f0: 500 + i * 140, f1: 900 + i * 160, dur: 0.07, peak: 0.08, delay: d + 0.2 + i * 0.07 }); },
    bounce: (d = 0, k = 1) => voice({ f0: 520, f1: 260, dur: 0.09, peak: 0.16 * k, delay: d }),
    boing: (d = 0) => { voice({ type: 'triangle', f0: 140, f1: 620, dur: 0.38, peak: 0.3, delay: d });
                        voice({ type: 'sine', f0: 70, f1: 120, dur: 0.2, peak: 0.25, delay: d }); },
    splat: (d = 0) => { voice({ noise: true, f0: 900, f1: 120, dur: 0.25, peak: 0.35, delay: d, filter: 'lowpass' });
                        voice({ f0: 110, f1: 55, dur: 0.18, peak: 0.3, delay: d }); },
    pop: (d = 0) => voice({ f0: 400, f1: 900, dur: 0.08, peak: 0.15, delay: d }),
    honk: (d = 0) => { for (const [o, len] of [[0, 0.16], [0.24, 0.3]]) {                        // beep-beeep, two horns a third apart
                         voice({ type: 'square', f0: 415, dur: len, peak: 0.12, delay: d + o, attack: 0.01 });
                         voice({ type: 'square', f0: 523, dur: len, peak: 0.1, delay: d + o, attack: 0.01 }); } },
  };
})();

const walkPts = [OUT, new T.Vector3(2.4, 0, 9.0), new T.Vector3(-0.6, 0, 9.0), new T.Vector3(-1.8, 0, 5.4),
  new T.Vector3(-2.6, 0, 1.2), new T.Vector3(DOOR_X, 0, FRONT + 0.6), new T.Vector3(DOOR_X, 0, FRONT - 1.4)];
const walkLen = walkPts.slice(1).reduce((s, p, i) => s + p.distanceTo(walkPts[i]), 0);
function walkAt(d) {
  for (let i = 1; i < walkPts.length; i++) {
    const L = walkPts[i].distanceTo(walkPts[i - 1]);
    if (d <= L || i === walkPts.length - 1) {
      const k = Math.min(1, d / L);
      return { p: walkPts[i - 1].clone().lerp(walkPts[i], k), dir: walkPts[i].clone().sub(walkPts[i - 1]).normalize() };
    }

}

const drops = [];
for (let i = 0; i < 36; i++) {
  const a = rnd() * Math.PI * 2, sp = 1.5 + rnd() * 2.8;
  const d = mesh(sph(0.2 + rnd() * 0.14, 6), i % 3 ? C.waterL : C.white, 0, 0, 0);
  d.castShadow = false; d.visible = false;
  d.userData.v = new T.Vector3(Math.cos(a) * sp, 5 + rnd() * 5, Math.sin(a) * sp);
  drops.push(d);
}
const ring = mesh(new T.TorusGeometry(1, 0.12, 4, 24), C.white, LAND.x, 0.06, LAND.z);
ring.rotation.x = Math.PI / 2; ring.castShadow = false; ring.visible = false;

// rider timeline, in seconds after the Minion starts to pop out
const T_POP = [0, 0.9], T_SLIDE = [0.9, 3.6], T_FLY = [3.6, 3.95], T_SWIM = [4.3, 5.6], T_HOP = [5.6, 6.1], T_WALK = [6.1, 11.3];
const COIN_FALL = 0.4, POP_DELAY = 0.8, MOUTH_GAP = 0.4;   // coin → shake at +0.4 → pop at +0.8; riders leave the mouth ≥0.4 s apart
const upV = new T.Vector3(0, 1, 0);

// j = this rider's own small offset in the pool and on the walk, so a crowd doesn't stack on one spot
function riderAt(m, t, j) {
  m.visible = true; m.rotation.set(0, 0, 0); m.scale.setScalar(MSCALE);
  const land = LAND.clone().add(j), edge = EDGE.clone().addScaledVector(j, 0.8), out = OUT.clone().addScaledVector(j, 0.8);
  if (t < T_POP[1]) {
    // squeeze out of the mouth: slides forward out of the red base, squash and stretch
    const k = span(t, ...T_POP), e = ease(k);
    m.position.copy(START).addScaledVector(START_T, -1.4 * (1 - e)); m.position.y -= 1.0;
    m.rotation.y = Math.atan2(START_T.x, START_T.z);
    const sq = 1 + Math.sin(k * Math.PI * 2) * 0.12 * (1 - k);
    m.scale.set(MSCALE / Math.sqrt(sq), MSCALE * sq, MSCALE / Math.sqrt(sq));
    arms(m, 0.35 + e * 2.3, 0.35 + e * 2.3); feet(m, true);
  } else if (t < T_SLIDE[1]) {
    // ride the half-pipe: speeds up, leans back, rides up the wall on the bends
    const k = span(t, ...T_SLIDE), s = k * k * 0.55 + k * 0.45;
    const p = slidePath.getPointAt(s), tan = slidePath.getTangentAt(s);
    const ahead = slidePath.getTangentAt(Math.min(1, s + 0.03));
    const turn = (tan.x * ahead.z - tan.z * ahead.x) / 0.03;
    const bank = Math.max(-0.7, Math.min(0.7, turn * 0.12));
    const side = new T.Vector3().crossVectors(tan, upV).normalize();
    m.position.copy(p).addScaledVector(side, bank * 0.55); m.position.y -= 1.0 - Math.abs(bank) * 0.25;
    m.rotation.y = Math.atan2(tan.x, tan.z); m.rotation.x = -0.3; m.rotation.z = bank;
    const flap = Math.sin(t * 18) * 0.15;
    arms(m, 2.5 + flap, 2.5 - flap); feet(m, true);
  } else if (t < T_SWIM[0]) {
    // fly off the end and plop in, then bob back up
    const k = span(t, ...T_FLY);
    if (t < T_FLY[1]) {
      m.position.copy(END).lerp(land, k); m.position.y = END.y - 1.0 + (land.y - END.y + 1.0) * k + Math.sin(k * Math.PI) * 0.9;
      m.rotation.x = -0.3 + k * 0.6;
    } else {
      const b = span(t, T_FLY[1], T_SWIM[0]);
      m.position.copy(land); m.position.y = land.y + (edge.y - land.y) * ease(b);
    }
    m.rotation.y = Math.atan2(END_T.x, END_T.z);
    arms(m, 2.7, 2.7); feet(m, false);
  } else if (t < T_SWIM[1]) {
    // doggy-paddle to the edge
    const k = span(t, ...T_SWIM);
    m.position.copy(land).lerp(edge, ease(k)); m.position.y = edge.y + Math.sin(t * 9) * 0.06;
    m.rotation.y = Math.atan2(edge.x - land.x, edge.z - land.z);
    const pad = Math.sin(t * 12);
    arms(m, 1.3 + pad * 0.5, 1.3 - pad * 0.5, -0.6, -0.6); feet(m, false);
  } else if (t < T_HOP[1]) {
    // hop over the rim
    const k = span(t, ...T_HOP);
    m.position.copy(edge).lerp(out, k); m.position.y = edge.y + (out.y - edge.y) * k + Math.sin(k * Math.PI) * 1.3;
    m.rotation.y = Math.atan2(out.x - edge.x, out.z - edge.z);
    arms(m, 2.4, 2.4); feet(m, false);
  } else if (t < T_WALK[1]) {
    // waddle back to the shop door and in (the wall hides the last step); the offset fades out at the door
    const k = span(t, ...T_WALK), d = k * walkLen, w = walkAt(d);
    const ph = d * Math.PI * 1.7;
    m.position.copy(w.p).addScaledVector(j, 0.8 * (1 - k)); m.position.y = Math.abs(Math.sin(ph)) * 0.14;
    m.rotation.y = Math.atan2(w.dir.x, w.dir.z); m.rotation.z = Math.sin(ph) * 0.12;
    arms(m, 0.4, 0.4, Math.sin(ph) * 0.5, -Math.sin(ph) * 0.5); feet(m, false, Math.sin(ph));
  } else {
    m.visible = false;
  }
}

// a pool of rider meshes, reused
const RIDERS = 24;
const riderPool = Array.from({ length: RIDERS }, (_, i) => {
  const m = minion({ eyes: i % 3 ? 2 : 1, arms: 'up', tall: 0.85 + (i % 3) * 0.1 });
  m.rotation.order = 'YXZ'; m.visible = false; scene.add(m); return m;
});

// loose gumballs: candy-bright like the ones in the globe
const ballMats = {};
function ballMat(hex) {
  if (ballMats[hex]) return ballMats[hex];
  const m = new T.MeshLambertMaterial({ color: hex });
  m.onBeforeCompile = (s) => { s.fragmentShader = s.fragmentShader.replace('#include <opaque_fragment>', 'outgoingLight = mix(outgoingLight, diffuseColor.rgb, 0.45);\n#include <opaque_fragment>'); };
  return (ballMats[hex] = m);
}
const BALL_R = 0.44, ROOF_Y = SHOP.h + 0.3, MAX_LOOSE = 80;
const ballGeoLoose = sph(BALL_R, 10);
const ROOF = { x0: SHOP.x - SHOP.w / 2 - 0.25, x1: SHOP.x + SHOP.w / 2 + 0.25, z0: SHOP.z - SHOP.d / 2 - 0.25, z1: SHOP.z + SHOP.d / 2 + 0.25 };
const onRoof = (p) => p.x > ROOF.x0 && p.x < ROOF.x1 && p.z > ROOF.z0 && p.z < ROOF.z1;
function stepBall(b) {
  if (b.rest) return;
  const prevY = b.p.y;
  b.v.y -= 22 * DT;
  b.p.addScaledVector(b.v, DT);
  const floor = onRoof(b.p) && prevY >= ROOF_Y - 0.05 ? ROOF_Y : 0;
  // the machine's red base sits on the roof: roll off it
  const dx = b.p.x - MACH.x, dz = b.p.z - MACH.z, dr = Math.hypot(dx, dz);
  if (floor === ROOF_Y && dr < 2.75 + BALL_R && b.p.y < MACH.y + 2.1) {
    b.p.x = MACH.x + dx / dr * (2.75 + BALL_R); b.p.z = MACH.z + dz / dr * (2.75 + BALL_R);
    const vn = (b.v.x * dx + b.v.z * dz) / dr; if (vn < 0) { b.v.x -= 1.6 * vn * dx / dr; b.v.z -= 1.6 * vn * dz / dr; }
  }
  // walls of the shop, for a ball rolling on the ground
  if (floor === 0 && onRoof(b.p) && b.p.y < ROOF_Y) {
    const ex = [b.p.x - ROOF.x0, ROOF.x1 - b.p.x, b.p.z - ROOF.z0, ROOF.z1 - b.p.z], k = ex.indexOf(Math.min(...ex));
    if (k === 0) { b.p.x = ROOF.x0; b.v.x = -Math.abs(b.v.x) * 0.5; } if (k === 1) { b.p.x = ROOF.x1; b.v.x = Math.abs(b.v.x) * 0.5; }
    if (k === 2) { b.p.z = ROOF.z0; b.v.z = -Math.abs(b.v.z) * 0.5; } if (k === 3) { b.p.z = ROOF.z1; b.v.z = Math.abs(b.v.z) * 0.5; }
  }
  if (b.p.y < floor + BALL_R) {
    b.p.y = floor + BALL_R;
    if (b.v.y < -1.2) { if (b.user) SFX.bounce(0, Math.min(1, -b.v.y / 8)); b.v.y *= -0.48; b.v.x *= 0.82; b.v.z *= 0.82; }
    else { b.v.y = 0; b.v.x *= 0.9; b.v.z *= 0.9; }
  }
  // the lawn ends at the grass edge
  const R = 16.4, e = Math.pow(Math.pow(Math.abs(b.p.x) / R, 4) + Math.pow(Math.abs(b.p.z) / R, 4), 0.25);
  if (floor === 0 && e > 1) { b.p.x /= e; b.p.z /= e; b.v.x *= -0.3; b.v.z *= -0.3; }
  if (b.v.y === 0 && Math.hypot(b.v.x, b.v.z) < 0.08) b.rest = true;   // stops where it is, lawn or roof
  b.mesh.position.copy(b.p);
  b.mesh.rotation.x += b.v.z * DT / BALL_R; b.mesh.rotation.z -= b.v.x * DT / BALL_R;   // rolls as it goes
}

// ---------- state ----------
const BALL_COLS = [C.pink, C.yellow, C.denimL, C.red, C.white, C.lilac, C.orange, C.water];
let S;   // everything that changes; reset() makes the opening state (the demo Minion already popping out)
function reset() {
  if (S) S.loose.forEach(b => scene.remove(b.mesh));
  riderPool.forEach(m => (m.visible = false));
  S = {
    now: 0, actors: [], coins: [], loose: [], pending: [],
    lastPop: 0, shakeAt: COIN_FALL - POP_DELAY, lastUser: -1e9, userCoins: 0, ballsInRow: 0,
    // a fixed seed only for ?t= stills and the recorder; visitors each get their own luck
    nextAuto: LOOP - POP_DELAY, rng: new URLSearchParams(location.search).has('t') ? 12345 : 1 + Math.floor(Math.random() * 2147483645),
  };
  S.actors.push({ m: riderPool[0], t0: 0, j: new T.Vector3() });
}
function srand() { S.rng = (S.rng * 16807) % 2147483647; return S.rng / 2147483647; }

function insertCoin(user) {
  const t = S.now;
  S.coins.push(t);
  S.shakeAt = t + COIN_FALL;
  let kind = 'minion';
  if (user) {
    S.lastUser = t; S.userCoins++;
    SFX.coin(); SFX.crank(COIN_FALL);
    // gumballs 2 : Minions 1. The first coin is always a Minion, and after three gumballs in a row the next is one too;
    // with that cap a gumball chance of 0.81 per coin works out to 2 : 1 overall (p + p² + p³ = 2)
    if (S.userCoins > 1 && S.ballsInRow < 3 && srand() < 0.81) kind = 'ball';
    S.ballsInRow = kind === 'ball' ? S.ballsInRow + 1 : 0;
  }
  S.pending.push({ at: t + POP_DELAY, kind, user });
}

function spawn(kind, user) {
  if (kind === 'ball') {
    // thrown out over the shop front (toward the camera), fast enough to clear the roof edge
    const a = Math.atan2(0.6, 1) + (srand() - 0.5) * 1.8, sp = 3.4 + srand() * 2.4;
    const mesh = new T.Mesh(ballGeoLoose, ballMat(BALL_COLS[Math.floor(srand() * BALL_COLS.length)]));
    mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
    const p = START.clone(); p.y -= 0.4;
    S.loose.push({ mesh, p, v: new T.Vector3(Math.sin(a) * sp, 4.5 + srand() * 2, Math.cos(a) * sp), rest: false, user });
    if (user) SFX.pop();
    if (S.loose.length > MAX_LOOSE) scene.remove(S.loose.shift().mesh);
    return;
  }
  // a Minion: waits its turn at the mouth, so fast coins make a nose-to-tail train
  const t0 = Math.max(S.now, S.lastPop + MOUTH_GAP);
  S.lastPop = t0;
  const busy = new Set(S.actors.map(a => a.m));
  let m = riderPool.find(r => !busy.has(r));
  if (!m) { const old = S.actors.shift(); m = old.m; }   // all out: the oldest one quietly goes home
  const a = srand() * Math.PI * 2, r = S.actors.length ? 0.4 + srand() * 0.6 : 0;
  S.actors.push({ m, t0, j: new T.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r) });
  // the ride's sounds, booked for when each part happens: out of the mouth, down the slide, into the pool
  if (user) { const d = t0 - S.now; SFX.pop(d + 0.4); SFX.whoosh(d + T_SLIDE[0], T_SLIDE[1] - T_SLIDE[0]); SFX.splash(d + T_FLY[1]); }
}

const m4 = new T.Matrix4();
const coinPool = [gum.coin, ...Array.from({ length: 3 }, () => { const c = gum.coin.clone(); scene.add(c); return c; })];
function drawMachine(now) {
  // coins falling into the slot (up to four at once)
  const falling = S.coins.filter(c => now - c < COIN_FALL);
  coinPool.forEach((c, i) => {
    const t0 = falling[falling.length - 1 - i];
    c.visible = t0 !== undefined;
    if (!c.visible) return;
    const k = (now - t0) / COIN_FALL;
    c.position.y = gum.slotY + 3.2 * (1 - k * k);
    c.rotation.z = k * Math.PI * 3;   // tumbles as it falls
  });
  // crank turns once, gumballs rattle — restarted by each coin
  const since = now - S.shakeAt;
  gum.crank.rotation.z = since >= 0 ? -ease(clamp01(since / 0.9)) * Math.PI * 2 : 0;
  const amp = since >= 0 && since < 1.4 ? Math.sin(since / 1.4 * Math.PI) * 0.14 : 0;
  gum.balls.forEach((b, i) => {
    m4.makeTranslation(gum.center.x + b.x + Math.sin(since * 31 + i) * amp * 0.6,
                       gum.center.y + b.y + Math.abs(Math.sin(since * 23 + i * 1.7)) * amp,
                       gum.center.z + b.z);
    gum.inst.setMatrixAt(i, m4);
  });
  gum.inst.instanceMatrix.needsUpdate = true;
}

function drawSplash(now) {
  // the most recent Minion to hit the water
  let hit = null;
  for (const a of S.actors) { const t = a.t0 + T_FLY[1]; if (t <= now && (!hit || t > hit.t)) hit = { t, j: a.j }; }
  const k = hit ? now - hit.t : 99, on = k < 1.3;
  const x = LAND.x + (hit ? hit.j.x : 0), z = LAND.z + (hit ? hit.j.z : 0);
  drops.forEach(d => {
    if (!on) { d.visible = false; return; }
    const v = d.userData.v;
    d.position.set(x + v.x * k, -0.1 + v.y * k - 14 * k * k, z + v.z * k);
    d.visible = d.position.y > -0.2;
  });
  ring.visible = k < 0.8; ring.position.set(x, 0.06, z);
  ring.scale.setScalar(0.6 + k * 2.4);
}

function idleAt(t) {
  idlers.forEach((m, i) => {
    const b = 1 + Math.sin(t * Math.PI * 2 / 1.25 + i * 1.3) * 0.03;
    const s = m.userData.base || (m.userData.base = m.scale.x);
    m.scale.set(s / Math.sqrt(b), s * b, s / Math.sqrt(b));
    const r = m.userData.arms[1];
    if (r.rotation.z > 2) r.rotation.z = 2.6 + Math.sin(t * 8 + i) * 0.35;   // raised arms wave
  });
}

// one simulation step of DT seconds
function step() {
  S.now += DT;
  const now = S.now;
  // the demo coin, only while nobody is playing
  if (now - S.lastUser > IDLE && now >= S.nextAuto) { insertCoin(false); S.nextAuto = now + LOOP; }
  if (now - S.lastUser <= IDLE) S.nextAuto = Math.max(S.nextAuto, S.lastUser + IDLE);
  S.pending = S.pending.filter(p => { if (p.at <= now) { spawn(p.kind, p.user); return false; } return true; });
  S.coins = S.coins.filter(c => now - c < 2);
  S.loose.forEach(stepBall);
}
function draw() {
  const now = S.now;
  S.actors = S.actors.filter(a => {
    const t = now - a.t0;
    if (t > T_WALK[1]) { a.m.visible = false; return false; }
    if (t < 0) { a.m.visible = false; return true; }   // still squeezed inside the machine
    riderAt(a.m, t, a.j); return true;
  });
  drawMachine(now); drawSplash(now); idleAt(now);
}
reset();

// ---------- pixel pass: palette snap with ordered dithering ----------
const rt = new T.WebGLRenderTarget(RES, RES, { magFilter: T.NearestFilter, minFilter: T.NearestFilter, samples: 0 });
const palVec = PALETTE.map(h => new T.Color(h)).map(c => new T.Vector3(c.r, c.g, c.b));
const post = new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({
  uniforms: { tex: { value: rt.texture }, pal: { value: palVec }, res: { value: RES }, amt: { value: 0.05 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tex; uniform vec3 pal[${PALETTE.length}]; uniform float res; uniform float amt;
    varying vec2 vUv;
    float bayer(vec2 p){
      int x = int(mod(p.x, 4.)), y = int(mod(p.y, 4.));
      int i = x + y * 4;
      float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
      for (int k = 0; k < 16; k++) if (k == i) return m[k] / 16. - .47;
      return 0.;
    }
    void main(){
      vec4 src = texture2D(tex, vUv);
      if (src.a < 0.05) { gl_FragColor = vec4(0.); return; }   // sky: leave it to the page
      // the clear colour is premultiplied to black, so a see-through pixel (the glass) holds colour × alpha:
      // lay it over white here, the way it looked on the white page
      vec3 c = src.rgb + (1. - src.a);
      c += bayer(floor(vUv * res)) * amt;
      float best = 1e9; vec3 outc = c;
      for (int i = 0; i < ${PALETTE.length}; i++) {
        vec3 d = (c - pal[i]) * vec3(0.9, 1.2, 0.7);
        float e = dot(d, d);
        if (e < best) { best = e; outc = pal[i]; }
      }
      gl_FragColor = vec4(outc, 1.);
    }`,
  depthTest: false, depthWrite: false,
}));
const postScene = new T.Scene(); postScene.add(post);
const postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function frame() {
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
// ---------- clicks: anywhere on the machine is the coin slot ----------
// invisible stand-ins for the globe and the red base, used only for hit-testing
const hitParts = [
  new T.Mesh(new T.SphereGeometry(GLOBE.r + 0.2, 16, 12)),
  new T.Mesh(new T.CylinderGeometry(2.9, 2.9, 2.4, 16)),
  new T.Mesh(new T.CylinderGeometry(1.9, 1.9, 1.4, 12)),
];
hitParts[0].position.set(MACH.x, GLOBE.y, MACH.z);
hitParts[1].position.set(MACH.x, MACH.y + 1.1, MACH.z + 0.2);
hitParts[2].position.set(MACH.x, GLOBE.y + GLOBE.r + 0.3, MACH.z);
hitParts.forEach(h => h.updateMatrixWorld(true));
const ray = new T.Raycaster(), ndc = new T.Vector2();
function overMachine(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  return ray.intersectObjects(hitParts, false).length > 0;
}

// "INSERT COIN" tag next to the slot until the first coin
const hint = document.getElementById('hint');
function placeHint() {
  cam.updateMatrixWorld();   // before the first render the camera's matrices are still identity
  // centred on the grey coin plate as it appears on screen: the middle of its projected box, height-wise,
  // and just left of its leftmost corner
  let x0 = 1, y0 = 1, y1 = -1;
  for (const dx of [-0.7, 0.7]) for (const dy of [0.4, 1.6]) for (const dz of [2.45, 2.6]) {
    const v = new T.Vector3(MACH.x + dx, MACH.y + dy, MACH.z + dz).project(cam);
    x0 = Math.min(x0, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
  }
  hint.style.left = ((x0 + 1) / 2 * 100) + '%';
  hint.style.top = ((1 - (y0 + y1) / 2) / 2 * 100) + '%';
}
placeHint();

// ?t=4.2 freezes the demo at that second (for stills); otherwise it plays at FPS steps
function renderAt(t) {
  if (t < S.now - 1e-6) reset();
  while (S.now < t - 1e-6) step();
  draw(); frame();
}
// Shaders are compiled first, off the main thread where the browser allows it (KHR_parallel_shader_compile);
// compiling them inside the first frame froze the page for ~0.6 s on arrival. The stage fades in once
// that first frame is drawn, and __ready (the recorder waits on it) only turns true then.
const fixedT = new URLSearchParams(location.search).get('t');
const stage = document.getElementById('stage');
(async function start() {
  await Promise.all([renderer.compileAsync(scene, cam), renderer.compileAsync(postScene, postCam)]).catch(() => {});
  if (fixedT !== null) renderAt(+fixedT);
  else play();
  requestAnimationFrame(() => { stage.classList.add('ready'); window.__ready = true; });
})();
function play() {
  canvas.addEventListener('pointermove', (e) => { canvas.style.cursor = overMachine(e) ? 'pointer' : ''; });
  canvas.addEventListener('pointerdown', (e) => {
    if (!overMachine(e)) return;
    SFX.unlock();
    insertCoin(true);
    hint.classList.add('gone');
  });
  const t0 = performance.now(); let done = 0;
  draw(); frame();
  (function tick() {
    const due = Math.floor((performance.now() - t0) / 1000 * FPS);
    if (due > done) {
      for (let n = 0; n < Math.min(due - done, 10); n++) step();   // after a hidden tab, don't replay minutes
      done = due; draw(); frame();
    }
    requestAnimationFrame(tick);
  })();
}
window.__render = renderAt;                                          // used by record.mjs
window.__click = () => { insertCoin(true); hint.classList.add('gone'); };   // for testing
</script>
</body>
