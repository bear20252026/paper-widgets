<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dusk Patrol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120d22;color:#f3dcc0;font-family:'Share Tech Mono',ui-monospace,monospace;-webkit-user-select:none;user-select:none;touch-action:none;cursor:crosshair}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;display:block}
#hud{pointer-events:none}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;transition:opacity 1.6s ease,transform 1.6s ease;background:radial-gradient(ellipse at center,rgba(24,10,44,.62) 0%,rgba(24,10,44,0) 68%);padding:0 16px}
#title.gone{opacity:0;transform:translateY(-24px)}
#title h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(26px,7.2vw,78px);line-height:1.18;margin:0 0 20px;color:#ffe6b8;letter-spacing:2px;text-shadow:0 4px 0 #ff9a5c,0 8px 0 #c2456c,0 12px 0 #46206a,0 16px 0 #1d1035}
#title .sub{font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.4vw,13px);letter-spacing:3px;color:#ffd0a8;margin:0 0 30px;text-shadow:2px 2px 0 #2a1546}
#bar{width:min(320px,70vw);height:14px;border:3px solid #ffd9a8;padding:2px;background:#1b1030;box-shadow:3px 3px 0 #2a1546}
#fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#ff9a5c 0 8px,#1b1030 8px 10px)}
#status{font-size:15px;margin:14px 0 0;color:#e9d2bd;opacity:.85}
#go{font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.5vw,12px);color:#ffe6b8;margin:6px 0 0;opacity:0;text-shadow:2px 2px 0 #2a1546;letter-spacing:1px}
#go.on{opacity:1;animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
#hints{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px 9px;font-size:14px;letter-spacing:.5px;color:#ecd7c4;background:linear-gradient(rgba(12,8,24,0),rgba(12,8,24,.5));opacity:.82;pointer-events:none}
#hints b{color:#ffcf8f;font-weight:400}
#hints .r{display:flex;align-items:center;gap:14px;pointer-events:auto}
#msl{display:flex;gap:4px;align-items:center}
#msl i{display:block;width:5px;height:12px;background:#f3e6d6;box-shadow:inset 0 -3px 0 #d0384a;opacity:1}
#msl i.off{background:transparent;box-shadow:inset 0 0 0 1px #8e7a8c;opacity:.7}
#snd{font:inherit;color:#ecd7c4;background:rgba(20,12,36,.55);border:1px solid #9a8396;padding:2px 9px;cursor:pointer;letter-spacing:1px}
#snd:hover{border-color:#ffcf8f;color:#fff}
#touch{position:fixed;right:10px;bottom:46px;display:none;flex-direction:column;gap:10px}
#touch button{font-family:'Press Start 2P',monospace;font-size:10px;width:78px;height:50px;color:#ffe6b8;background:rgba(30,16,52,.62);border:3px solid #ffd9a8;box-shadow:3px 3px 0 #2a1546;touch-action:none}
@media (pointer:coarse){#touch{display:flex}#hints .k{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="title">
  <h1>DUSK<br>PATROL</h1>
  <p class="sub">LAKE COUNTRY &middot; LAST LIGHT</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="status">Surveying the valley...</p>
  <p id="go">MOVE THE MOUSE TO TAKE THE STICK</p>
</div>
<div id="hints">
  <span class="k"><b>MOUSE</b> steer &nbsp;&middot;&nbsp; <b>CLICK</b> roll &nbsp;&middot;&nbsp; <b>HOLD</b> afterburner &nbsp;&middot;&nbsp; <b>RIGHT-CLICK / F</b> missile &nbsp;&middot;&nbsp; <b>SPACE</b> camera</span>
  <span class="r"><span id="msl"></span><button id="snd" type="button">SOUND OFF</button></span>
</div>
<div id="touch">
  <button data-a="view">VIEW</button><button data-a="fire">FIRE</button><button data-a="roll">ROLL</button><button data-a="boost">BOOST</button>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const N=1024,CN=512,TILE=12288,WL=0.36,MAXH=780,CB=430,CH=250,CTILE=9000;
const SUN_AZ=235*Math.PI/180,SUN_EL=9.5*Math.PI/180;
const SUN=[Math.cos(SUN_EL)*Math.sin(SUN_AZ),Math.sin(SUN_EL),-Math.cos(SUN_EL)*Math.cos(SUN_AZ)];
const TAU=Math.PI*2,D2R=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const add=(a,b,s)=>{s=s===undefined?1:s;return [a[0]+b[0]*s,a[1]+b[1]*s,a[2]+b[2]*s]};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mix3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrapA=a=>{a%=TAU;if(a>Math.PI)a-=TAU;if(a<-Math.PI)a+=TAU;return a};

/* ================= WORLD GENERATION (web workers) ================= */
function wk(S){
  const N=1024,CN=512,WL=0.36,MAXH=780;
  let HN=null;
  function hash(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
  function vn(x,y,p,s){
    const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
    const u=fx*fx*fx*(fx*(fx*6-15)+10),v=fy*fy*fy*(fy*(fy*6-15)+10);
    const x0=((xi%p)+p)%p,y0=((yi%p)+p)%p,x1=(x0+1)%p,y1=(y0+1)%p;
    const a=hash(x0,y0,s),b=hash(x1,y0,s),c=hash(x0,y1,s),d=hash(x1,y1,s);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  }
  function fbm(u,v,base,oct,s,g){let a=1,sum=0,tot=0,p=base;for(let o=0;o<oct;o++){sum+=a*vn(u*p,v*p,p,s+o*17);tot+=a;a*=g;p*=2;}return sum/tot;}
  S.onmessage=function(e){
    const m=e.data;
    if(m.t==='hn'){HN=m.hn;return;}
    const r0=m.r0,r1=m.r1;let out,k=0;
    if(m.t==='terrain'){
      out=new Float32Array((r1-r0)*N*3);
      for(let j=r0;j<r1;j++){const v=j/N;for(let i=0;i<N;i++){const u=i/N;
        const wu=u+0.07*(fbm(u,v,2,2,91,.5)-.5),wv=v+0.07*(fbm(u,v,2,2,57,.5)-.5);
        let h=fbm(wu,wv,3,7,1,.5);
        const mk=fbm(u,v,2,3,33,.5);
        let rg=1-Math.abs(2*fbm(wu,wv,4,5,5,.55)-1);rg=rg*rg;
        h+=rg*0.8*Math.max(0,mk-0.42)*3.0;
        out[k++]=h;out[k++]=fbm(u,v,10,3,71,.5);out[k++]=fbm(u,v,6,3,13,.5);
      }}
    }else if(m.t==='cloud'){
      out=new Float32Array((r1-r0)*CN*2);
      for(let j=r0;j<r1;j++){const v=j/CN;for(let i=0;i<CN;i++){const u=i/CN;
        const wu=u+0.06*(fbm(u,v,3,2,301,.5)-.5),wv=v+0.06*(fbm(u,v,3,2,302,.5)-.5);
        out[k++]=fbm(wu,wv,5,5,211,.55);out[k++]=fbm(u,v,28,3,223,.5);
      }}
    }else{
      const tex=12288/N,sx=m.sx,sz=m.sz,tanEl=m.tan;
      const wh=h=>h>WL?(h-WL)/(1-WL)*MAXH:0;
      out=new Float32Array((r1-r0)*N);
      for(let j=r0;j<r1;j++)for(let i=0;i<N;i++){
        const H0=wh(HN[j*N+i]);let occ=0,d=1.5;
        while(d<420){
          const ix=((Math.floor(i+sx*d)%N)+N)%N,iy=((Math.floor(j+sz*d)%N)+N)%N;
          const dw=d*tex,rayH=H0+dw*tanEl+3;
          if(rayH>MAXH)break;
          const th=wh(HN[iy*N+ix]);
          if(th>rayH){const o=(th-rayH)/(10+dw*.03);if(o>occ){occ=o;if(occ>=1)break;}}
          d+=1+d*.06;
        }
        out[k++]=occ>1?1:occ;
      }
    }
    S.postMessage({t:m.t,r0:r0,data:out},[out.buffer]);
  };
}
function makePool(){
  const n=Math.max(2,Math.min(6,navigator.hardwareConcurrency||4));
  try{
    const url=URL.createObjectURL(new Blob(['('+wk.toString()+')(self)'],{type:'text/javascript'}));
    const pool=[];for(let i=0;i<n;i++)pool.push(new Worker(url));
    return pool;
  }catch(err){
    let fw;const S={postMessage(d){setTimeout(()=>fw.onmessage&&fw.onmessage({data:d}))}};
    wk(S);fw={onmessage:null,postMessage(m){setTimeout(()=>S.onmessage({data:m}))}};
    return [fw];
  }
}
function runAll(pool,tasks,onTask){
  return new Promise(res=>{
    let next=0,done=0;const total=tasks.length;
    if(!total){res();return;}
    pool.forEach(w=>{
      const pump=()=>{
        if(next>=total)return;
        const ti=next++;
        w.onmessage=e=>{onTask(tasks[ti],e.data);done++;if(done===total)res();else pump();};
        w.postMessage(tasks[ti]);
      };
      pump();
    });
  });
}
function equalize(a){
  const BINS=4096,n=a.length;let mn=Infinity,mx=-Infinity;
  for(let i=0;i<n;i++){const v=a[i];if(v<mn)mn=v;if(v>mx)mx=v;}
  const sc=(BINS-1e-3)/(mx-mn||1),hist=new Float64Array(BINS);
  for(let i=0;i<n;i++)hist[((a[i]-mn)*sc)|0]++;
  const cum=new Float64Array(BINS+1);for(let b=0;b<BINS;b++)cum[b+1]=cum[b]+hist[b];
  for(let i=0;i<n;i++){const x=(a[i]-mn)*sc,b=x|0,f=x-b;a[i]=(cum[b]+f*hist[b])/n;}
}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function generate(prog){
  const pool=makePool();
  const hn=new Float32Array(N*N),pa=new Float32Array(N*N),pb=new Float32Array(N*N),sh=new Float32Array(N*N);
  const cd=new Float32Array(CN*CN),cdet=new Float32Array(CN*CN);
  const B=64,tasks=[];
  for(let r=0;r<N;r+=B)tasks.push({t:'terrain',r0:r,r1:r+B});
  for(let r=0;r<CN;r+=B)tasks.push({t:'cloud',r0:r,r1:r+B});
  let done=0;const nT=tasks.length;
  await runAll(pool,tasks,(m,d)=>{
    const o=d.data;
    if(m.t==='terrain'){for(let q=0,k=d.r0*N;q<o.length;q+=3,k++){hn[k]=o[q];pa[k]=o[q+1];pb[k]=o[q+2];}}
    else{for(let q=0,k=d.r0*CN;q<o.length;q+=2,k++){cd[k]=o[q];cdet[k]=o[q+1];}}
    done++;prog(.55*done/nT,'Raising mountains, filling lakes...');
  });
  prog(.57,'Settling the shorelines...');await tick();
  equalize(hn);equalize(pa);equalize(pb);equalize(cd);equalize(cdet);
  const WQ=0.4;
  for(let i=0;i<N*N;i++){const u=hn[i];hn[i]=u<WQ?u/WQ*WL:WL+(1-WL)*Math.pow((u-WQ)/(1-WQ),2.2);}
  for(let i=0;i<CN*CN;i++)cd[i]=clamp((cd[i]-.53)/.47,0,1);
  prog(.6,'Casting long shadows...');await tick();
  const st=[];for(let r=0;r<N;r+=B)st.push({t:'shadow',r0:r,r1:r+B,sx:SUN[0]/Math.cos(SUN_EL),sz:SUN[2]/Math.cos(SUN_EL),tan:Math.tan(SUN_EL)});
  pool.forEach(w=>w.postMessage({t:'hn',hn:hn}));
  done=0;
  await runAll(pool,st,(m,d)=>{
    const o=d.data;for(let q=0,k=d.r0*N;q<o.length;q++,k++)sh[k]=o[q];
    done++;prog(.6+.4*done/st.length,'Casting long shadows...');
  });
  pool.forEach(w=>{if(w.terminate)w.terminate();});
  return {hn,pa,pb,sh,cd,cdet};
}
let HN=null;
function hAt(x,z){
  const u=x/TILE*N-.5,v=z/TILE*N-.5,i0=Math.floor(u),j0=Math.floor(v),fu=u-i0,fv=v-j0;
  const a=((i0%N)+N)%N,b=(a+1)%N,c=((j0%N)+N)%N,d=(c+1)%N;
  const h=(HN[c*N+a]*(1-fu)+HN[c*N+b]*fu)*(1-fv)+(HN[d*N+a]*(1-fu)+HN[d*N+b]*fu)*fv;
  return h>WL?(h-WL)/(1-WL)*MAXH:0;
}
function setProg(f,txt){$('fill').style.width=Math.round(f*100)+'%';if(txt)$('status').textContent=txt;}
/* ================= WEBGL2 : SHADERS ================= */
const VS_FULL=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;

const FS_RAY=`#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uT;
uniform sampler2D uC;
uniform vec3 uCam,uR,uU,uF,uSun,uJP,uJF;
uniform vec2 uRes,uWind;
uniform float uTan,uTime;
uniform vec4 uImp[8];
out vec4 oC;
const float TILE=12288.,WL=.36,MAXH=780.,CB=430.,CH=250.,CTILE=9000.,TMAX=15000.,NEAR=2.,FAR=30000.;
float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
float bayer(vec2 fc){
  const float m[16]=float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
  ivec2 p=ivec2(mod(fc,4.));
  return (m[p.x+p.y*4]+.5)/16.;
}
float h21(vec2 p){p=mod(p,2048.);vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float qd(float x,float n,float b){return floor(clamp(x,0.,1.)*n+b)/n;}
vec3 sky(vec3 rd,bool sunOn){
  float e=max(rd.y,0.);
  vec2 hd=normalize(rd.xz+vec2(1e-5,0.)),sd=normalize(uSun.xz);
  float w=ss(-.35,.95,dot(hd,sd));
  vec3 hz=mix(vec3(.60,.52,.78),vec3(1.,.74,.42),w);
  vec3 md=mix(vec3(.50,.38,.72),vec3(.98,.55,.45),w);
  vec3 tp=mix(vec3(.16,.14,.40),vec3(.34,.22,.52),w);
  vec3 c=mix(hz,md,ss(0.,.22,e));
  c=mix(c,tp,ss(.12,.9,e));
  float s=dot(rd,uSun);
  c+=vec3(1.,.62,.28)*pow(max(s,0.),8.)*.35+vec3(1.,.82,.5)*pow(max(s,0.),64.)*.5;
  if(e>.02){
    vec2 q=rd.xz/(e+.15);
    float n=vn(vec2(q.x*.35,q.y*3.2+uTime*.02))*.6+vn(vec2(q.x*.9,q.y*7.))*.4;
    float m=ss(.6,.72,n)*ss(.02,.18,e)*(1.-ss(.5,.9,e));
    c=mix(c,mix(vec3(1.,.7,.6),vec3(1.,.86,.74),w),m*.7);
  }
  if(sunOn){float ang=acos(clamp(s,-1.,1.));if(ang<.05)c=mix(vec3(1.,.82,.45),vec3(1.,.97,.8),1.-ss(0.,.035,ang));}
  return c;
}
vec3 hazeCol(vec3 rd){return sky(normalize(vec3(rd.x,.03,rd.z)),false);}
float fogT(float t,float y0,float dy){
  const float c=.00048,b=.0011;float k=b*dy;
  float a=abs(k*t)<1e-3?t:(1.-exp(-k*t))/k;
  return c*exp(-b*y0)*a;
}
float wh(float h){return h>WL?(h-WL)/(1.-WL)*MAXH:0.;}
float surf(vec2 xz){return wh(texture(uT,xz/TILE).r);}
float cTop(vec2 xz){vec2 c=texture(uC,xz/CTILE+uWind).rg;return c.r>.05?CB+CH*(pow(c.r,.55)*.82+.18*c.g*c.r):-1.;}
float cTopS(vec2 xz){return max(cTop(xz),CB);}
float jetSh(vec3 p){
  vec2 so=uSun.xz*.2*(p.y-uJP.y);
  vec2 d=p.xz-(uJP.xz+so);
  vec2 f2=normalize(uJF.xz+vec2(1e-6,0.));
  float f=dot(d,f2),r=dot(d,vec2(-f2.y,f2.x)),ar=abs(r);
  float fus=step(ar,2.6)*step(-24.,f)*step(f,23.);
  float wing=step(2.,ar)*step(ar,15.5)*step(-8.+(ar-4.)*1.45,f)*step(f,18.);
  return max(fus,wing);
}
vec3 shadeGround(vec3 p,vec3 rd,float t,float b){
  vec4 s0=texture(uT,p.xz/TILE);
  float hn=s0.r;
  bool wat=hn<=WL;
  float js=0.;
  if(p.y<uJP.y-4.)js=jetSh(vec3(p.x,wat?0.:p.y,p.z));
  float cs=0.;
  if(p.y<CB){vec2 csp=p.xz+uSun.xz/uSun.y*(520.-p.y);cs=ss(.05,.2,texture(uC,csp/CTILE+uWind).r);}
  vec3 col;
  if(wat){
    float depth=clamp((WL-hn)/WL,0.,1.);
    vec2 wp=p.xz;
    float w1=vn(wp/36.+vec2(uTime*.30,uTime*.17));
    float w2=vn(wp/15.-vec2(uTime*.22,-uTime*.35));
    float w3=vn(wp/24.+vec2(7.,uTime*.28));
    vec3 wn=normalize(vec3((w1-.5)*.5+(w2-.5)*.3,1.,(w3-.5)*.5+(w2-.5)*.25));
    float dd=depth+(vn(wp/70.)-.5)*.08;
    vec3 c0=vec3(.62,.95,.86),c1=vec3(.16,.68,.74),c2=vec3(.09,.36,.60),c3=vec3(.05,.13,.36);
    col=mix(c0,c1,ss(.02,.22,dd));
    col=mix(col,c2,ss(.2,.5,dd));
    col=mix(col,c3,ss(.45,.95,dd));
    vec3 rf=reflect(rd,wn);rf.y=abs(rf.y);
    float fr=.05+.95*pow(1.-clamp(-dot(rd,wn),0.,1.),4.);
    col=mix(col,sky(rf,false)*.95,clamp(fr,0.,1.));
    float shd=clamp(s0.g*.8+cs*.6+js*.6,0.,1.);
    col*=mix(vec3(1.),vec3(.55,.5,.8),shd);
    float spc=max(dot(rf,uSun),0.);
    float g=pow(spc,26.)*(.35+w1*.9+w2*.5)*(1.-.8*shd);
    col=mix(col,vec3(1.,.82,.5),step(.5,g));
    col=mix(col,vec3(1.,.96,.82),step(.85,g));
    vec2 gc=floor(wp/vec2(4.5,2.2));
    float gh=h21(gc+floor(uTime*2.5+h21(gc.yx)*8.));
    float thr=.992-.02*pow(spc,6.);
    col=mix(col,vec3(1.),step(thr,gh)*(1.-ss(1800.,4500.,t)));
    float nw=vn(wp/45.);
    float f1=step(depth,.02+.014*sin(uTime*1.4+nw*6.));
    float f2=step(abs(depth-.085-.025*sin(uTime*1.1+nw*5.+2.)),.006);
    col=mix(col,vec3(.97,1.,.98)*mix(1.,.7,shd),max(f1,f2));
  }else{
    float e=12.;
    float hl=surf(p.xz-vec2(e,0.)),hr=surf(p.xz+vec2(e,0.)),hd=surf(p.xz-vec2(0.,e)),hu=surf(p.xz+vec2(0.,e));
    vec3 n=normalize(vec3(hl-hr,2.*e,hd-hu));
    float y=p.y,slope=1.-n.y;
    float A=s0.b+.14*(vn(p.xz/80.)-.5),B=s0.a;
    float hv=h21(floor(p.xz/10.));
    col=mix(vec3(.82,.80,.48),vec3(.66,.71,.38),ss(.3,.7,s0.b));
    float forest=ss(.5,.62,B)*(1.-ss(300.,380.,y))*(1.-ss(.5,.75,slope));

function LN(x0,y0,x1,y1,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  if(!isFinite(x0+y0+x1+y1)||Math.abs(x0)>3000||Math.abs(y0)>3000||Math.abs(x1)>3000||Math.abs(y1)>3000)return;

  }

function CIR(cx,cy,r,c){
  cx=Math.round(cx);cy=Math.round(cy);X.fillStyle=c;

function POLY(pts,c){

/* ================= HUD ================= */
const HCOL='#a6ffc4',HSH='#07261f';
function hl(x0,y0,x1,y1){LN(x0+1,y0+1,x1+1,y1+1,HSH);LN(x0,y0,x1,y1,HCOL);}
function ht(s,x,y,al){TXT(s,x+1,y+1,HSH,1,al);TXT(s,x,y,HCOL,1,al);}
const dirAt=(psi,el)=>{const c=Math.cos(el);return [c*Math.sin(psi),Math.sin(el),-c*Math.cos(psi)];};
function proj(d){
  const z=dot(d,cam.f);if(z<.02)return null;

function tape(x,yc,val,step,per,dir,lab,disp){
  const base=Math.round(val/step)*step;
  for(let k=-6;k<=6;k++){
    const v=base+k*step,y=yc-(v-val)/step*per;
    if(Math.abs(y-yc)>46||Math.abs(y-yc)<9||v<0)continue;
    const mj=(Math.round(v/step)%5)===0;
    hl(x,y,x+dir*(mj?6:3),y);
    if(mj)ht(String(v),x-dir*3,y-2,dir>0?'r':'l');
  }
  const bx=dir>0?x-36:x;
  R(bx,yc-6,36,12,'rgba(5,28,22,.62)');hl(bx,yc-6,bx+36,yc-6);hl(bx,yc+6,bx+36,yc+6);
  ht(String(disp),bx+18,yc-2,'c');ht(lab,bx+18,yc-17,'c');
}
function drawHUD(al){
  X.globalAlpha=al;

      for(const sd of [-1,1]){const a=proj(dirAt(psi+sd*5*D2R,0)),b=proj(dirAt(psi+sd*38*D2R,0));if(a&&b)hl(a[0],a[1],b[0],b[1]);}
      continue;

    for(const sd of [-1,1]){
      const a=proj(dirAt(psi+sd*3.2*D2R,e)),b=proj(dirAt(psi+sd*(3.2+w)*D2R,e));
      if(!a||!b)continue;
      hl(a[0],a[1],b[0],b[1]);
      if(p%10===0){hl(b[0],b[1],b[0],b[1]+(p>0?4:-4));ht(String(Math.abs(p)),b[0]+sd*8,b[1]-2,'c');}
    }
  }
  const bs=proj(JB.f);
  if(bs){CIR(bs[0]+1,bs[1]+1,3,HSH);CIR(bs[0],bs[1],3,HCOL);hl(bs[0]-10,bs[1],bs[0]-4,bs[1]);hl(bs[0]+4,bs[1],bs[0]+10,bs[1]);hl(bs[0],bs[1]-4,bs[0],bs[1]-7);}

  }

  ht(String(Math.round(hdg)%360).padStart(3,'0'),cx,ty+9,'c');

/* ================= SOUND (Web Audio, off by default) ================= */
const Snd={
  ctx:null,on:false,eng:null,master:null,nbuf:null,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=this.ctx=new AC();
    this.master=c.createGain();this.master.gain.value=.55;this.master.connect(c.destination);
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5;}
    this.nbuf=buf;
    const ns=c.createBufferSource();ns.buffer=buf;ns.loop=true;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;
    const g=c.createGain();g.gain.value=.5;ns.connect(lp);lp.connect(g);g.connect(this.master);ns.start();
    const o1=c.createOscillator(),o2=c.createOscillator();o1.type='sawtooth';o2.type='sawtooth';o1.frequency.value=70;o2.frequency.value=73;
    const olp=c.createBiquadFilter();olp.type='lowpass';olp.frequency.value=380;
    const og=c.createGain();og.gain.value=.05;o1.connect(olp);o2.connect(olp);olp.connect(og);og.connect(this.master);o1.start();o2.start();
    const ws=c.createBufferSource();ws.buffer=buf;ws.loop=true;
    const hp=c.createBiquadFilter();hp.type='bandpass';hp.frequency.value=1200;hp.Q.value=.6;
    const wg=c.createGain();wg.gain.value=.05;ws.connect(hp);hp.connect(wg);wg.connect(this.master);ws.start();
    this.eng={lp,g,o1,o2,og,olp,hp,wg};
  },
  set(on){
    this.on=on;
    if(on){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
    if(this.master)this.master.gain.value=on?.55:0;
    $('snd').textContent=on?'SOUND ON':'SOUND OFF';
  },
  update(){
    if(!this.on||!this.eng)return;
    const e=this.eng,t=this.ctx.currentTime,ab=J.ab,v=J.v/400;
    e.lp.frequency.setTargetAtTime(260+500*ab+200*v,t,.1);e.g.gain.setTargetAtTime(.35+.45*ab,t,.1);
    e.o1.frequency.setTargetAtTime(60+40*v+30*ab,t,.15);e.o2.frequency.setTargetAtTime(63+40*v+30*ab,t,.15);
    e.olp.frequency.setTargetAtTime(300+500*ab,t,.1);e.og.gain.setTargetAtTime(.04+.05*ab,t,.1);
    e.wg.gain.setTargetAtTime(.02+.1*v*v+.01*Math.min(4,Math.abs(J.g-1)),t,.1);e.hp.frequency.setTargetAtTime(900+1200*v,t,.2);
  },
  burst(dur,f0,f1,gain,type){
    if(!this.on||!this.ctx)return;
    const c=this.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=this.nbuf;
    const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=c.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random());s.stop(t+dur+.05);
  },
  tone(f0,f1,dur,gain,type){
    if(!this.on||!this.ctx)return;
    const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.05);
  },
  launch(){this.burst(1.3,3500,250,.5,'lowpass');},
  boom(w){this.burst(w?1.6:2.4,w?1800:900,50,1.2,'lowpass');this.tone(90,28,1.3,.7,'sine');},
  roll(){this.burst(.9,500,2200,.25,'bandpass');},
  click(){this.tone(660,990,.08,.06,'square');}
};

/* ================= INPUT ================= */
let ready=false,pmx=null,pmy=null,travel=0;
function begin(){if(ready)$('title').classList.add('gone');}
function take(){if(ready){moved=true;begin();}}
addEventListener('mousemove',e=>{
  inp.mx=e.clientX;inp.my=e.clientY;
  if(pmx!==null)travel+=Math.abs(e.clientX-pmx)+Math.abs(e.clientY-pmy);
  pmx=e.clientX;pmy=e.clientY;
  if(!moved&&travel>10)take();
  if(!(e.buttons&1))inp.left=false;
});
addEventListener('mousedown',e=>{
  if(e.target.closest&&e.target.closest('#snd'))return;
  e.preventDefault();take();
  if(e.button===0){inp.left=true;inp.leftT=performance.now();}
  else if(e.button===2){fire();}
});
addEventListener('mouseup',e=>{
  if(e.button===0&&inp.left){
    const dur=performance.now()-inp.leftT;inp.left=false;
    if(dur<220)barrel();
  }
});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{inp.left=false;inp.key=false;inp.touch=false;});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat){begin();cycleView();}}
  else if(e.code==='KeyF'){if(!e.repeat){begin();fire();}}
  else if(e.key==='Shift'){inp.key=true;}
  else if(e.code==='KeyM'){Snd.set(!Snd.on);}
});
addEventListener('keyup',e=>{if(e.key==='Shift')inp.key=false;});
function touchSteer(e){
  begin();
  const t=e.touches[0];
  if(t&&!(e.target.closest&&e.target.closest('#touch'))){inp.mx=t.clientX;inp.my=t.clientY;moved=ready||moved;}
}
addEventListener('touchstart',touchSteer,{passive:true});
addEventListener('touchmove',touchSteer,{passive:true});
document.querySelectorAll('#touch button').forEach(b=>{
  const a=b.dataset.a;
  b.addEventListener('touchstart',e=>{
    e.preventDefault();begin();
    if(a==='view')cycleView();else if(a==='fire')fire();else if(a==='roll')barrel();else inp.touch=true;
  },{passive:false});
  const end=()=>{if(a==='boost')inp.touch=false;};
  b.addEventListener('touchend',end);b.addEventListener('touchcancel',end);
});
$('snd').addEventListener('click',e=>{e.stopPropagation();Snd.set(!Snd.on);});
addEventListener('resize',resizeOV);

/* ================= MAIN LOOP ================= */
let lastTs=0,frameAvg=1/60,slowT=0,fcount=0,hk='';
function updateHints(){
  const k=SLOTS.map(s=>s.armed?1:0).join('');
  if(k!==hk){hk=k;$('msl').innerHTML='<span>MSL</span>'+SLOTS.map(s=>'<i class="'+(s.armed?'':'off')+'"></i>').join('');}
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!ready)return;
  const raw=Math.min(.1,(ts-lastTs)/1000||.016);lastTs=ts;
  const dt=Math.max(.001,raw);
  fcount++;
  if(fcount>90){
    frameAvg=lerp(frameAvg,raw,.05);
    if(frameAvg>1/40&&GHT>224){slowT+=raw;if(slowT>1.5){GHT=GHT>=340?300:GHT>=300?264:GHT>=264?240:224;slowT=0;frameAvg=1/60;}}
    else slowT=Math.max(0,slowT-raw);
  }
  update(dt);updateCam(dt);render();drawOverlay();Snd.update();updateHints();
}
(async function boot(){
  try{
    initGL();resizeGL();resizeOV();
    const w=await generate(setProg);
    HN=w.hn;
    uploadWorld(w);initMeshes();findStart();
    JB=basis(J.psi,J.th,0);
    $('bar').style.display='none';$('status').style.display='none';
    if(matchMedia('(pointer:coarse)').matches)$('go').textContent='TOUCH THE SCREEN TO TAKE THE STICK';
    $('go').classList.add('on');
    ready=true;
    window.dusk={J:J,setView:setView,fire:fire,barrel:barrel,take:take,begin:begin,info:()=>({view,wC,missiles:MS.length,particles:PL.length,res:GHT,fps:Math.round(1/frameAvg)})};
  }catch(err){
    $('status').textContent='Could not start: '+err.message;$('status').style.color='#ff9a8a';console.error(err);
  }
})();
requestAnimationFrame(frame);
