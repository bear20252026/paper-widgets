<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Grow — words that grow into things</title>
<meta name="description" content="Type a word. It sprouts into flowers, trees, grass or a crowd of minions, then settles back into ink. A small toy to type into and watch.">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Text Grow — words that grow into things">
<meta property="og:description" content="Type a word. It sprouts into flowers, trees, grass or a crowd of minions, then settles back into ink.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Text Grow — words that grow into things">
<meta name="twitter:description" content="Type a word. It sprouts into flowers, trees, grass or a crowd of minions, then settles back into ink.">
<style>
  /* the faces the piece can be set in, kept beside it so it runs with no network at all.
     All seven are SIL Open Font License; latin subset only — anything else falls back to the system. */
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/geist-400.woff2") format("woff2"); }
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/geist-500.woff2") format("woff2"); }
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/geist-600.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/geist-mono-500.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/instrument-serif-400.woff2") format("woff2"); }
  @font-face { font-family: "Rubik Mono One"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/rubik-mono-one-400.woff2") format("woff2"); }
  @font-face { font-family: "Caveat"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/caveat-700.woff2") format("woff2"); }
</style>
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('bloom-theme')
      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">Text Grow</div>
    <div class="right">
      <button id="side-toggle" title="show / hide controls" aria-label="controls">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="M15 12h6"/></svg>
      </button>
      <button id="theme" title="light / dark interface" aria-label="theme">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="preview">
      <div id="stage">
        <canvas id="c"></canvas>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <span class="label">Text</span>
        <textarea id="text" class="field" rows="1" autocomplete="off" spellcheck="false" placeholder="type something">Banana</textarea>
        <div class="letters" id="letters" title="which letters grow"></div>
        <div class="seg fonts" id="font">
          <button data-val="geist" class="on">Geist</button>
          <button data-val="serif">Serif</button>
          <button data-val="rubik">Rubik</button>
          <button data-val="script">Script</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="label">Grows into</span>
          <button type="button" id="all" class="ckb" title="select all / none"></button>
        </div>
        <div class="seg" id="tabs"></div>
        <div id="sets"></div>
        <input id="yours" class="field yours" type="text" autocomplete="off" spellcheck="false" placeholder="or type your own emoji">
      </div>

      <div class="card">
        <span class="label">Motion</span>
        <div class="seg" id="arrive">
          <button data-val="pop" class="on">pop</button>
          <button data-val="spin">spin</button>
          <button data-val="fade">fade</button>
        </div>
        <div class="seg" id="ease">
          <button data-val="back" class="on">back</button>
          <button data-val="bounce">bounce</button>
        </div>
        <div class="seg" id="order">
          <button data-val="left" class="on">left</button>
          <button data-val="center">center</button>
          <button data-val="tap">tap</button>
        </div>
        <div class="row"><div class="head"><span>duration</span><output></output></div>
          <input type="range" data-key="duration" min="2000" max="8000" step="100" value="4200"></div>
        <div class="row"><div class="head"><span>size</span><output></output></div>
          <input type="range" data-key="size" min="0.6" max="1.8" step="0.05" value="1.15"></div>
        <div class="row"><div class="head"><span>density</span><output></output></div>
          <input type="range" data-key="density" min="0.3" max="1.6" step="0.05" value="0.7"></div>
      </div>

      <div class="card">
        <div class="seg" id="loop">
          <button data-val="loop" class="on">loop</button>
          <button data-val="once">once</button>
        </div>
        <button id="start" class="go">start</button>
      </div>
    </aside>
  </main>

  <footer class="foot" id="credit">
    made with
    <button id="heartBtn" aria-label="like">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="heart" d="M2 9.1371C2 14 6.01943 16.5914 8.96173 18.9109C10 19.7294 11 20.5 12 20.5C13 20.5 14 19.7294 15.0383 18.9109C17.9806 16.5914 22 14 22 9.1371C22 4.27416 16.4998 0.825464 12 5.50063C7.50016 0.825464 2 4.27416 2 9.1371Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <!-- liked: a banana -->
      <span class="banana" aria-hidden="true">🍌</span>
    </button>
    by <a href="https://x.com/yuxuan_o_o" target="_blank" rel="noopener">Yuxuan</a> · AI
  </footer>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
