  /* the pattern book: shut in the bottom right-hand corner, or open there (laid out 560px wide, shown at --bk of that), set like an old book of spells —

  #book{position:fixed;right:30px;bottom:34px;z-index:3;width:128px;padding:0;border:0;background:none;font:inherit;cursor:inherit;transform:rotate(-4deg);transition:transform .18s ease-out}
  .cover{position:relative;display:block;width:100%} #book:not(.ready) .name,#book:not(.ready) .strap{visibility:hidden}   /* title and clasp wait for the book's picture */
  .cover img{display:block;width:100%;height:auto;filter:drop-shadow(3px 4px 0 rgba(18,13,11,.55))}
  .cover .name{position:absolute;left:11%;right:8%;top:17.500%;text-align:center;font-family:var(--bl);font-weight:500;font-size:16px;line-height:1;letter-spacing:.02em;color:#f4edd2;text-shadow:0 1px 0 rgba(29,23,20,.5)}

  .book-open #spread,.book-fx #spread{visibility:visible} .book-open:not(.book-fx) #spread{pointer-events:auto}
  /* shutting the book: the left half is the front cover seen from inside. It swings over on the spine (.flap: the page on

  .pages::before{content:"";position:absolute;inset:0;z-index:-1;background:url(assets/book/book-open-cut.webp) center/100% 100% no-repeat;filter:drop-shadow(4px 6px 0 rgba(18,13,11,.5))}

  :root{--bk:.86} @media (max-width:1100px){ :root{--bk:.74} }

  .plate.pencil svg *{fill:none;stroke:#8d8573;stroke-width:1.4;stroke-dasharray:3.2 2.4}

  .plate [data-part]{transition:opacity .15s}

  .stamp{position:absolute;right:6px;bottom:9px;padding:1px 7px 2px;border:1.6px solid var(--rub);border-radius:3px;color:var(--rub);font-family:var(--sc);font-size:12px;letter-spacing:.12em;transform:rotate(-9deg)}
  .ttl{margin:9px 0 0;font-family:var(--bl);font-size:27px;font-weight:500;line-height:1;letter-spacing:.01em}

  /* Japanese, Korean, Chinese: no italics and no small capitals there, so the reading text stands upright; and a name too long

  :root:not([lang=en]) .tag{line-height:1.286}

  :root:not([lang=en]) .tab span{font-size:10.5px;letter-spacing:.02em;white-space:nowrap}

  .pg.gal .look{display:flex} .pg.gal>.plate,.pg.gal>.sub,.pg.gal>.parts,.pg.gal>.swatches,.pg.gal>.lbl-color,.pg.gal>.shades,.pg.gal>.lbl-orn,.pg.gal>.orns,.pg.gal>.lbl-lay,.pg.gal>.lays,.pg.gal>.kinds,.pg.gal>.foot{display:none}
  .pg.gal .head i{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:13px;letter-spacing:0;color:#5c5245;margin-left:.45em}
  :root:not([lang=en]) .pg.gal .head i{font-family:var(--serif);font-style:normal;font-size:12px}

  /* the cloths: round samples in two rows of four (plain cloths from thin to thick, then the worked ones), each with its name underneath; the sample is what gets ringed */
  /* The right page is set between the same two lines as the drawing on the left: its choices begin under the row of parts and end

<script>

const qs=new URLSearchParams(location.search);

const tracked=new Set();

/* ───────────── constants (metres) ───────────── */

// The hoop pulls each fold of the skirt round after it, softly. Once a fold trails by more than about a third of a turn the pull
// grows steeply, so that no fold ever falls half a turn behind: past that point the shortest way home is the wrong way round, and
// the skirt stayed wound about the waist. ?unwind=angle,strength (9,0 = the even pull it had before).

const LACES=[{id:'roses',rep:.36,k:1.2,th:[.25,.24,.15]},{id:'petal',art:'petal',rep:.46,k:1,edge:{w:.30,h:.15},th:[.26,.24,.22]},{id:'damask',art:'damask',rep:.42,k:1,gore:1,edge:{w:.21,h:.17},th:[.25,.25,.22]},{id:'cascade',art:'cascade',rep:.30,k:1,gore:14,panel:1,edge:{w:.08,h:.04},th:[.5,.5,.20]}], laceP={};   // th: the piece of the repeat its small sample shows (centre u,v · width in metres)
{ const v=(qs.get('lace')||'').split(',').map(id=>Math.max(0,LACES.findIndex(l=>l.id===id))); ['collar','bodice','skirt'].forEach((k,j)=>laceP[k]=v[j]===undefined?v[0]:v[j]); }   // ?lace=airy, or one for each of collar,bodice,skirt

const YW=1.04, DROP=1.04, RW=0.112, RH=0.93, AX=0.125, BZ=0.098;

const TAU=Math.PI*2, WALL_Z=-3.0;
const TUNE={wb:+(qs.get('wb')||0.4), g1:+(qs.get('g1')||1.5)};

const COMMON=`
const float YW=1.04, DROP=1.04, RW=0.112, RH=0.93, AX=0.125, BZ=0.098;
float bellF(float t){ t=clamp(t,0.,1.); return 0.65*(1.-pow(1.-t,2.2))+0.35*t; }
float gapF(float d){ return 0.12+0.88*smoothstep(0.,0.3,d); }
float bellR(float d,float gap){ return RW+(RH-RW)*bellF(d/DROP)+gap*gapF(d); }
float bellK(float d){ float t=clamp(d/DROP,0.,1.); return (RH-RW)/DROP*(0.65*2.2*pow(max(1.-t,0.),1.2)+0.35); }
float ellR(float th){ float c=cos(th), s=sin(th); return AX*BZ/sqrt(BZ*BZ*c*c+AX*AX*s*s); }
float ellF(float th,float d){ return mix(ellR(th)/RW,1.,smoothstep(0.,0.16,d)); }
vec2 rot(vec2 v,float a){ float c=cos(a),s=sin(a); return vec2(v.x*c-v.y*s, v.x*s+v.y*c); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

function bellF(t){ t=Math.min(1,Math.max(0,t)); return 0.65*(1-Math.pow(1-t,2.2))+0.35*t; }
function sstep(a,b,x){ x=Math.min(1,Math.max(0,(x-a)/(b-a))); return x*x*(3-2*x); }
function gapF(d){ return 0.12+0.88*sstep(0,0.3,d); }
function bellRj(d,gap){ return RW+(RH-RW)*bellF(d/DROP)+gap*gapF(d); }
function merid(t,gap){ if(t<=1){ const d=t*DROP; return [bellRj(d,gap), d]; } return [RH+gap+(t-1)*DROP, DROP]; }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function lin(hex){ const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.pow(v/255,2.2)); }

// green = the raised cord that outlines the motifs. The repeat is REP metres square and tiles in both directions.
// EDGE {w,h in metres}: the picture is instead a strip for a skirt's hem, N wide and h/w as high, one repeat of that pattern's own
// border. Blue then says whose each point is: 0 = no cloth (below the hem's edge), half = cloth the field shows through, full = the border's.
// PANEL {w,h,y0,r0,R,n}: the picture is instead one panel of a skirt cut in n gores, N high and w/h as wide: no repeat, the whole
// way from waist to hem. (r0, R: the radii of waist and hem; y0: how far below the panel's point the picture begins. All in metres.)

  const R=v=>'rgb('+Math.round(v*255)+',0,'+BL+')', CORD='rgb(238,255,'+BL+')', FINE='rgb(205,140,'+BL+')';
  const wrap=fn=>{ for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){ x.save(); x.translate(i*N,j*N); fn(); x.restore(); } };

  const sub=(tx,ty,a,fn)=>{ x.save(); x.translate(tx,ty); x.rotate(a); fn(); x.restore(); };
  const cord=(w)=>{ x.strokeStyle=CORD; x.lineWidth=w||.95; x.stroke(); };
  const fine=(w)=>{ x.strokeStyle=FINE; x.lineWidth=w||.42; x.stroke(); };

  const weave=(path,level,ang,gap)=>{ x.save(); path(); x.fillStyle=R(level); x.fill(); x.clip(); x.rotate(ang); x.strokeStyle=R(Math.min(1,level+.30)); x.lineWidth=.24;
    x.beginPath(); for(let t=-90;t<90;t+=gap||.85){ x.moveTo(-90,t); x.lineTo(90,t); } x.stroke(); x.restore(); };
