<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#231c3e">
  <meta name="description" content="A tiny clay world, a precious rose, and a quiet twilight sky.">
  <title>Asteroid B612</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231c3e; }
    #app { position: fixed; inset: 0; touch-action: none; background: linear-gradient(#231c3e, #786078 62%, #c69b85); }
    canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #fade { position: fixed; inset: 0; background: #231c3e; pointer-events: none; opacity: 1; transition: opacity 2.6s ease; z-index: 20; }
    body.ready #fade { opacity: 0; }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 10; background: radial-gradient(ellipse at 50% 46%, transparent 54%, rgba(16, 11, 31, .24) 100%); }
    @media (prefers-reduced-motion: reduce) { #fade { transition-duration: .5s; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <main id="app" aria-label="Asteroid B612, an interactive clay miniature"></main>
  <div id="vignette" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

    const TAU = Math.PI * 2;
    const UP = new THREE.Vector3(0, 1, 0);
    // Preserve the established layout, including the former surface's top height.
    const R = 3.8, gY = 3.71, STEM_H = 1.9;
    const CAN = { x: 0.9, z: 1.75 };
    const SCR = { x0: -1.75, x1: -1.15, z0: 0.95, z1: 1.45 };
    const Ro = 1.32, Hc = 2.1;
    const PAL = {
      sand: 0xc5ac92, earth: 0xa18779, shadow: 0x69616d,
      crimson: 0xa13d58, pink: 0xd97994, blush: 0xf1b6c4,
      green: 0x52765a, leaf: 0x719773, stone: 0x969398,
      brass: 0xbba17b, soil: 0x756052, cyan: 0xcce4e8
    };
    const clamp = THREE.MathUtils.clamp;
    const smooth = THREE.MathUtils.smoothstep;
    const lerp = THREE.MathUtils.lerp;
    const now = () => performance.now() / 1000;
    function randomSource(seed) {
      return () => { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; };
    }
    const rnd = randomSource(20240612);
    function hash(x, y, z) {
      let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
      h = Math.imul(h ^ h >>> 13, 1274126177);
      return ((h ^ h >>> 16) >>> 0) / 4294967295;
    }
    function noise(x, y, z) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = smooth(x - ix, 0, 1), fy = smooth(y - iy, 0, 1), fz = smooth(z - iz, 0, 1);
      return lerp(
        lerp(lerp(hash(ix, iy, iz), hash(ix + 1, iy, iz), fx), lerp(hash(ix, iy + 1, iz), hash(ix + 1, iy + 1, iz), fx), fy),
        lerp(lerp(hash(ix, iy, iz + 1), hash(ix + 1, iy, iz + 1), fx), lerp(hash(ix, iy + 1, iz + 1), hash(ix + 1, iy + 1, iz + 1), fx), fy), fz
      );
    }
    function fbm(x, y, z) {
      return (noise(x, y, z) + .5 * noise(x * 2.03, y * 2.03, z * 2.03) + .25 * noise(x * 4.11, y * 4.11, z * 4.11)) / 1.75;
    }
    const direction = (theta, phi) => new THREE.Vector3(Math.sin(theta) * Math.cos(phi), Math.cos(theta), Math.sin(theta) * Math.sin(phi));

    // Weld shared positions before computing normals, including sphere seams and polyhedron faces.
    function smoothGeometry(geometry) {
      geometry.deleteAttribute('normal');
      geometry.deleteAttribute('uv');
      const welded = mergeVertices(geometry, 0.00001);
      geometry.dispose();
      welded.computeVertexNormals();
      welded.computeBoundingSphere();
      welded.userData.smoothed = true;
      return welded;
    }
    function clay(color, options = {}) {
      return new THREE.MeshPhysicalMaterial({
        color, roughness: .94, metalness: 0, specularIntensity: .23,
        envMapIntensity: .38, flatShading: false, ...options
      });
    }
    function mesh(geometry, material, parent, cast = true, depth = true) {
      const object = new THREE.Mesh(geometry.userData.smoothed ? geometry : smoothGeometry(geometry), material);
      object.castShadow = cast;
      object.receiveShadow = cast;
      if (depth) object.layers.enable(1);
      parent.add(object);
      return object;
    }
    function paint(geometry, colorAt) {
      const positions = geometry.attributes.position;
      const colors = new Float32Array(positions.count * 3);
      for (let i = 0; i < positions.count; i++) {
        const color = colorAt(positions.getX(i), positions.getY(i), positions.getZ(i));
        color.toArray(colors, i * 3);
      }
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      return geometry;
    }
    function lathe(points, segments = 80, curved = false) {
      let profile = points.map(([r, y]) => new THREE.Vector2(r, y));
      if (curved) {
        const curve = new THREE.CatmullRomCurve3(points.map(([r, y]) => new THREE.Vector3(r, y, 0)));
        profile = curve.getPoints(80).map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
      }
      return new THREE.LatheGeometry(profile, segments);
    }
    const sphereGeometry = smoothGeometry(new THREE.SphereGeometry(1, 32, 24));
    function ellipsoid(parent, material, position, scale, cast = true, depth = true) {
      const object = mesh(sphereGeometry, material, parent, cast, depth);
      object.position.set(...position);
      object.scale.set(...scale);
      return object;
    }
    function rod(parent, material, a, b, radius = .016) {
      const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
      const object = mesh(new THREE.CylinderGeometry(radius, radius, start.distanceTo(end), 16), material, parent);
      object.position.copy(start).add(end).multiplyScalar(.5);
      object.quaternion.setFromUnitVectors(UP, end.sub(start).normalize());
      return object;
    }
    function tube(parent, material, points, radius = .018) {
      const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
      return mesh(new THREE.TubeGeometry(curve, 32, radius, 10, false), material, parent);
    }
    function ring(parent, material, radius, thickness, y) {
      const object = mesh(new THREE.TorusGeometry(radius, thickness, 12, 96), material, parent);
      object.rotation.x = Math.PI / 2;
      object.position.y = y;
      return object;
    }
    function glowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
      [[0, 1], [.12, .94], [.3, .38], [.62, .08], [1, 0]].forEach(([r, alpha]) => gradient.addColorStop(r, `rgba(255,255,255,${alpha})`));
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const particleTexture = glowTexture();

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x231c3e);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.tabIndex = 0;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'A rose under clear glass on Asteroid B612. Drag to orbit, scroll or pinch to zoom, double-click or press R to reset.');
    document.getElementById('app').appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x76627f, .006);
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 300);
    camera.position.set(4.6, 7.36, 6.4);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = .055;
    controls.enablePan = false;
    controls.minDistance = 4.6;
    controls.maxDistance = 24;
    controls.minPolarAngle = .3;
    controls.maxPolarAngle = 1.85;
    controls.zoomSpeed = .65;
    controls.rotateSpeed = .55;
    controls.autoRotateSpeed = .42;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let dragging = false, idleUntil = 0, tween = null;
    controls.addEventListener('start', () => { dragging = true; tween = null; });
    controls.addEventListener('end', () => { dragging = false; idleUntil = now() + 2.8; });
    function flyTo(position, target, duration) {
      tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: position.clone(), t1: target.clone(), start: now(), duration };
    }
    const tiltGroup = new THREE.Group();
    tiltGroup.rotation.set(.09, 0, .18);
    scene.add(tiltGroup);
    const spin = new THREE.Group();
    tiltGroup.add(spin);

    // A broad dusk gradient replaces the hot, nearly uniform orange background.
    const sunDir = new THREE.Vector3(-9, 2.2, 2).normalize();
    const rimDir = new THREE.Vector3(7, 3.6, -6).normalize();
    function skyMaterial() {
      return new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: {
          top: { value: new THREE.Color(0x231b43) }, middle: { value: new THREE.Color(0x79617e) },
          horizon: { value: new THREE.Color(0xd5a28a) }, bottom: { value: new THREE.Color(0x342841) },
          sun: { value: sunDir }
        },
        vertexShader: `varying vec3 worldPosition;
          void main(){ vec4 world = modelMatrix * vec4(position, 1.0); worldPosition = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world; }`,
        fragmentShader: `varying vec3 worldPosition; uniform vec3 top, middle, horizon, bottom, sun;
          void main(){
            vec3 d = normalize(worldPosition - cameraPosition);
            float t = smoothstep(-0.56, 0.13, d.y);
            vec3 color = mix(horizon, middle, smoothstep(0.0, 0.65, t));
            color = mix(color, top, smoothstep(0.32, 1.0, t));
            color = mix(bottom, color, smoothstep(-0.96, -0.58, d.y));
            color += vec3(0.16, 0.09, 0.045) * pow(max(dot(d, sun), 0.0), 10.0);
            gl_FragColor = vec4(color, 1.0);
          }`
      });
    }
    const sky = mesh(new THREE.SphereGeometry(140, 48, 32), skyMaterial(), scene, false, false);
    sky.renderOrder = -100;
    sky.frustumCulled = false;
    {
      const environment = new THREE.Scene();
      mesh(new THREE.SphereGeometry(140, 32, 20), skyMaterial(), environment, false, false);
      const panel = (width, height, color, intensity, direction) => {
        const object = mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshBasicMaterial({
          color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide
        }), environment, false, false);
        object.position.copy(direction).multiplyScalar(55);
        object.lookAt(0, 0, 0);
      };
      panel(12, 30, 0xffead5, 2.2, sunDir);
      panel(14, 26, 0xc1d7f1, 1.4, rimDir);
      panel(34, 20, 0xe5deeb, .6, new THREE.Vector3(.1, 1, .2).normalize());
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(environment, .025, .1, 300).texture;
      pmrem.dispose();
      environment.traverse(object => { if (object.isMesh) { object.geometry.dispose(); object.material.dispose(); } });
    }
    const keyLight = new THREE.DirectionalLight(0xffdfc3, 2.65);
    keyLight.position.copy(sunDir).multiplyScalar(14);
    keyLight.target.position.set(0, 2, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    Object.assign(keyLight.shadow.camera, { left: -6.4, right: 6.4, top: 6.4, bottom: -6.4, near: 2, far: 32 });
    keyLight.shadow.camera.updateProjectionMatrix();
    keyLight.shadow.bias = -.0002;
    keyLight.shadow.normalBias = .018;
    scene.add(keyLight, keyLight.target);
    const rim = new THREE.DirectionalLight(0xb2c7ed, 1.1);
    rim.position.copy(rimDir).multiplyScalar(14);
    scene.add(rim);
    const camFill = new THREE.DirectionalLight(0xe0d9e7, .55);
    const backRim = new THREE.DirectionalLight(0xc5d8ef, .95);
    scene.add(camFill, backRim, new THREE.AmbientLight(0xb0a8c4, .18), new THREE.HemisphereLight(0xc6c7dd, 0x766354, .85));

    // Soft particles still enter the opaque transmission capture, so glass can refract the stars.
    const starPositions = [], starColors = [], starSizes = [], starPhases = [];
    const color = new THREE.Color();
    for (let i = 0; i < 1400; i++) {
      const theta = rnd() * TAU, phi = Math.acos(2 * rnd() - 1), radius = 68 + rnd() * 10;
      starPositions.push(radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
      const size = .1 + Math.pow(rnd(), 4) * .36, choice = rnd();
      color.set(choice < .6 ? 0xf5efff : choice < .82 ? 0xffe6c4 : 0xc9dffc).multiplyScalar(.65 + rnd() * .9);
      starColors.push(color.r, color.g, color.b);
      starSizes.push(size);
      starPhases.push(i * 2.39996);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
    starGeometry.setAttribute('size', new THREE.Float32BufferAttribute(starSizes, 1));
    starGeometry.setAttribute('phase', new THREE.Float32BufferAttribute(starPhases, 1));
    const starMaterial = new THREE.ShaderMaterial({
      transparent: false, blending: THREE.AdditiveBlending, depthWrite: false,
      uniforms: { time: { value: 0 }, pixelHeight: { value: innerHeight * renderer.getPixelRatio() } },
      vertexShader: `attribute vec3 color; attribute float size, phase; uniform float time, pixelHeight;
        varying vec3 starColor; varying float brightness;
        void main(){ vec4 view = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * view;
          gl_PointSize = clamp(size * pixelHeight * projectionMatrix[1][1] * 0.5 / max(0.1, -view.z), 1.0, 20.0);
          starColor = color; brightness = 0.76 + 0.24 * sin(time * 0.55 + phase); }`,
      fragmentShader: `varying vec3 starColor; varying float brightness;
        void main(){ float r = length(gl_PointCoord - 0.5) * 2.0;
          if(r > 1.0) discard;
          float glow = exp(-r * r * 6.0) * (1.0 - smoothstep(0.7, 1.0, r));
          gl_FragColor = vec4(starColor * brightness * 1.65, glow); }`
    });
    const starfield = new THREE.Points(starGeometry, starMaterial);
    starfield.renderOrder = -90;
    scene.add(starfield);
    const moon = mesh(new THREE.SphereGeometry(6.4, 48, 32), clay(0xa5a0b4, { fog: false, envMapIntensity: .14 }), scene, false, false);
    moon.position.set(-.5, -.25, -.83).normalize().multiplyScalar(80);

    // Continuous sphere displacement and smooth color variation give the planet a sculpted clay surface.
    const craters = [[1.6, 3, .5, .2], [1.95, 5.5, .45, .2], [1.5, 5, .34, .15], [2.2, 1, .5, .22],
      [1.5, .95, .38, .16], [2.5, 4, .6, .25], [1.35, 3, .3, .12], [2.05, 2.6, .4, .18]]
      .map(([theta, phi, radius, depth]) => ({ direction: direction(theta, phi), radius, depth }));
    function terrainPoint(unit, output) {
      let radius = R + (fbm(unit.x * 2 + 11, unit.y * 2, unit.z * 2 + 5) - .5) * .19;
      for (const crater of craters) {
        const distance = Math.acos(clamp(unit.dot(crater.direction), -1, 1)) * R / crater.radius;
        if (distance < 1.6) radius += crater.depth * (.15 * Math.exp(-Math.pow((distance - 1) * 5, 2)) - .65 * Math.exp(-distance * distance * 2.8));
      }
      output.copy(unit).multiplyScalar(radius);
      if (output.y > 0) {
        const garden = 1 - smooth(Math.hypot(output.x, output.z), 2.3, 3.4);
        output.y = lerp(output.y, gY + .006 * Math.sin(output.x * 2) * Math.sin(output.z * 2), garden);
      }
      return output;
    }
    const planetGeometry = new THREE.SphereGeometry(1, 128, 88);
    const pp = planetGeometry.attributes.position, unit = new THREE.Vector3(), point = new THREE.Vector3();
    for (let i = 0; i < pp.count; i++) {
      unit.fromBufferAttribute(pp, i).normalize();
      terrainPoint(unit, point);
      pp.setXYZ(i, point.x, point.y, point.z);
    }
    const sand = new THREE.Color(PAL.sand), earth = new THREE.Color(PAL.earth), shadeColor = new THREE.Color(PAL.shadow);
    paint(planetGeometry, (x, y, z) => {
      const amount = fbm(x * .7 + 3, y * .7, z * .7);
      color.copy(sand).lerp(earth, amount * .68).lerp(shadeColor, (1 - smooth(y, -3.8, .5)) * .3);
      const contact = y > 3.3 ? Math.exp(-Math.pow((Math.hypot(x, z) - 1.48) / .23, 2)) : 0;
      return color.multiplyScalar(1 - contact * .14);
    });
    mesh(planetGeometry, clay(0xffffff, { vertexColors: true, roughness: 1, envMapIntensity: .25 }), spin);

    const brassMaterial = clay(PAL.brass, { metalness: .64, roughness: .49, envMapIntensity: .65 });
    const soilMaterial = clay(PAL.soil);
    const leafMaterial = clay(PAL.leaf, { roughness: .88 });
    const stemMaterial = clay(PAL.green, { roughness: .9 });
    const stoneMaterial = clay(PAL.stone);
    const volcanoes = [
      { d: direction(1.12, 1.95), radius: .95, height: 1.05, crater: .27, depth: .32, active: true },
      { d: direction(1.28, .25), radius: .8, height: .8, crater: .24, depth: .24 },
      { d: direction(1.22, 4.05), radius: .66, height: .62, crater: .19, depth: .2 }
    ];
    let emberMaterial, smokeBase;
    for (const volcano of volcanoes) {
      const group = new THREE.Group();
      group.position.copy(volcano.d).multiplyScalar(R - .055);
      group.quaternion.setFromUnitVectors(UP, volcano.d);
      spin.add(group);
      const r = volcano.radius, c = volcano.crater;
      const h = volcano.height * Math.pow(1 - c / r, 1.25);
      const geometry = lathe([[0, -.1], [r * .8, -.1], [r, -.04], [r * .9, .035], [r * .7, h * .25],
        [r * .49, h * .65], [c * 1.2, h * .97], [c, h], [c * .84, h * .92], [c * .72, h - volcano.depth], [0, h - volcano.depth - .025]], 64, true);
      const base = new THREE.Color(volcano.active ? 0x71616a : 0x97949e), light = new THREE.Color(volcano.active ? 0x93817e : 0xb8b3b7);
      paint(geometry, (x, y, z) => {
        color.copy(base).lerp(light, smooth(y, 0, h) * .38);
        const cavity = (1 - smooth(Math.hypot(x, z), c * .7, c * 1.1)) * smooth(y, .02, h - .06);
        return color.multiplyScalar(1 - cavity * .48);
      });
      mesh(geometry, clay(0xffffff, { vertexColors: true }), group);
      if (volcano.active) {
        emberMaterial = clay(0xa86742, { emissive: 0xff9656, emissiveIntensity: .65, roughness: .78 });
        ellipsoid(group, emberMaterial, [0, h - volcano.depth + .022, 0], [c * .7, .035, c * .7], false);
        smokeBase = volcano.d.clone().multiplyScalar(R + h - volcano.depth * .5);
      }
    }
    function rockGeometry(seed, detail = 2) {
      const geometry = new THREE.IcosahedronGeometry(1, detail);
      const positions = geometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        point.fromBufferAttribute(positions, i);
        const radius = .92 + .14 * noise(point.x * 2 + seed, point.y * 2, point.z * 2 + seed);
        positions.setXYZ(i, point.x * radius, point.y * radius * .82, point.z * radius * .91);
      }
      return smoothGeometry(geometry);
    }
    const surfaceRocks = [], scatterRandom = randomSource(61209);
    for (let i = 0; i < 160 && surfaceRocks.length < 15; i++) {
      const d = direction(.8 + scatterRandom() * 1.7, scatterRandom() * TAU);
      if (volcanoes.some(v => v.d.angleTo(d) * R < v.radius + .55) || surfaceRocks.some(v => v.angleTo(d) * R < .8)) continue;
      surfaceRocks.push(d);
      const stone = mesh(rockGeometry(i), stoneMaterial, spin);
      terrainPoint(d, stone.position).addScaledVector(d, .025);
      stone.quaternion.setFromUnitVectors(UP, d);
      stone.scale.setScalar(.14 + scatterRandom() * .2);
    }

    const platform = new THREE.Group();
    platform.position.y = gY;
    spin.add(platform);
    mesh(lathe([[0, -.025], [1.4, -.025], [1.49, 0], [1.52, .06], [1.49, .12], [1.4, .16], [0, .16]], 96, true), brassMaterial, platform);
    ellipsoid(platform, soilMaterial, [0, .14, 0], [1.265, .055, 1.265]);
    ring(platform, brassMaterial, 1.355, .037, .205);
    ring(platform, brassMaterial, 1.47, .018, .07);

    // A gently curved cylinder, two smooth leaves, and exactly four small thorns.
    function stemXZ(y) {
      const h = clamp((y - gY) / STEM_H, 0, 1);
      return [.075 * Math.sin(h * 3.1) * (1 - h), .05 * Math.sin(h * 2.4 + 1) * (1 - h)];
    }
    const stemGeometry = new THREE.CylinderGeometry(.031, .043, STEM_H, 20, 24);
    const stemPositions = stemGeometry.attributes.position;
    for (let i = 0; i < stemPositions.count; i++) {
      const y = stemPositions.getY(i) + STEM_H * .5 + gY;
      const [x, z] = stemXZ(y);
      stemPositions.setXYZ(i, stemPositions.getX(i) + x, y, stemPositions.getZ(i) + z);
    }
    mesh(stemGeometry, stemMaterial, spin);
    function leafGeometry(length = .62, width = .15) {
      const geometry = new THREE.SphereGeometry(1, 28, 20);
      const p = geometry.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i), z = p.getZ(i), u = (y + 1) * .5;

        dummy.updateMatrix();
        beltMesh.setMatrixAt(i, dummy.matrix);
      }
      beltMesh.instanceMatrix.needsUpdate = true;
      for (const f of floaters) {
        const a = f.angle + t * f.speed;
        f.rock.position.set(Math.cos(a) * f.radius, f.y + Math.sin(t * f.frequency + f.phase) * f.bob, Math.sin(a) * f.radius);
        f.rock.rotation.set(t * f.rx, t * f.ry, t * f.rz);
      }
      for (let i = 0; i < DUST; i++) {
        const d = dustData[i], a = d.angle + t * d.speed;
        dustPositions[i * 3] = Math.cos(a) * d.radius;
        dustPositions[i * 3 + 1] = d.y + Math.sin(t * .3 + d.phase) * .4;
        dustPositions[i * 3 + 2] = Math.sin(a) * d.radius;
      }
      dustGeometry.attributes.position.needsUpdate = true;
      bloom.localToWorld(focus.set(0, .4, 0));
      focus.applyMatrix4(camera.matrixWorldInverse);
      bokeh.uniforms.focus.value = Math.max(.1, -focus.z);
      composer.render();
      if (firstFrame) {
        firstFrame = false;
        document.body.classList.add('ready');
        setTimeout(() => document.getElementById('fade')?.remove(), 2800);
      }
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      const ratio = Math.min(devicePixelRatio || 1, 2);
      renderer.setPixelRatio(ratio);
      renderer.setSize(innerWidth, innerHeight);
      composer.setPixelRatio(ratio);
      composer.setSize(innerWidth, innerHeight);
      starMaterial.uniforms.pixelHeight.value = innerHeight * ratio;
    });
    tick();
  </script>
</body>
</html>
