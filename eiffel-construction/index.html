<style>

#ctrl{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(#201b17,#161210);padding:5px 8px 6px}

#tlhand{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffd79a;box-shadow:0 0 6px rgba(255,190,110,.9);pointer-events:none}

<script type="module" id="app">
/* ============================================================================
   1887–1889 · LA TOUR EIFFEL — 14 秒建造过程
   Three.js + GLSL · 单文件 · 全部由时间 t (0..14s) 驱动，可任意顺序重放
   window.renderAt(t)  ——  第 n 帧调用 renderAt(n/30), n = 0..419
   ========================================================================== */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------- 0. 常量 ------------------------------- */
const CAPTURE = /[?&]capture\b/.test(location.search);
const DUR = 14, FPS = 30, FRAMES = 420;
const V3 = THREE.Vector3;

/* --------------------------- 1. 数学 / 随机 --------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const sstep = (e0, e1, x) => sm(clamp((x - e0) / (e1 - e0), 0, 1));
const sat = v => clamp(v, 0, 1);
function h32(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function rnd(s, k) { return h32((Math.imul(s | 0, 374761393) ^ Math.imul(((k | 0) + 1), 668265263)) | 0); }
function vr(s, k, a, b) { return a + rnd(s, k) * (b - a); }
function vn2(x, z, s) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const A = xi * 73856093 ^ zi * 19349663 ^ (s * 83492791), B = (xi + 1) * 73856093 ^ zi * 19349663 ^ (s * 83492791);
  const C = xi * 73856093 ^ (zi + 1) * 19349663 ^ (s * 83492791), D = (xi + 1) * 73856093 ^ (zi + 1) * 19349663 ^ (s * 83492791);
  return lerp(lerp(h32(A), h32(B), u), lerp(h32(C), h32(D), u), v);
}
function tri(u) { u = u - Math.floor(u); return u < .5 ? u * 2 : 2 - u * 2; }
function shade(hex, f) { const c = new THREE.Color(hex); c.r = sat(c.r * f); c.g = sat(c.g * f); c.b = sat(c.b * f); return c.getHex(); }

/* ------------------------- 2. 渲染器 / 场景 ------------------------- */
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 由 OutputPass 统一执行
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcbb494, 155, 330);

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 700);
cam.position.set(0, 20, 120); cam.lookAt(0, 10, 0);
scene.add(cam);

/* --- 暖色傍晚主光 + 偏冷补光 + 柔和阴影 --- */
const sun = new THREE.DirectionalLight(0xffd7a4, 3.05);
sun.position.set(34, 42, 82); sun.target.position.set(0, 12, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 260;
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42;
sun.shadow.camera.top = 46; sun.shadow.camera.bottom = -46;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.035; sun.shadow.radius = 2.6;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0x9dbbe4, 0.72); fill.position.set(-70, 34, -40); scene.add(fill);
scene.add(new THREE.HemisphereLight(0xbcd2e6, 0x6d5b44, 0.62));

/* --- 天空穹顶（暖霞 + 太阳光晕，亮部交给 Bloom） --- */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(260, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vP;
    void main(){
      vec3 d=normalize(vP); float h=d.y;
      vec3 hor=vec3(1.35,0.86,0.50), mid=vec3(0.66,0.62,0.62), top=vec3(0.28,0.38,0.54);
      vec3 c=mix(hor,mid,smoothstep(-0.02,0.26,h));
      c=mix(c,top,smoothstep(0.20,0.75,h));
      c=mix(vec3(0.50,0.42,0.37),c,smoothstep(-0.45,-0.02,h));
      vec3 sd=normalize(vec3(0.34,0.42,0.85));
      float g=pow(max(dot(d,sd),0.0),26.0);
      c+=vec3(1.9,1.25,0.72)*g*0.95;
      c+=vec3(1.1,0.8,0.5)*pow(max(dot(d,sd),0.0),4.0)*0.10;
      gl_FragColor=vec4(c,1.0);
    }`
})));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.62, 0.85, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------------------- 3. 几何 / 材质 / 批处理 ---------------------- */
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  round: new RoundedBoxGeometry(1, 1, 1, 1, 0.17),   // 轻微圆角：石块 / 建筑
  soft: new RoundedBoxGeometry(1, 1, 1, 1, 0.42)     // 人物体块
};
const M = {
  vox: new THREE.MeshStandardMaterial({ roughness: 0.86, metalness: 0.02 }),
  iron: new THREE.MeshStandardMaterial({ roughness: 0.48, metalness: 0.62 }),
  wood: new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.0 }),
  rod: new THREE.MeshStandardMaterial({ color: 0x241d19, roughness: 0.8, metalness: 0.2 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0x120c06, emissive: 0xffc877, emissiveIntensity: 2.6, roughness: .5 })
};
const _m4 = new THREE.Matrix4(), _m4b = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(),
      _v1 = new V3(), _v2 = new V3(), _v3 = new V3(), _v4 = new V3(), _c1 = new THREE.Color();
const ZM = new THREE.Matrix4().makeScale(0, 0, 0);

const BATCH = {};
function batch(name, geo, mat, opt) {
  const b = { geo, mat, items: [], cast: !(opt && opt.cast === false), rec: true };
  BATCH[name] = b; return b;
}
function vox(b, x, y, z, sx, sy, sz, c, ry, rx, rz) { b.items.push([x, y, z, sx, sy, sz, c, ry || 0, rx || 0, rz || 0]); }
function bake(b) {
  const m = new THREE.InstancedMesh(b.geo, b.mat, Math.max(1, b.items.length));
  m.frustumCulled = false; m.castShadow = b.cast; m.receiveShadow = b.rec;
  for (let i = 0; i < b.items.length; i++) {
    const it = b.items[i];
    _e.set(it[8], it[7], it[9]); _q.setFromEuler(_e);
    _m4.compose(_v1.set(it[0], it[1], it[2]), _q, _v2.set(it[3], it[4], it[5]));
    m.setMatrixAt(i, _m4);
    m.setColorAt(i, _c1.setHex(it[6]).convertSRGBToLinear());
  }
  m.count = b.items.length;
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.computeBoundingSphere && m.computeBoundingSphere();
  scene.add(m); return m;
}
/* 可按时序出现 / 消失的体素（土方、脚手架、回填） */
class Timed {
  constructor(geo, mat, cap, cast) {
    this.list = [];
    this.mesh = new THREE.InstancedMesh(geo, mat, cap);
    this.mesh.frustumCulled = false; this.mesh.castShadow = !!cast; this.mesh.receiveShadow = true;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    for (let i = 0; i < cap; i++) this.mesh.setColorAt(i, _c1.setHex(0xffffff).convertSRGBToLinear());
    this.cap = cap; scene.add(this.mesh);
  }
  add(x, y, z, sx, sy, sz, c, t0, t1, pop, ry) {
    if (this.list.length >= this.cap) return;
    const i = this.list.length; this.list.push(1);
    this.mesh.setColorAt(i, _c1.setHex(c).convertSRGBToLinear());
    this.mesh.instanceColor.needsUpdate = true;
    this.list[i] = [x, y, z, sx, sy, sz, ry || 0, t0, t1 === undefined ? 1e9 : t1, pop || 0.25];
  }
  update(t) {
    let n = 0;
    for (let i = 0; i < this.list.length; i++) {
      const o = this.list[i], vis = t >= o[7] && t < o[8];
      if (!vis) { this.mesh.setMatrixAt(n++, ZM); continue; }
      let k = 1;
      if (o[9] > 0) k = sstep(o[7], o[7] + o[9], t) * (1 - sstep(o[8] - o[9], o[8], t));
      _e.set(0, o[6], 0); _q.setFromEuler(_e);
      _m4.compose(_v1.set(o[0], o[1], o[2]), _q, _v2.set(o[3] * k, o[4] * k, o[5] * k));
      this.mesh.setMatrixAt(n++, _m4);
    }
    this.mesh.count = n; this.mesh.instanceMatrix.needsUpdate = true;
  }
}

/* ---------------- 4. 世界坐标常量：浮岛 / 塞纳河 / 铁塔 ---------------- */
const RIV = {
  c: x => -11 + 4.6 * Math.sin(x * 0.055 + 0.6) + 1.9 * Math.sin(x * 0.13 + 1.9),
  h: x => 4.2 + 1.1 * Math.sin(x * 0.09 + 2.3)
};
const WX0 = -30, WX1 = 30, WZ0 = -24, WZ1 = 26;
const GRADE = 4.0, WATER = 2.6;
const C = { x: 0, z: 7 };
const TOWER = { y1: 10, y2: 17.5, y3: 29, top: 36.6, d: y => 0.5 + 5.9 * Math.pow(Math.max(0, 1 - y / 36.6), 1.5) };
/* 腿按方位顺时针排列，相邻两条共一个立面（拱肋 / 环梁连接相邻腿） */
const LEGDIR = [{ x: 1, z: 1 }, { x: -1, z: 1 }, { x: -1, z: -1 }, { x: 1, z: -1 }];
const PITS = LEGDIR.map(s => ({ x: C.x + s.x * TOWER.d(GRADE), z: C.z + s.z * TOWER.d(GRADE), r: 2.4, s }));
const IRONC = [0x8d4026, 0x7c371f, 0x9a4a2b, 0x6e311d];
const ironCol = s => IRONC[Math.floor(rnd(s, 3) * IRONC.length) % IRONC.length];
const WOODC = [0x8a6a44, 0x74573a, 0x9d7c50];

const STAGES = [
  { a: 0.00, b: 3.05, n: '开挖与地基' },
  { a: 3.05, b: 6.20, n: '四条弯曲塔腿' },
  { a: 5.90, b: 8.70, n: '拱肋与第一平台' },
  { a: 8.40, b: 10.70, n: '第二平台' },
  { a: 10.35, b: 12.55, n: '上部铁架' },
  { a: 11.95, b: 14.00, n: '塔尖合拢' }
];

const codeEl = document.getElementById('code'), pSub = document.getElementById('p-sub');
let codeMode = 'stage', curStage = -1, lastPhase = -1, rows = [], tagRows = [];
function buildCode() {
  codeEl.innerHTML = ''; rows = []; tagRows = [];
  let lines;
  if (codeMode === 'full') lines = document.getElementById('app').textContent.split('\n').map(s => ({ c: s }));
  else lines = SRC[curStage < 0 ? 0 : curStage].l;
  lines.forEach((ln, i) => {
    const d = document.createElement('div');
    d.className = 'cl' + (ln.c.trim().startsWith('//') || ln.c.trim().startsWith('/*') ? ' k' : '');
    const n = document.createElement('span'); n.className = 'ln'; n.textContent = i + 1;
    const t = document.createElement('span'); t.className = 'tx'; t.textContent = ln.c.length ? ln.c : ' ';
    d.appendChild(n); d.appendChild(t);
    if (ln.a) { d.classList.add('tag'); d.dataset.a = ln.a; d.dataset.j = ln.j; d.addEventListener('dblclick', () => { seek(ln.j); toast('跳到 ' + ln.j.toFixed(2) + 's · ' + ({ lift: '起吊', align: '对位', seat: '落座' })[ln.a]); }); }
    codeEl.appendChild(d); rows.push(d);
    if (ln.a) tagRows.push(d);
  });
  pSub.textContent = codeMode === 'full' ? '完整场景源码 (' + lines.length + ' 行)' : SRC[curStage < 0 ? 0 : curStage].t;
}
function updateCodeHl(t) {
  if (codeMode !== 'stage' || curStage < 0) return;
  const st = STAGES[curStage];
  let focus = null;
  for (const p of SCHED[curStage]) {
    if (t >= p.tStart && t < p.tEnd) { if (!focus || p.tStart > focus.tStart) focus = p; }
  }
  if (!focus) { for (const p of SCHED[curStage]) if (p.tStart > t && (!focus || p.tStart < focus.tStart)) focus = p; }
  if (!focus) focus = SCHED[curStage][SCHED[curStage].length - 1];
  const ph = focus ? (t < focus.tStart ? 'lift' : (focus.phase <= 0 ? 'lift' : focus.phase === 1 ? 'align' : 'seat')) : 'lift';
  if (ph === lastPhase && Math.abs(t - (updateCodeHl.t || 0)) < .001) return;
  updateCodeHl.t = t; lastPhase = ph;
  let best = null, bd = 1e9;
  for (const r of tagRows) {
    const a = r.dataset.a;
    r.classList.toggle('a-lift', a === 'lift' && ph === 'lift');
    r.classList.toggle('a-align', a === 'align' && ph === 'align');
    r.classList.toggle('a-seat', a === 'seat' && ph === 'seat');
    const d = Math.abs(t - parseFloat(r.dataset.j));
    if (ph === a && d < bd) { bd = d; best = r; }
  }
  rows.forEach(r => r.classList.remove('cur'));
  if (best) {
    best.classList.add('cur');
    const bo = best.offsetTop, sc = codeEl.scrollTop, hh = codeEl.clientHeight;
    if (bo < sc + 24 || bo > sc + hh - 40) codeEl.scrollTop = bo - hh * .35;
  }
}

};
