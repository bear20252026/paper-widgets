<!DOCTYPE html>

<title>Dusk Patrol (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  /* one visual world: last light over lake country. Full-bleed pixel stage, a single quiet strip of controls. */
  --ink: #1b1326;
  --dusk: #2c2244;
  --gold: #ffd884;
  --cream: #fff3dc;
  --ember: #e4502e;
  --teal: #48b2aa;
  --display: 'Pixelify Sans', 'IBM Plex Mono', ui-monospace, monospace;
  --body: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--cream); overflow: hidden; }
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(#4868a8, #7c8cbc 34%, #be96ac 58%, #eea486 78%, #ffe2a0); }
#stage canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; opacity: 0; transition: opacity .9s ease; }
#ui { pointer-events: none; }
body.ready #stage canvas { opacity: 1; }

.corner { clip-path: polygon(4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px), 0 4px, 2px 4px, 2px 2px, 4px 2px); }

.hints { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .35em .9em;
  max-width: calc(100% - 32px); padding: .55em 1.1em; background: rgba(27, 19, 38, .80);
  font: 500 12.5px/1.3 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--cream);
  opacity: 0; transition: opacity .6s ease .3s; }
body.ready .hints { opacity: 1; }
body.ready .hints.fade { opacity: 0; transition-delay: 0s; pointer-events: none; }
.hints.at-bottom { bottom: 16px; }
.hints.at-top { top: 16px; }
.hints i { font-style: normal; opacity: .4; }
.hint { display: inline-flex; gap: .55em; white-space: nowrap; }
.hint b { font-weight: 500; color: var(--gold); }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips em { width: 4px; height: 10px; background: rgba(255, 243, 220, .22); }
.pips em.on { background: var(--ember); }
button.hint { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; border-bottom: 1px dashed rgba(255, 216, 132, .55); }
button.hint:hover b, button.hint:hover span { color: #fff; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.chip { position: absolute; top: 16px; right: 16px; font: 500 11.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase;
  color: var(--cream); background: rgba(27, 19, 38, .80); border: 0; padding: .75em 1em; cursor: pointer; opacity: 0; transition: opacity .6s ease .3s; }
body.ready .chip { opacity: 1; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.pad { position: absolute; bottom: 18px; display: none; font: 500 14px/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: var(--gold); border: 0; padding: 1.1em 1.2em; min-width: 7.5em; touch-action: none; cursor: pointer; }
#btn-view { left: 16px; }
#btn-boost { right: 16px; background: var(--ember); color: var(--cream); }
#btn-fire { right: 16px; bottom: 84px; background: var(--cream); }
body.touch .pad { display: block; }
body.touch .hints.at-bottom { bottom: auto; top: 56px; }

#title { position: absolute; left: 0; right: 0; top: 13%; text-align: center; pointer-events: none; transition: opacity 1.4s ease, transform 1.4s ease; }
#title.gone { opacity: 0; transform: translateY(-10px); }
#title h1 { margin: 0; font: 700 clamp(38px, 8.2vw, 104px)/.9 var(--display); letter-spacing: .02em; color: var(--cream); text-wrap: balance;
  text-shadow: 0 .055em 0 var(--ember), 0 .11em 0 var(--ink); }
#title p { margin: 1.4em 0 0; font: 500 clamp(11px, 1.25vw, 14px)/1.4 var(--body); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
#title p span { display: inline-block; background: var(--gold); padding: .35em .9em .35em 1.2em; }

#boot { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: min(260px, 60vw); text-align: center; transition: opacity .6s ease; }
#boot.done { opacity: 0; pointer-events: none; }
#boot-track { height: 8px; background: rgba(27, 19, 38, .55); }
#boot-bar { height: 100%; background: var(--cream); transform-origin: left center; transform: scaleX(0); }
#boot-msg { margin: .9em 0 0; font: 500 12px/1.4 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
#boot.fail #boot-track { display: none; }
#boot.fail #boot-msg { background: var(--ink); color: var(--cream); padding: 1em; letter-spacing: .04em; text-transform: none; }

@media (max-width: 560px) { .hints { font-size: 11px; letter-spacing: .06em; } #title p { font-size: 10px; letter-spacing: .14em; } #title p span { padding: .35em .7em .35em .85em; } }
@media (max-width: 760px) { .hints.at-top { top: 56px; } }
@media (prefers-reduced-motion: reduce) { #stage canvas, #title, .hints, .chip, #boot { transition: none; } }
</style>

<body>
<main id="stage">
  <canvas id="gl" aria-label="A fighter jet flying over lake country at dusk"></canvas>
  <canvas id="ui" aria-hidden="true"></canvas>
  <header id="title">
    <h1>Dusk Patrol</h1>
    <p><span>fighter jet · lake country · last light</span></p>
  </header>
  <div id="boot" role="status">
    <div id="boot-track"><div id="boot-bar"></div></div>
    <p id="boot-msg">Spooling up the engines</p>
  </div>
  <nav id="hints" class="hints corner at-bottom" aria-label="Controls"></nav>
  <button type="button" id="btn-sound" class="chip corner" aria-pressed="false">Sound: off</button>
  <button type="button" id="btn-view" class="pad corner">Chase view</button>
  <button type="button" id="btn-boost" class="pad corner">Afterburner</button>
  <button type="button" id="btn-fire" class="pad corner">Missile · 4</button>
</main>
<script id="world-src">
// ───────────────────────── world generation ─────────────────────────
// Seamlessly tiling height field, baked low-sun shadows and a cloud map.
// Runs on the CPU so the flight model, the terrain scope and the renderer
// all read the same land.

const WORLD = {
  N: 2048,          // height texels per side
  CELL: 5,          // world units per texel
  L: 2048 * 5,      // tile size in world units
  HMIN: -96, HSPAN: 512,   // height encoding range
  CN: 512,          // cloud map texels per side
  // horizontal direction the sunlight travels (x east, z south): from north-west
  E1: [0.7474, 0.6644],
  SUN_TAN: Math.tan(27 * Math.PI / 180),
};
WORLD.LC = WORLD.L / 2;                      // cloud tile, commensurate with the land tile
WORLD.E2 = [-WORLD.E1[1], WORLD.E1[0]];

function hash2i(ix, iy, s) {
  let h = Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ s;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}

const GX = new Float32Array(16), GY = new Float32Array(16);
for (let i = 0; i < 16; i++) { GX[i] = Math.cos(i / 16 * Math.PI * 2); GY[i] = Math.sin(i / 16 * Math.PI * 2); }

// periodic gradient noise, x,y in lattice units, period P (integer)
function pnoise(x, y, P, s) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const xa = ((x0 % P) + P) % P, ya = ((y0 % P) + P) % P;
  const xb = xa + 1 === P ? 0 : xa + 1, yb = ya + 1 === P ? 0 : ya + 1;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const g00 = hash2i(xa, ya, s) & 15, g10 = hash2i(xb, ya, s) & 15;
  const g01 = hash2i(xa, yb, s) & 15, g11 = hash2i(xb, yb, s) & 15;
  const n00 = GX[g00] * fx + GY[g00] * fy;
  const n10 = GX[g10] * (fx - 1) + GY[g10] * fy;
  const n01 = GX[g01] * fx + GY[g01] * (fy - 1);
  const n11 = GX[g11] * (fx - 1) + GY[g11] * (fy - 1);
  const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
  return (a + (b - a) * v) * 1.5;
}

function fbm(u, v, P, oct, gain, s) {
  let a = 1, sum = 0, norm = 0;
  for (let o = 0; o < oct; o++) {
    sum += a * pnoise(u * P, v * P, P, s + o * 131);
    norm += a; a *= gain; P *= 2;
  }
  return sum / norm;
}

function ridged(u, v, P, oct, s) {
  let a = 1, sum = 0, norm = 0, w = 1;
  for (let o = 0; o < oct; o++) {
    let n = 1 - Math.abs(pnoise(u * P, v * P, P, s + o * 71));
    n *= n; n *= w; w = Math.min(1, Math.max(0, n * 1.6));
    sum += a * n; norm += a; a *= 0.5; P *= 2;
  }
  return sum / norm;
}

// periodic cellular noise: 1 at feature points, falling to 0 between them
function worley(u, v, P, s) {
  const x = u * P, y = v * P, x0 = Math.floor(x), y0 = Math.floor(y);
  let best = 9;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = x0 + i, cy = y0 + j;
    const h = hash2i(((cx % P) + P) % P, ((cy % P) + P) % P, s);
    const px = cx + (h & 1023) / 1023, py = cy + ((h >>> 10) & 1023) / 1023;
    const d = (px - x) * (px - x) + (py - y) * (py - y);
    if (d < best) best = d;
  }
  return Math.max(0, 1 - Math.sqrt(best));
}

const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function heightAtUV(u, v) {
  const wx = fbm(u, v, 3, 3, 0.5, 11), wy = fbm(u, v, 3, 3, 0.5, 47);
  const uu = u + 0.045 * wx, vv = v + 0.045 * wy;
  const c = fbm(uu, vv, 6, 8, 0.52, 901);                   // continents, lakes and islands
  const m = sstep(-0.30, 0.16, fbm(uu + 0.37, vv + 0.11, 3, 3, 0.5, 333)); // where the ranges are
  const r = ridged(uu, vv, 12, 5, 5150);
  let h = (c + 0.035) * 185;
  if (h > 0) {
    const inland = sstep(4, 55, h);
    h += inland * m * (r * r * 225 + r * 48);
    h += inland * (1 - m) * r * 32;
    if (h < 9) h = 9 * Math.pow(h / 9, 1.7);                 // flatten the beaches
  } else {
    h *= 0.9;
  }
  return h;
}

// rows j0..j1 of the height field and the biome noise
function genBand(j0, j1) {
  const N = WORLD.N, h = new Float32Array((j1 - j0) * N), b = new Uint8Array((j1 - j0) * N);
  for (let j = j0; j < j1; j++) {
    const v = j / N, o = (j - j0) * N;
    for (let i = 0; i < N; i++) {
      const u = i / N;
      h[o + i] = heightAtUV(u, v);
      const q = fbm(u, v, 28, 3, 0.55, 7007) * 0.5 + 0.5;
      b[o + i] = Math.max(0, Math.min(255, Math.round(q * 255)));
    }
  }
  return { h, b };
}

// pack height (16 bit in R,G), baked low-sun shadow (B) and biome (A)
function bakeTex(height, biome) {
  const { N, CELL } = WORLD, tex = new Uint8Array(N * N * 4);
  const drop = WORLD.SUN_TAN * CELL, soft = 7;
  for (let j = 0; j < N; j++) {
    let sh = -1e9;
    const o = j * N;
    for (let k = 0; k < 2 * N; k++) {               // sweep along +u, the way the light travels
      const i = k >= N ? k - N : k;
      const s = Math.max(height[o + i], 0);
      sh = Math.max(sh - drop, s);
      if (k >= N) tex[(o + i) * 4 + 2] = Math.round(Math.min(1, (sh - s) / soft) * 255);
    }
  }
  for (let k = 0; k < N * N; k++) {
    let q = (height[k] - WORLD.HMIN) / WORLD.HSPAN;
    q = Math.max(0, Math.min(65535, Math.round(q * 65535)));
    tex[k * 4] = q >> 8; tex[k * 4 + 1] = q & 255; tex[k * 4 + 3] = biome[k];
  }
  return tex;
}

function genCloud() {
  const CN = WORLD.CN, cloud = new Uint8Array(CN * CN);
  for (let j = 0; j < CN; j++) {
    const v = j / CN;
    for (let i = 0; i < CN; i++) {
      const u = i / CN;
      const wx = fbm(u, v, 5, 3, 0.5, 21), wy = fbm(u, v, 5, 3, 0.5, 22);
      const uu = u + 0.012 * wx, vv = v + 0.012 * wy;
      const cov = sstep(0.40, 0.66, fbm(u, v, 3, 4, 0.5, 4242) * 0.5 + 0.5);   // where the cloud fields are
      const big = worley(uu, vv, 38, 77);                                        // the puffs themselves
      const mid = worley(uu + 0.013, vv + 0.031, 64, 78);
      const small = worley(uu + 0.4, vv + 0.7, 112, 79);
      const lone = sstep(0.55, 0.9, worley(u, v, 11, 80));                         // a few strays in the clear air
      const n = (0.16 + 0.84 * Math.max(cov, lone * 0.8)) * (0.62 * big + 0.26 * mid + 0.16 * small);
      cloud[j * CN + i] = Math.max(0, Math.min(255, Math.round(n * 255)));
    }
  }
  return cloud;
}

// bilinear height lookup in world coordinates (wraps)
function makeHeightSampler(height) {
  const { N, L, E1, E2 } = WORLD;
  return function (x, z) {
    let u = (x * E1[0] + z * E1[1]) / L * N - 0.5, v = (x * E2[0] + z * E2[1]) / L * N - 0.5;
    const i0 = Math.floor(u), j0 = Math.floor(v), fu = u - i0, fv = v - j0;
    const ia = ((i0 % N) + N) % N, ja = ((j0 % N) + N) % N;
    const ib = ia + 1 === N ? 0 : ia + 1, jb = ja + 1 === N ? 0 : ja + 1;
    const a = height[ja * N + ia], b = height[ja * N + ib], c = height[jb * N + ia], d = height[jb * N + ib];
    return a + (b - a) * fu + (c - a) * fv + (a - b - c + d) * fu * fv;
  };
}

if (typeof module !== 'undefined') module.exports = { WORLD, genBand, bakeTex, genCloud, makeHeightSampler };

</script>
<script>
// ───────────────────────── shaders ─────────────────────────
const VS_QUAD = `#version 300 es
in vec2 aP; out vec2 vUV;
void main(){ vUV = aP*0.5+0.5; gl_Position = vec4(aP,0.0,1.0); }`;

// The whole landscape is ray-marched per low-res pixel: land, water, clouds, sky.
const FS_SCENE = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uTerrain, uCloud;
uniform vec3 uCam; uniform mat3 uRot; uniform vec2 uRes; uniform float uTanF, uTime;
uniform vec3 uSunL, uSunV, uSunP;
uniform vec3 uPlane, uPFwd, uPRight; uniform float uPSpan, uPSc;
uniform vec2 uCloudOff; uniform vec2 uNF; uniform float uCeil;
uniform vec4 uBlast[6];   // xyz where a missile landed, w seconds since (negative: unused)
out vec4 o;

const float L = 10240.0, LC = 5120.0, HMIN = -96.0, HSPAN = 512.0, HMAX = 350.0;
const float CB = 215.0, CT = 80.0, C0 = 0.52;
const vec2 E1 = vec2(0.7474, 0.6644), E2 = vec2(-0.6644, 0.7474);
const float FAR = 9000.0;

#define C(r,g,b) (vec3(r,g,b)/255.0)

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }
float bayer4(vec2 fc){ ivec2 i = ivec2(fc) & 3;
  const int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[i.x + i.y*4]) + 0.5) / 16.0; }

vec2 tuv(vec2 xz){ return vec2(dot(xz,E1), dot(xz,E2)) / L; }
float dec(vec4 s){ return (s.r*65280.0 + s.g*255.0) / 65535.0 * HSPAN + HMIN; }
float hgt(vec2 xz, float lod){ return dec(textureLod(uTerrain, tuv(xz), lod)); }

float cfield(vec2 xz, float lod){ return textureLod(uCloud, vec2(dot(xz,E1), dot(xz,E2)) / LC + uCloudOff, lod).r; }
float cloudTop(float n){ float f = (n - C0) / (1.0 - C0);
  return CB + CT * (f > 0.0 ? sqrt(f) * (0.42 + 0.58*f) : f * 3.0); }

vec3 pick4(vec3 a, vec3 b, vec3 c, vec3 d, float l, float dth){
  float i = clamp(floor(clamp(l, 0.0, 0.999) * 4.0 + (dth - 0.5) * 0.6), 0.0, 3.0);
  return i < 0.5 ? a : i < 1.5 ? b : i < 2.5 ? c : d; }

// ── sky ──
vec3 skyGrad(float y){
  vec3 c = mix(C(255,226,160), C(252,200,134), smoothstep(-0.02, 0.05, y));
  c = mix(c, C(238,164,134), smoothstep(0.04, 0.16, y));
  c = mix(c, C(190,150,172), smoothstep(0.14, 0.32, y));
  c = mix(c, C(124,140,188), smoothstep(0.28, 0.58, y));
  c = mix(c, C(72,104,168), smoothstep(0.5, 1.0, y));
  return c; }
vec3 skyBase(vec3 rd){
  vec3 c = skyGrad(rd.y);
  float az = dot(normalize(rd.xz + 1e-5), normalize(uSunV.xz)) * 0.5 + 0.5;
  float low = 1.0 - smoothstep(0.0, 0.45, rd.y);
  c = mix(c, c * vec3(1.06, 1.03, 0.92) + vec3(0.07, 0.05, 0.0), pow(az, 4.0) * low);
  c = mix(c, mix(c, C(150,140,190), 0.55), pow(1.0 - az, 1.6) * low);
  return c; }

float planeShadow(vec3 p){
  vec3 v = uPlane - p; float s = dot(v, uSunP); if (s < 0.0) return 1.0;
  vec3 q = v - s * uSunP;
  float lx = abs(dot(q, uPRight)) / (max(uPSpan, 0.2) * uPSc), lz = dot(q, uPFwd) / uPSc;
  float body = step(lx, 2.2) * step(-9.6, lz) * step(lz, 4.0) + step(lx, 0.8) * step(4.0, lz) * step(lz, 10.4);
  float wing = step(lx, clamp((2.9 - lz) * 0.95, 0.0, 6.8)) * step(-5.2, lz) * step(lz, 2.9);
  float tail = step(lx, 4.4) * step(-9.4, lz) * step(lz, -6.4);
  return 1.0 - min(body + wing + tail, 1.0) * (1.0 - smoothstep(420.0, 900.0, s)); }

float cloudShadow(vec3 p){
  vec2 q = p.xz + uSunP.xz / uSunP.y * (CB + 22.0 - p.y);
  float n = cfield(q, 0.5);
  return 1.0 - smoothstep(C0 - 0.015, C0 + 0.05, n); }

// what a missile leaves behind: a shock ring, then foam on water or embers and a scorch on land
vec3 blastMark(vec3 col, vec3 p, bool water, float dth){
  for (int i = 0; i < 6; i++) {
    float a = uBlast[i].w; if (a < 0.0) continue;
    float d = length(p.xz - uBlast[i].xz); if (d > 150.0) continue;
    float ring = (1.0 - smoothstep(0.0, 3.4, abs(d - a * 80.0))) * (1.0 - smoothstep(0.3, 1.2, a));
    if (ring > dth) col = mix(col, C(255,246,224), 0.9);
    float n = hash12(floor(p.xz / 2.2) + float(i) * 7.0);
    if (water) {
      float foam = (1.0 - smoothstep(9.0, 22.0, d + n * 7.0)) * (1.0 - smoothstep(0.6, 4.5, a));
      if (foam > dth) col = mix(col, C(255,246,226), 0.85);
    } else {
      float sc = (1.0 - smoothstep(10.0, 22.0, d + n * 8.0)) * (1.0 - smoothstep(16.0, 28.0, a));
      col = mix(col, C(46,32,48), sc * 0.85);
      float ember = (1.0 - smoothstep(3.0, 13.0, d + n * 7.0)) * (1.0 - smoothstep(0.5, 6.0, a));
      if (ember > dth) col = C(255,150,60);
    }
  }
  return col; }

void main(){
  vec2 fc = gl_FragCoord.xy;
  float dth = bayer4(fc);
  vec2 ndc = (fc / uRes) * 2.0 - 1.0;
  vec3 rd = normalize(uRot * vec3(ndc.x * uTanF * uRes.x / uRes.y, ndc.y * uTanF, 1.0));
  vec3 ro = uCam;

  // ── land / water ──
  float tW = rd.y < -1e-5 ? ro.y / -rd.y : 1e9;
  float tmax = min(FAR, tW);
  float t = 0.0, tHit = -1.0;
  bool can = true;
  if (ro.y > HMAX) { if (rd.y >= 0.0) can = false; else t = (ro.y - HMAX) / -rd.y; }
  if (can) {
    float tp = t;
    for (int i = 0; i < 128; i++) {
      if (t > tmax) break;
      vec3 p = ro + rd * t;
      if (p.y > HMAX + 2.0 && rd.y > 0.0) break;
      float lod = clamp(log2(t / 500.0), 0.0, 5.0);
      float d = p.y - hgt(p.xz, lod);
      if (d < 0.0012 * t + 0.02) {
        float a = tp, b = t;
        for (int k = 0; k < 5; k++) { float m = 0.5 * (a + b); vec3 q = ro + rd * m; if (q.y - hgt(q.xz, lod) < 0.0) b = m; else a = m; }
        tHit = b; break;
      }
      tp = t;
      t += max(d * 0.42, 0.35 + t * 0.0045);
    }
  }
  bool water = false;
  if (tHit < 0.0 && tW < FAR) { tHit = tW; water = true; }
  if (tHit > 0.0 && !water && (ro + rd * tHit).y < 0.0) { tHit = tW; water = true; }

  // ── clouds ──
  float tC = -1.0; bool under = false;
  {
    float lim = tHit > 0.0 ? tHit : FAR;
    float ya = CB - 5.0, yb = min(CB + CT + 2.0, uCeil), t0 = 0.0, t1 = lim;
    bool ok = true;
    if (abs(rd.y) < 1e-4) { ok = ro.y > ya && ro.y < yb; }
    else { float a = (ya - ro.y) / rd.y, b = (yb - ro.y) / rd.y; t0 = max(min(a, b), 0.0); t1 = min(max(a, b), lim); }
    if (ok && t1 > t0 && yb > ya) {
      t1 = min(t1, t0 + 5600.0);
      float tt = t0 + 0.3, tp = tt;
      for (int i = 0; i < 64; i++) {
        if (tt > t1) break;
        vec3 p = ro + rd * tt;
        float lod = clamp(log2(tt / 600.0), 0.0, 4.0);
        float top = cloudTop(cfield(p.xz, lod));
        float d = p.y - top;
        if (d < 0.0 && top > CB) {
          float a = tp, b = tt;
          for (int k = 0; k < 5; k++) { float m = 0.5 * (a + b); vec3 q = ro + rd * m; float tq = cloudTop(cfield(q.xz, lod)); if (q.y < tq && tq > CB) b = m; else a = m; }
          tC = b; under = (ro + rd * b).y < CB + 1.5 && rd.y > 0.0; break;
        }
        tp = tt;
        tt += clamp(abs(d) * 0.4, 2.0 + tt * 0.012, 22.0 + tt * 0.03);
      }
    }
  }

  vec3 col; float tOut = FAR * 4.0; float fogT = -1.0;
  vec3 horiz = skyBase(normalize(vec3(rd.x, 0.012, rd.z)));

  if (tC > 0.0) {
    // ── cloud surface ──
    vec3 p = ro + rd * tC; tOut = tC; fogT = tC;
    float lod = clamp(log2(tC / 600.0), 0.0, 4.0), e = 7.0 + tC * 0.004;
    float n0 = cfield(p.xz, lod);
    float tx = cloudTop(cfield(p.xz + vec2(e, 0), lod)) - cloudTop(cfield(p.xz - vec2(e, 0), lod));
    float tz = cloudTop(cfield(p.xz + vec2(0, e), lod)) - cloudTop(cfield(p.xz - vec2(0, e), lod));
    vec3 n = normalize(vec3(-tx, 2.0 * e, -tz));
    float kh = clamp((p.y - CB) / CT, 0.0, 1.0);
    float l = 0.40 + 0.42 * max(dot(n, uSunL), 0.0) + 0.30 * kh;
    l -= step(fract(kh * 5.0 + 0.45), 0.14) * 0.085;               // stacked-contour steps
    if (under) l = 0.12 + 0.1 * n0;
    l *= mix(1.0, planeShadow(p), 0.5);
    col = pick4(C(150,120,168), C(228,168,168), C(255,228,200), C(255,250,238), l, dth);
  } else if (tHit > 0.0) {
    vec3 p = ro + rd * tHit; tOut = tHit; fogT = tHit;
    float lodS = clamp(log2(tHit / 700.0), 0.0, 5.0);
    vec4 s = textureLod(uTerrain, tuv(p.xz), lodS);
    float h = dec(s), bake = s.b, biome = s.a;
    float lit = (1.0 - smoothstep(0.25, 0.75, bake + (dth - 0.5) * 0.3)) * cloudShadow(p);
    float psh = planeShadow(p);
    float fade = smoothstep(2200.0, 500.0, tHit);
    if (water) {
      // ── water ──
      float depth = -h;
      float n1 = vnoise(p.xz * 0.018 + uTime * 0.03), n2 = vnoise(p.xz * 0.09 - uTime * 0.06);
      float d = depth + (n1 - 0.5) * 7.0 + (n2 - 0.5) * 2.5 * fade + (dth - 0.5) * 1.6;
      col = d < 2.6 ? C(150,222,190) : d < 7.5 ? C(72,178,170) : d < 19.0 ? C(38,128,152) : d < 44.0 ? C(30,86,134) : C(24,54,104);
      // sky on the water at low angles
      float fres = pow(1.0 - max(-rd.y, 0.0), 4.0);
      vec3 rf = reflect(rd, normalize(vec3((n2 - 0.5) * 0.10, 1.0, (n1 - 0.5) * 0.10)));
      col = mix(col, skyBase(rf), fres * 0.82);
      // shade
      col = mix(col * vec3(0.56, 0.60, 0.86), col, lit);
      col = mix(col * vec3(0.42, 0.44, 0.66), col, psh);
      // foam along the shore
      float foam = 0.9 + 0.7 * sin(uTime * 1.1 + n1 * 14.0);
      if (depth < foam * fade + 0.4 && hash12(floor(p.xz / 2.0) + floor(uTime * 2.0)) > 0.25) col = mix(C(255,244,220), col, 0.12 + 0.3 * (1.0 - lit));
      // glints: short dashes lying along the wind
      vec2 w = vec2(dot(p.xz, vec2(0.94, 0.34)), dot(p.xz, vec2(-0.34, 0.94))) / vec2(7.0, 2.4);
      vec2 cell = floor(w), fw = fract(w);
      float rnd = hash12(cell);
      float sunPath = pow(max(dot(rf, uSunV), 0.0), 60.0);
      float thr = 0.982 - sunPath * 0.6 + smoothstep(600.0, 2600.0, tHit) * 0.02 * (1.0 - min(sunPath * 4.0, 1.0)) + (1.0 - smoothstep(40.0, 260.0, tHit)) * 0.013;
      float tw = hash12(cell + floor(uTime * 1.7 + rnd * 9.0) * 13.0);
      if (tw > thr && tHit > 40.0 && abs(fw.y - 0.5) < 0.34 && (fw.x > 0.15 || sunPath > 0.2)) col = mix(col, C(255,250,228), lit * 0.75 + 0.25);
      col = blastMark(col, p, true, dth);
    } else {
      // ── land ──
      float e = 5.0 + tHit * 0.004;
      vec3 n = normalize(vec3(hgt(p.xz - vec2(e, 0), lodS) - hgt(p.xz + vec2(e, 0), lodS), 2.0 * e, hgt(p.xz - vec2(0, e), lodS) - hgt(p.xz + vec2(0, e), lodS)));
      vec2 cq = p.xz / 4.4 + (vec2(vnoise(p.xz * 0.085), vnoise(p.xz * 0.085 + 31.7)) - 0.5) * 2.2;   // crowns, nudged off the grid
      vec2 cell = floor(cq), cf = fract(cq);
      float r1 = hash12(cell), r2 = hash12(cell + 91.7);
      float nz = vnoise(p.xz * 0.011), nz2 = vnoise(p.xz * 0.045), nz3 = vnoise(p.xz * 0.0045 + 40.0);
      float slope = 1.0 - n.y;
      float hh = h + (nz2 - 0.5) * 12.0 + (r1 - 0.5) * 3.0 * fade;
      float l = 0.13 + 0.25 * n.y + 0.66 * max(dot(n, uSunL), 0.0) * lit;
      l += (fract(hh / 15.0) - 0.5) * 0.07;                         // terraces
      l *= mix(0.5, 1.0, psh);
      float crown = ((1.0 - cf.x) + (1.0 - cf.y) - 1.0) * 0.30 + (r1 - 0.5) * 0.22;   // lit north-west, dark south-east
      float forest = biome * 0.75 + nz * 0.5;
      if (hh > 224.0 + slope * 70.0) {
        col = pick4(C(124,122,178), C(196,180,208), C(244,222,210), C(255,247,232), l + 0.08, dth);
      } else if (slope > 0.34 || hh > 192.0) {
        l += (r1 - 0.5) * 0.10 * fade - step(fract(hh / 10.0), 0.22) * 0.07;
        col = pick4(C(62,52,88), C(112,96,120), C(166,148,138), C(214,196,168), l, dth);
      } else if (hh < 4.5) {
        col = pick4(C(126,100,112), C(186,154,112), C(228,200,140), C(248,226,170), l + 0.12, dth);
      } else if (forest > 0.52) {
        l += crown * fade;
        float sa = vnoise(p.xz * 0.0052 + 17.0) + (r2 - 0.5) * 0.16, sb = vnoise(p.xz * 0.0105 + 71.0) + (r1 - 0.5) * 0.16;
        if (hh > 104.0 + nz * 46.0 || (nz3 > 0.66 && hh > 22.0) || r2 > 0.955) {
          col = pick4(C(22,42,60), C(30,70,66), C(44,104,78), C(96,152,88), l, dth);
        } else if (sa > 0.60) col = pick4(C(78,58,56), C(170,122,42), C(230,176,48), C(252,216,96), l, dth);
        else if (sb > 0.56)   col = pick4(C(64,30,56), C(132,40,50), C(198,62,56), C(240,124,74), l, dth);
        else                  col = pick4(C(74,34,58), C(156,62,38), C(222,112,40), C(248,168,60), l, dth);
      } else if (hh < 16.0 && biome > 0.47) {
        l += (r1 - 0.5) * 0.08 * fade;
        col = pick4(C(40,66,72), C(78,116,82), C(134,166,88), C(192,208,116), l, dth);    // water meadows
      } else {
        l += (r1 - 0.5) * 0.08 * fade + step(0.5, fract((p.x * 0.6 + p.z * 0.8) / 9.0 + nz * 3.0)) * 0.035 * fade;
        col = pick4(C(92,84,88), C(168,146,84), C(220,194,110), C(246,228,150), l, dth);
      }
      col = blastMark(col, p, false, dth);
    }
  } else {
    // ── sky ──
    col = skyBase(rd);
    // high streaks catching the last light
    if (rd.y > 0.015) {
      vec2 sp = rd.xz / (rd.y + 0.12) * vec2(1.0, 3.2);
      float st = vnoise(sp * 0.9 + vec2(uTime * 0.004, 3.0)) * 0.6 + vnoise(sp * 2.7 + 9.0) * 0.4;
      float cov = smoothstep(0.56, 0.74, st + (dth - 0.5) * 0.08) * smoothstep(0.015, 0.09, rd.y) * (1.0 - smoothstep(0.35, 0.8, rd.y));
      col = mix(col, mix(C(255,214,170), C(232,150,150), smoothstep(0.1, 0.5, rd.y)), cov * 0.8);
    }
    float sd = dot(rd, uSunV);
    col = mix(col, C(255,232,170), smoothstep(0.972, 0.9985, sd) * 0.55);
    if (sd > 0.9965) col = C(255,226,150);
    if (sd > 0.99815) col = C(255,250,226);
  }

  // ── aerial haze ──
  if (fogT > 0.0) {
    float f = 1.0 - exp(-max(fogT - 520.0, 0.0) / 3300.0);
    f = clamp(f + smoothstep(FAR * 0.72, FAR, fogT), 0.0, 1.0);
    f = floor(f * 14.0 + dth) / 14.0;
    col = mix(col, horiz, clamp(f, 0.0, 1.0));
  }
  // posterise to a restrained ramp
  col = floor(col * 28.0 + dth) / 28.0;

  float zc = max(tOut * dot(rd, uRot[2]), uNF.x);
  float zn = (uNF.y + uNF.x) / (uNF.y - uNF.x) - (2.0 * uNF.y * uNF.x) / (uNF.y - uNF.x) / zc;
  gl_FragDepth = clamp(zn * 0.5 + 0.5, 0.0, 1.0);
  o = vec4(col, 0.0);
}`;

// The jet: flat-shaded mesh, banded into three tones.
const VS_MESH = `#version 300 es
in vec3 aPos; in vec3 aNor; in vec4 aCol;
uniform mat4 uVP; uniform mat4 uModel;
out vec3 vN; out vec3 vCol; out float vMat; out vec3 vLocal;
void main(){ vec4 w = uModel * vec4(aPos, 1.0); vN = mat3(uModel) * aNor; vCol = aCol.rgb; vMat = aCol.a; vLocal = aPos; gl_Position = uVP * w; }`;

const FS_MESH = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vCol; in float vMat; in vec3 vLocal;
uniform vec3 uSunL; uniform float uTime, uCore;
out vec4 o;
float bayer4(vec2 fc){ ivec2 i = ivec2(fc) & 3;
  const int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[i.x + i.y*4]) + 0.5) / 16.0; }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main(){
  float dth = bayer4(gl_FragCoord.xy);
  if (vMat > 1.5 && vMat < 2.5) {                       // afterburner plume, unit cone along -z
    float k = clamp(-vLocal.z, 0.0, 1.0);
    float flick = hash12(floor(gl_FragCoord.xy * 0.5) + floor(uTime * 30.0));
    if (k > 0.66 + 0.34 * flick) discard;
    if (uCore > 0.5) { o = vec4(k < 0.55 ? vec3(1.0, 0.99, 0.90) : vec3(1.0, 0.88, 0.52), 0.0); return; }
    if (dth > 0.94 - 0.40 * k) discard;                 // stippled sheath, so the white core shows through
    vec3 c = k < 0.20 ? vec3(1.0, 0.90, 0.56) : k < 0.48 ? vec3(1.0, 0.72, 0.30) : k < 0.76 ? vec3(0.97, 0.47, 0.20) : vec3(0.82, 0.26, 0.24);
    if (fract(k * 5.0 + 0.15) < 0.26 && k < 0.8) c = min(c + vec3(0.10, 0.22, 0.30), 1.0);   // shock diamonds
    o = vec4(c, 0.0); return;
  }
  if (vMat > 3.5) { o = vec4(vCol * (0.86 + 0.14 * sin(uTime * 41.0)), 1.0); return; }   // glow in the nozzles
  vec3 n = normalize(vN);
  float l = dot(n, uSunL) * 0.62 + n.y * 0.22 + 0.36;
  float i = floor(clamp(l, 0.0, 0.999) * 3.0 + (dth - 0.5) * 0.35);
  vec3 c = i < 0.5 ? vCol * vec3(0.50, 0.44, 0.66) : i < 1.5 ? vCol * vec3(0.84, 0.78, 0.84) : min(vCol * vec3(1.10, 1.06, 0.98) + vec3(0.03, 0.02, 0.0), 1.0);
  if (vMat > 2.5) c = mix(c, vec3(1.0, 0.97, 0.88), step(0.80, l) * 0.75);   // canopy glint
  o = vec4(c, 1.0);
}`;

// Wing-tip vapour and wake: ribbons expanded in screen space.
const VS_TRAIL = `#version 300 es
in vec3 aA; in vec3 aB; in vec2 aS;
uniform mat4 uVP; uniform vec2 uRes; uniform float uWidth, uPS, uMaxW;
out float vAge;
void main(){
  vec4 a = uVP * vec4(aA, 1.0), b = uVP * vec4(aB, 1.0);
  vec2 sa = a.xy / max(a.w, 1e-3) * uRes * 0.5, sb = b.xy / max(b.w, 1e-3) * uRes * 0.5;
  vec2 d = sb - sa; float len = length(d); d = len > 1e-4 ? d / len : vec2(1.0, 0.0);
  float wpx = clamp(uWidth * uPS / max(a.w, 1.0), 1.0, uMaxW) * (1.0 - 0.35 * aS.y);
  vec2 off = vec2(-d.y, d.x) * aS.x * wpx * 0.5;
  gl_Position = vec4(a.xy + off / (uRes * 0.5) * a.w, a.z, a.w);
  vAge = aS.y;
}`;
const FS_TRAIL = `#version 300 es
precision highp float;
in float vAge; uniform vec3 uColor; uniform float uFade0; out vec4 o;
float bayer4(vec2 fc){ ivec2 i = ivec2(fc) & 3;
  const int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[i.x + i.y*4]) + 0.5) / 16.0; }
void main(){ float a = 1.0 - smoothstep(uFade0, 1.0, vAge); if (bayer4(gl_FragCoord.xy) > a) discard; o = vec4(uColor, 0.0); }`;

// Smoke and spray: round pixel puffs.
const VS_PART = `#version 300 es
in vec3 aPos; in vec4 aData;   // size, age01, kind, seed
uniform mat4 uVP; uniform vec2 uRes; uniform float uPS;
out vec4 vData; out float vNear;
void main(){ vec4 c = uVP * vec4(aPos, 1.0); gl_Position = c; vData = aData;
  vNear = smoothstep(14.0, 60.0, c.w);
  gl_PointSize = clamp(aData.x * uPS / max(c.w, 1.0), 1.0, 46.0); }`;
const FS_PART = `#version 300 es
precision highp float;
in vec4 vData; in float vNear; out vec4 o;
float bayer4(vec2 fc){ ivec2 i = ivec2(fc) & 3;
  const int m[16] = int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5);
  return (float(m[i.x + i.y*4]) + 0.5) / 16.0; }
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float r = dot(q, q); if (r > 1.0) discard;
  float age = vData.y;
  float a = (1.0 - smoothstep(0.5, 1.0, age)) * vNear;
  if (vData.z > 2.5 && vData.z < 3.5) a *= smoothstep(0.03, 0.24, age);        // smoke gathers after the fire
  if (vData.z > 3.5) a = (1.0 - smoothstep(0.35, 1.0, age)) * vNear;
  if (bayer4(gl_FragCoord.xy) > a) discard;
  vec3 c;
  if (vData.z < 0.5) {            // exhaust haze: a spark of heat, then pale ash
    c = age < 0.035 ? vec3(1.0, 0.93, 0.62) : age < 0.075 ? vec3(0.98, 0.66, 0.34) : mix(vec3(0.99, 0.95, 0.88), vec3(0.74, 0.68, 0.78), smoothstep(0.12, 0.9, age));
    if (age >= 0.075 && q.x - q.y > 0.35) c *= vec3(0.80, 0.76, 0.90);     // shaded underside, away from the light
  } else if (vData.z < 1.5) {     // spray
    c = vec3(1.0, 0.97, 0.9);
  } else if (vData.z < 2.5) {     // fireball: white, gold, orange, ember, soot
    c = age < 0.16 ? vec3(1.0, 0.98, 0.86) : age < 0.42 ? vec3(1.0, 0.86, 0.42) : age < 0.66 ? vec3(0.98, 0.56, 0.22) : age < 0.84 ? vec3(0.80, 0.29, 0.20) : vec3(0.40, 0.27, 0.32);
    if (age > 0.16 && age < 0.66 && r < 0.25) c = min(c + vec3(0.02, 0.12, 0.26), 1.0);     // hotter heart
  } else if (vData.z > 3.5) {     // the flash
    c = age < 0.5 ? vec3(1.0, 0.99, 0.93) : vec3(1.0, 0.92, 0.62);
  } else {                        // the dark smoke that hangs afterwards
    c = mix(vec3(0.33, 0.26, 0.34), vec3(0.60, 0.54, 0.64), smoothstep(0.0, 0.9, age));
    if (q.x - q.y > 0.35) c *= vec3(0.80, 0.76, 0.90);
  }
  o = vec4(c, 0.0);
}`;

// Final pass: one-pixel ink outline around the jet.
const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uScene; uniform vec2 uRes;
in vec2 vUV; out vec4 o;
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 c = texelFetch(uScene, p, 0);
  if (c.a < 0.5) {
    ivec2 m = ivec2(uRes) - 1;
    float n = texelFetch(uScene, clamp(p + ivec2(1,0), ivec2(0), m), 0).a + texelFetch(uScene, clamp(p - ivec2(1,0), ivec2(0), m), 0).a
            + texelFetch(uScene, clamp(p + ivec2(0,1), ivec2(0), m), 0).a + texelFetch(uScene, clamp(p - ivec2(0,1), ivec2(0), m), 0).a;
    if (n > 0.5) c.rgb = vec3(0.105, 0.075, 0.15);
  }
  o = vec4(c.rgb, 1.0);
}`;

// ───────────────────────── the fighter ─────────────────────────
// A twin-engine, twin-tail jet built from lofted sections.
// Model space: x right wing, y up, z nose. Vertex = pos(3) normal(3) colour(3) material(1).
// Materials: 0 painted metal, 2 flame, 3 canopy glass, 4 glowing (unshaded).

const PLANE = {
  TIP: [6.6, -0.02, -4.7], NOZZLE: [1.32, -0.12, -9.5], WAKE: [1.3, -1.2, -7.5], EYE: [0, 1.72, 4.3],
  // missile stations: wing-tip rails first, then the pylons under the wings
  HARD: [[6.6, -0.05, -3.7], [-6.6, -0.05, -3.7], [3.9, -0.64, -1.4], [-3.9, -0.64, -1.4]],
};

function buildPlane() {
  const GREY = [0.74, 0.78, 0.84], SLATE = [0.40, 0.46, 0.60], PALE = [0.84, 0.86, 0.90];
  const RADOME = [0.25, 0.27, 0.36], DARK = [0.13, 0.11, 0.18], NOZZLE = [0.34, 0.29, 0.33];
  const RED = [0.92, 0.31, 0.16], WHITE = [0.95, 0.93, 0.88], GLASS = [0.99, 0.74, 0.27], GLOW = [1.0, 0.60, 0.24];
  const out = [];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

      if (S.spinT >= 1) { S.spinT = -1; S.spin = 0; } else { const e = S.spinT; S.spin = S.spinDir * Math.PI * 2 * (e * e * (3 - 2 * e)); }
    }
    const B = planeBasis(S.yaw, S.pitch, S.roll + S.spin);
    const y0 = S.pos[1];
    S.pos = add(S.pos, mul(B.f, S.speed * dt));
    S.ground = Math.max(groundAt(S.pos[0], S.pos[2]), 0);
    const overWater = S.ground < 0.5, floor = S.ground + (overWater ? 4.6 : 12);
    if (S.pos[1] < floor) { S.pos[1] = floor; if (S.pitch < 0) S.pitch *= Math.exp(-dt * 10); }
    S.agl = S.pos[1] - S.ground;
    S.vs = mix(S.vs, (S.pos[1] - y0) / Math.max(dt, 1e-4), damp(dt, 6));
    S.g = mix(S.g, 1 + (S.pitch - pPrev) / Math.max(dt, 1e-4) * S.speed / 60 + Math.abs(S.omega) * 0.9, damp(dt, 5));
    S.skim = overWater && S.agl < 5.3 ? 1 : 0;
    S.shake = mix(S.shake, REDUCED ? 0 : S.boost, damp(dt, 6));

    // keep numbers small: the land repeats along its own two axes
    const { L, E1, E2 } = WORLD;
    for (const E of [E1, E2]) {
      const a = S.pos[0] * E[0] + S.pos[2] * E[1];
      if (Math.abs(a) > L * 0.5) shiftWorld(-Math.sign(a) * L * E[0], -Math.sign(a) * L * E[1]);
    }

    // wing-tip vapour, and the furrow the jet wash cuts in the water
    const tipsOn = 1;
    for (let k = 0; k < TRAIL_COUNT; k++) {
      const T = trails[k], sgn = k % 2 ? -1 : 1;
      T.acc += dt;
      if (T.acc >= 1 / 40) {
        T.acc = 0;
        let p, on;
        if (k < 2) { p = toWorld(B, [PLANE.TIP[0] * sgn, PLANE.TIP[1], PLANE.TIP[2]]); on = tipsOn; }
        else { p = toWorld(B, [PLANE.WAKE[0] * sgn, PLANE.WAKE[1], PLANE.WAKE[2]]); p[1] = 0.35; on = S.skim; }
        const i = T.head * 5; T.pts[i] = p[0]; T.pts[i + 1] = p[1]; T.pts[i + 2] = p[2]; T.pts[i + 3] = S.time; T.pts[i + 4] = on;
        T.head = (T.head + 1) % TRAIL_N; T.n = Math.min(TRAIL_N, T.n + 1);
      }
    }
    // afterburner haze
    const vel = mul(B.f, S.speed);
    if (S.boost > 0.25) {
      parts.acc += dt * 120 * S.boost;
      while (parts.acc >= 1) {
        parts.acc -= 1;
        const sgn = Math.random() < 0.5 ? -1 : 1;
        const p = toWorld(B, [PLANE.NOZZLE[0] * sgn, PLANE.NOZZLE[1], PLANE.NOZZLE[2] - 9 - Math.random() * 5]);
        const j = () => (Math.random() - 0.5) * 11;
        spawn(p, add(mul(vel, 0.42), [j(), j() + 3, j()]), 0.9 + Math.random() * 1.0, 1.3 + Math.random() * 1.1, 0);
      }
    }
    if (S.skim) {
      parts.accS += dt * 120;
      while (parts.accS >= 1) {
        parts.accS -= 1;
        const sgn = Math.random() < 0.5 ? -1 : 1;
        const p = toWorld(B, [PLANE.WAKE[0] * sgn + (Math.random() - 0.5) * 2, PLANE.WAKE[1], PLANE.WAKE[2] - Math.random() * 8]); p[1] = 0.5;
        spawn(p, add(mul(vel, 0.45), add(mul(B.r, sgn * (3 + Math.random() * 13)), [0, 7 + Math.random() * 13, 0])), 0.3 + Math.random() * 0.4, 0.5 + Math.random() * 0.7, 1);
      }
    }
    if (inp.fire || inp.keyFire || inp.btnFire) fireMissile();
    updateMissiles(dt);
    for (let i = 0; i < PART_N; i++) {
      if (parts.age[i] >= 1) continue;
      parts.age[i] += dt / parts.life[i];
      const k = i * 3, kd = parts.kind[i];

  }

  function shiftWorld(dx, dz) {
    S.pos[0] += dx; S.pos[2] += dz; cam.pos[0] += dx; cam.pos[2] += dz;
    for (const T of trails) for (let i = 0; i < TRAIL_N; i++) { T.pts[i * 5] += dx; T.pts[i * 5 + 2] += dz; }
    for (let i = 0; i < PART_N; i++) { parts.pos[i * 3] += dx; parts.pos[i * 3 + 2] += dz; }
    for (const m of msl.live) { m.pos[0] += dx; m.pos[2] += dz; if (m.target) { m.target[0] += dx; m.target[2] += dz; } }
    for (const b of blasts) { b[0] += dx; b[2] += dz; }
  }

  // ── cameras ──
  function viewCam(v, B) {
    if (v === 0) return { pos: [S.pos[0], S.pos[1] + 232, S.pos[2]], B: { r: [1, 0, 0], u: [0, 0, -1], f: [0, -1, 0] }, fov: 0.80 };
    if (v === 1) {
      const f = [Math.sin(S.camYaw) * Math.cos(S.camPitch), Math.sin(S.camPitch), -Math.cos(S.camYaw) * Math.cos(S.camPitch)];
      const back = 84 + 16 * S.boost;
      let pos = add(sub(S.pos, mul(f, back)), [0, 27, 0]);
      const g = Math.max(groundAt(pos[0], pos[2]), 0) + 6; if (pos[1] < g) pos[1] = g;
      const tgt = add(S.pos, add(mul(f, 70), [0, 2, 0]));
      return { pos, B: lookBasis(sub(tgt, pos), S.camRoll), fov: 0.98 + 0.12 * S.boost };
    }
    const sh = S.shake * 0.05;
    const eye = toWorld(B, [PLANE.EYE[0] + Math.sin(S.time * 61) * sh, PLANE.EYE[1] + Math.sin(S.time * 47) * sh, PLANE.EYE[2]]);

    const ca = Math.cos(0.19), sa = Math.sin(0.19);
    return { pos: eye, B: { r: B.r, u: add(mul(B.u, ca), mul(B.f, sa)), f: add(mul(B.f, ca), mul(B.u, -sa)) }, fov: 1.16 + 0.08 * S.boost };
  }
  function updateCamera(dt, B) {
    S.camYaw += wrapPi(S.yaw - S.camYaw) * damp(dt, 3.2);
    S.camPitch += (S.pitch * 0.62 - S.camPitch) * damp(dt, 2.6);
    S.camRoll += ((S.roll * 0.28) - S.camRoll) * damp(dt, 3);
    if (S.viewT < 1) S.viewT = Math.min(1, S.viewT + dt / (REDUCED ? 0.01 : 1.15));

    cam.wCockpit = (S.view === 2 ? e : 0) + (S.prev === 2 ? 1 - e : 0);
  }

  // ── drawing ──
  const NEAR = 0.6, FARZ = 40000;
  function matVP(c, aspect) {
    const f = 1 / Math.tan(c.fov / 2), b = [-c.B.f[0], -c.B.f[1], -c.B.f[2]], r = c.B.r, u = c.B.u, p = c.pos;
    const V = [r[0], u[0], b[0], 0, r[1], u[1], b[1], 0, r[2], u[2], b[2], 0, -dot(r, p), -dot(u, p), -dot(b, p), 1];
    const Pm = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (FARZ + NEAR) / (NEAR - FARZ), -1, 0, 0, 2 * FARZ * NEAR / (NEAR - FARZ), 0];
    const o = new Float32Array(16);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += Pm[k * 4 + j] * V[i * 4 + k]; o[i * 4 + j] = s; }
    return o;
  }
  function matModel(B, pos, sx, sy, sz) {
    return new Float32Array([B.r[0] * sx, B.r[1] * sx, B.r[2] * sx, 0, B.u[0] * sy, B.u[1] * sy, B.u[2] * sy, 0, B.f[0] * sz, B.f[1] * sz, B.f[2] * sz, 0, pos[0], pos[1], pos[2], 1]);
  }

  function fillTrail(T, tipNow, life) {
    // newest first; the head is pinned to the wing tip so the ribbon never detaches
    let o = 0;
    const put = (a, b, side, age) => { trailData[o++] = a[0]; trailData[o++] = a[1]; trailData[o++] = a[2]; trailData[o++] = b[0]; trailData[o++] = b[1]; trailData[o++] = b[2]; trailData[o++] = side; trailData[o++] = age; };

  }

  function render() {

    gl.uniform1f(pr.u('uPSpan'), Math.abs(Math.cos(S.roll + S.spin))); gl.uniform1f(pr.u('uPSc'), JS);
    gl.uniform2f(pr.u('uCloudOff'), S.cloudOff[0] % 1, S.cloudOff[1] % 1);
    gl.uniform2f(pr.u('uNF'), NEAR, FARZ);
    gl.uniform1f(pr.u('uCeil'), mix(1e5, S.pos[1] - 14, sstep(0.25, 0.75, (S.view === 0 ? S.viewT : 0) + (S.prev === 0 ? 1 - S.viewT : 0))));
    for (let i = 0; i < 6; i++) { const b = blasts[i], a = b[3] < 0 ? -1 : S.time - b[3]; blastData[i * 4] = b[0]; blastData[i * 4 + 1] = b[1]; blastData[i * 4 + 2] = b[2]; blastData[i * 4 + 3] = a > 30 ? -1 : a; }
    gl.uniform4fv(pr.u('uBlast'), blastData);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.depthFunc(gl.LESS);
    const VP = matVP(cam, aspect);

    // the jet
    pr = P.mesh; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'), false, VP);
    gl.uniformMatrix4fv(pr.u('uModel'), false, matModel(B, S.pos, JS, JS, JS));
    gl.uniform3fv(pr.u('uSunL'), sunL); gl.uniform1f(pr.u('uTime'), S.time); gl.uniform1f(pr.u('uCore'), 0);
    const inside = cam.wCockpit > 0.72;
    if (!inside) {
      gl.bindVertexArray(meshVAO); gl.drawArrays(gl.TRIANGLES, 0, model.solidEnd);
      // afterburner: a white-hot core inside a stippled sheath
      if (S.boost > 0.04) {
        gl.bindVertexArray(flameVAO);
        for (const core of [1, 0]) {
          gl.uniform1f(pr.u('uCore'), core);
          for (const sgn of [1, -1]) {
            const p = toWorld(B, [PLANE.NOZZLE[0] * sgn, PLANE.NOZZLE[1], PLANE.NOZZLE[2]]);
            const len = (19 + 4 * Math.sin(S.time * 53 + sgn)) * JS * S.boost * (core ? 0.6 : 1), w = (core ? 0.40 : 0.74) * JS * Math.min(1, S.boost * 2);

      gl.drawArrays(gl.TRIANGLES, 0, model.missileCount);
    }
    const MS = JS * 1.5;
    for (const m of msl.live) { gl.uniformMatrix4fv(pr.u('uModel'), false, matModel(lookBasis(m.dir, 0), m.pos, MS, MS, MS)); gl.drawArrays(gl.TRIANGLES, 0, model.missileCount); }

        gl.uniform1f(pr.u('uCore'), core);

          const len = (9 + 2.5 * Math.sin(S.time * 61 + m.slot * 2)) * MS * (core ? 0.6 : 1) * Math.min(1, m.t * 8), w = (core ? 0.16 : 0.30) * MS;
          gl.uniformMatrix4fv(pr.u('uModel'), false, matModel(lookBasis(m.dir, 0), sub(m.pos, mul(m.dir, 1.6 * MS)), w, w, len));
          gl.drawArrays(gl.TRIANGLES, 0, model.flameCount);
        }
      }
    }

    // vapour, wakes, missile smoke
    gl.depthMask(false);
    pr = P.trail; gl.useProgram(pr.p);
    gl.uniformMatrix4fv(pr.u('uVP'), false, VP); gl.uniform2f(pr.u('uRes'), IW, IH); gl.uniform1f(pr.u('uPS'), IH * 0.5 / Math.tan(cam.fov / 2));
    gl.bindVertexArray(trailVAO); gl.bindBuffer(gl.ARRAY_BUFFER, trailBuf);
    for (let k = 0; k < TRAIL_COUNT + MSL_MAX; k++) {
      const sgn = k % 2 ? -1 : 1, wake = k === 2 || k === 3, rocket = k >= TRAIL_COUNT;

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(pr.u('uScene'), 0);
    gl.uniform2f(pr.u('uRes'), IW, IH);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (window.Cockpit) Cockpit.draw(cam.wCockpit, S, inp, { groundAt, cam, missiles: readyCount(), fox: S.time - msl.fox });
  }

  // ── input ──
  const HINTS = [
    [['Mouse', 'steer'], ['Click', 'roll'], ['Hold', 'afterburner'], ['Right click', 'missile'], ['Space', 'chase view']],
    [['Mouse', 'steer, climb, dive'], ['Click', 'roll'], ['Hold', 'afterburner'], ['Right click', 'missile'], ['Space', 'cockpit']],
    [['Mouse', 'steer, climb, dive'], ['Click', 'roll'], ['Hold', 'afterburner'], ['Right click', 'missile'], ['Space', 'top view']],
  ];
  const HINTS_TOUCH = [
    [['Drag', 'steer'], ['Double tap', 'roll']],
    [['Drag', 'steer, climb, dive'], ['Double tap', 'roll']],
    [['Drag', 'steer, climb, dive'], ['Double tap', 'roll']],
  ];
  function updateHints() {
    const bar = $('hints'), set = (inp.touch ? HINTS_TOUCH : HINTS)[S.view];
    bar.className = 'hints ' + (S.view === 2 ? 'at-top' : 'at-bottom');
    bar.innerHTML = set.map(([k, v], i) => {
      const body = '<b>' + k + '</b><span>' + v + '</span>' + (v === 'missile' ? '<span class="pips" id="pips" aria-hidden="true"></span>' : '');
      return !inp.touch && i === set.length - 1 ? '<button type="button" id="hint-view" class="hint">' + body + '</button>' : '<span class="hint">' + body + '</span>';
    }).join('<i aria-hidden="true">·</i>');
    updatePips();
    $('btn-view').textContent = ['Chase view', 'Cockpit', 'Top view'][S.view];
    // on a phone the buttons carry the labels, so the strip steps aside after a moment

  }
  let hintTimer = 0;
  function pointerPos(e) { inp.mx = (e.clientX / innerWidth) * 2 - 1; inp.my = -((e.clientY / innerHeight) * 2 - 1); }
  const stage = $('stage');
  // a second mouse button pressed while the first is held arrives as a move, so read the button mask every time
  function syncButtons(e) {

    if (L && !inp.down) { inp.down = true; inp.downT = now; }
    else if (!L && inp.down) { inp.down = false; if (!inp.holdBoost && now - inp.downT < 260) triggerRoll(); inp.holdBoost = false; }
    if (R && !inp.fire) fireMissile();                            // fire on the press itself, however short
    inp.fire = R;
  }
  stage.addEventListener('pointermove', e => { pointerPos(e); inp.has = true; hideTitle(); syncButtons(e); });
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) { inp.uiPress = true; return; }
    const touch = e.pointerType === 'touch';
    if (touch !== inp.touch) { inp.touch = touch; document.body.classList.toggle('touch', touch); updateHints(); }

  stage.addEventListener('pointerup', e => { if (inp.uiPress) { inp.uiPress = false; return; } syncButtons(e); });
  stage.addEventListener('pointercancel', () => { inp.uiPress = false; inp.down = false; inp.holdBoost = false; inp.fire = false; });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', e => { const b = e.target.closest('#hint-view, #btn-view'); if (b) { setView(S.view + 1); b.blur(); } });
  const bb = $('btn-boost');
  bb.addEventListener('pointerdown', e => { inp.btnBoost = true; e.preventDefault(); try { bb.setPointerCapture(e.pointerId); } catch (_) { } });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) bb.addEventListener(t, () => { inp.btnBoost = false; });
  const bf = $('btn-fire');
  bf.addEventListener('pointerdown', e => { inp.btnFire = true; fireMissile(); e.preventDefault(); try { bf.setPointerCapture(e.pointerId); } catch (_) { } });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) bf.addEventListener(t, () => { inp.btnFire = false; });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) setView(S.view + 1); }
    else if (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3') setView(+e.code.slice(5) - 1);
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') inp.keyBoost = true;
    else if (e.code === 'KeyR') triggerRoll();
    else if (e.code === 'KeyF' || e.code === 'Enter') { if (!e.repeat) fireMissile(); inp.keyFire = true; }
    else if (e.code === 'KeyM') toggleSound();
    hideTitle();
  });
  addEventListener('keyup', e => { if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') inp.keyBoost = false; else if (e.code === 'KeyF' || e.code === 'Enter') inp.keyFire = false; });
  addEventListener('blur', () => { inp.keyBoost = false; inp.holdBoost = false; inp.down = false; inp.btnBoost = false; inp.fire = false; inp.keyFire = false; inp.btnFire = false; inp.uiPress = false; });
  let titleGone = false, readyAt = 0;
  function hideTitle() { if (titleGone || !worldReady || performance.now() - readyAt < 2600) return; titleGone = true; $('title').classList.add('gone'); }

  // ── sound: synthesised, silent until asked for ──
  const snd = { ctx: null, on: false };
  function buildSound() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    const c = new AC(); snd.ctx = c;
    snd.master = c.createGain(); snd.master.gain.value = 0; snd.master.connect(c.destination);
    // one noise loop feeds the turbine roar, the wind and the afterburner
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b = (b + 0.04 * w) / 1.04; d[i] = w * 0.35 + b * 5.5; }
    snd.buf = buf;
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.5; snd.eng = c.createGain(); snd.eng.gain.value = 0.12;
    src.connect(lp); lp.connect(snd.eng); snd.eng.connect(snd.master);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 720; bp.Q.value = 0.5; snd.wind = c.createGain(); snd.wind.gain.value = 0.02;
    src.connect(bp); bp.connect(snd.wind); snd.wind.connect(snd.master);
    const rl = c.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 1000; snd.rocket = c.createGain(); snd.rocket.gain.value = 0;
    src.connect(rl); rl.connect(snd.rocket); snd.rocket.connect(snd.master);
    // the thin turbine whine on top
    snd.o1 = c.createOscillator(); snd.o1.type = 'sine'; snd.o1.frequency.value = 1500; snd.whine = c.createGain(); snd.whine.gain.value = 0.006;
    snd.o1.connect(snd.whine); snd.whine.connect(snd.master);
    snd.o1.start(); src.start();
    return true;
  }
  // one-shot noises: the missile leaving the rail, and where it ends up
  function sfx(kind, vol = 1) {
    if (!snd.on || !snd.ctx) return;
    try {
      const c = snd.ctx, t = c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = snd.buf; src.loop = true;
      g.gain.setValueAtTime(0.0001, t);
      if (kind === 'launch') {
        f.type = 'bandpass'; f.Q.value = 0.8; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(480, t + 0.7);
        g.gain.exponentialRampToValueAtTime(0.5, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9); src.stop(t + 1);
      } else {
        f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(70, t + 1.1);
        g.gain.exponentialRampToValueAtTime(1.1 * vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4); src.stop(t + 1.5);
      }
      src.connect(f); f.connect(g); g.connect(snd.master); src.start(t, Math.random());
    } catch (e) { }
  }
  function toggleSound() {
    try {
      if (!snd.ctx && !buildSound()) return;
      snd.on = !snd.on;
      if (snd.on) snd.ctx.resume();
      snd.master.gain.setTargetAtTime(snd.on ? 0.55 : 0, snd.ctx.currentTime, 0.12);
    } catch (e) { snd.on = false; }
    const b = $('btn-sound'); b.textContent = snd.on ? 'Sound: on' : 'Sound: off'; b.setAttribute('aria-pressed', snd.on ? 'true' : 'false');
  }
  function updateSound() {
    if (!snd.on || !snd.ctx) return;
    const t = snd.ctx.currentTime, inside = cam.wCockpit;
    snd.o1.frequency.setTargetAtTime(1450 + 520 * S.boost + 120 * Math.sin(S.pitch), t, 0.25);
    snd.eng.gain.setTargetAtTime(0.10 + 0.07 * inside + 0.05 * S.boost, t, 0.15);
    snd.wind.gain.setTargetAtTime(0.012 + 0.05 * clamp((S.speed - 140) / 170, 0, 1), t, 0.2);
    snd.rocket.gain.setTargetAtTime(0.34 * S.boost, t, 0.06);
  }
  $('btn-sound').addEventListener('click', e => { toggleSound(); e.currentTarget.blur(); });

  // ── loop ──
  let last = 0, slow = 0, frames = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!worldReady) return;
    const raw = (now - last) / 1000; last = now;
    const dt = clamp(raw, 0.001, 0.05);
    if (inp.down && !inp.holdBoost && now - inp.downT > 190) inp.holdBoost = true;
    update(dt); render(); updateSound();
    // if the machine cannot keep up, trade pixels for frames
    frames++;
    if (frames > 90 && !window.__noAdapt) {
      slow = raw > 0.034 ? slow + 1 : Math.max(0, slow - 2);
      if (slow > 70 && scaleBias < 3) { scaleBias++; slow = 0; frames = 0; resize(); }
    }
  }

  function start(saved) {
    if (saved && saved.pos) { S.pos = saved.pos.slice(); S.yaw = S.camYaw = saved.yaw || 0; S.view = S.prev = saved.view || 0; S.cruise = saved.cruise || CRUISE; titleGone = true; $('title').classList.add('gone'); }
    resize(); updateHints();
    generateWorld(p => { $('boot-bar').style.transform = 'scaleX(' + p.toFixed(3) + ')'; }).then(w => {
      heightField = w.height; groundAt = makeHeightSampler(w.height);
      uploadWorld(w.tex, w.cloud);
      worldReady = true; last = readyAt = performance.now();
      update(0.016);
      $('boot').classList.add('done'); document.body.classList.add('ready');
      setTimeout(hideTitle, 6500);
    });
    requestAnimationFrame(frame);
  }

  window.__game = {
    S, inp, msl, setView, triggerRoll, fireMissile, get ready() { return worldReady; }, get cam() { return cam; }, get res() { return [IW, IH, SCALE]; },
    advance(sec, step = 1 / 60) { for (let t = 0; t < sec; t += step) update(step); }, render, groundAt: (x, z) => groundAt(x, z),
  };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ pos: S.pos, yaw: S.yaw, view: S.view, cruise: S.cruise }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
</body>
</html>
