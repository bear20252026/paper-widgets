<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>华容道</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="description" content="华容道 — slide the wooden blocks, walk the red one out. Your solve becomes an ink painting.">
<meta property="og:title" content="华容道 · Huarongdao">
<meta property="og:description" content="Slide the wooden blocks, walk the red one out — your solve becomes an ink painting.">
<meta property="og:type" content="website">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="title">华容道</div>
<div id="hint">slide the wooden blocks · walk the red one out through the gate</div>
<div id="clock">0'00" · 0 moves</div>
<div id="levels">
  <button data-l="easy">EASY</button><button data-l="medium">MEDIUM</button><button data-l="classic">CLASSIC</button>
</div>
<button id="reset">RESET</button>
<button id="ranksBtn">RANKS</button>
<div id="footer">MADE WITH <button id="heart" aria-label="like">♡</button></div>
<div id="tray"></div>
<div id="board"></div>
<div id="gateCut"></div>
<svg width="0" height="0" style="position:absolute">
  <filter id="inkflow" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="big"/>
    <feDisplacementMap in="SourceGraphic" in2="big" scale="13" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="3" result="fine"/>
    <feDisplacementMap in="d1" in2="fine" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d2"/>
    <feGaussianBlur in="d2" stdDeviation="0.55"/>
  </filter>
</svg>

<div id="veil">
  <div id="artwrap">
    <img id="artimg" alt="an ink painting grown from your solve">
    <a id="sealLink" target="_blank" rel="noopener" title="play at the source"></a>
  </div>
  <div id="boardLevels">
    <button data-bl="easy">EASY</button><button data-bl="medium">MEDIUM</button><button data-bl="classic">CLASSIC</button>
  </div>
  <div id="cardbtns">
    <button id="dl">DOWNLOAD</button>
    <button id="modeBtn">RANKING</button>
    <button id="again">TRY AGAIN</button>
    <button id="closeBoard">CLOSE</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
