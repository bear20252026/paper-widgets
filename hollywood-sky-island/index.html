import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';

/* ---------- utils ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash3=(x,y,z)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1440662683)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
const n2=(x,z)=>{const xi=Math.floor(x),zi=Math.floor(z),fx=x-xi,fz=z-zi,sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz),a=hash3(xi,7,zi),b=hash3(xi+1,7,zi),c=hash3(xi,7,zi+1),d=hash3(xi+1,7,zi+1);return a+(b-a)*sx+(c-a)*sz+(a-b-c+d)*sx*sz};
const sstep=(a,b,v)=>{const t=Math.min(1,Math.max(0,(v-a)/(b-a)));return t*t*(3-2*t)};
const frac=v=>v-Math.floor(v), tri=v=>Math.abs(frac(v)*4-2)-1, TAU=Math.PI*2;
const rnd=mulberry(20240);
const colCache=new Map(), lin=h=>{let c=colCache.get(h);if(!c){c=new THREE.Color(h);colCache.set(h,c)}return c};
const AOF=[.52,.7,.86,1];

/* ---------- voxel grid with baked AO mesher ---------- */
class Vox{
  constructor(w,h,d){this.w=w;this.h=h;this.d=d;this.ox=w>>1;this.oy=h>>1;this.oz=d>>1;this.g=new Uint32Array(w*h*d)}
  i(x,y,z){x+=this.ox;y+=this.oy;z+=this.oz;return(x<0||y<0||z<0||x>=this.w||y>=this.h||z>=this.d)?-1:x+this.w*(z+this.d*y)}
  set(x,y,z,c){const i=this.i(Math.round(x),Math.round(y),Math.round(z));if(i>=0)this.g[i]=c|0x1000000}
  del(x,y,z){const i=this.i(x,y,z);if(i>=0)this.g[i]=0}
  get(x,y,z){const i=this.i(Math.round(x),Math.round(y),Math.round(z));return i<0?0:this.g[i]}
  box(x0,y0,z0,x1,y1,z1,c){for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)this.set(x,y,z,c)}
  geo(s=1){
    const {w,h,d,g,ox,oy,oz}=this,P=[],N=[],C=[],I=[];let vc=0;
    const S=(x,y,z)=>(x<0||y<0||z<0||x>=w||y>=h||z>=d)?0:g[x+w*(z+d*y)];
    const p=[0,0,0],q=[0,0,0],r=[0,0,0],ao=[0,0,0,0];
    for(let y=0;y<h;y++)for(let z=0;z<d;z++)for(let x=0;x<w;x++){
      const v=g[x+w*(z+d*y)];if(!v)continue;
      const col=lin(v&0xffffff),j=.92+.16*hash3(x,y,z);
      for(let a=0;a<3;a++)for(let sg=-1;sg<=1;sg+=2){
        p[0]=x;p[1]=y;p[2]=z;p[a]+=sg;if(S(p[0],p[1],p[2]))continue;
        const u=(a+1)%3,vv=(a+2)%3;
        for(let k=0;k<4;k++){
          const cu=(k===1||k===2)?1:0,cv=k>=2?1:0,du=cu?1:-1,dv=cv?1:-1;
          q[0]=p[0];q[1]=p[1];q[2]=p[2];
          q[u]+=du;const s1=S(q[0],q[1],q[2])?1:0;q[vv]+=dv;const cc=S(q[0],q[1],q[2])?1:0;q[u]-=du;const s2=S(q[0],q[1],q[2])?1:0;
          ao[k]=(s1&&s2)?0:3-(s1+s2+cc);
          r[0]=x;r[1]=y;r[2]=z;if(sg>0)r[a]+=1;r[u]+=cu;r[vv]+=cv;
          P.push((r[0]-ox)*s,(r[1]-oy)*s,(r[2]-oz)*s);N.push(a===0?sg:0,a===1?sg:0,a===2?sg:0);
          const f=AOF[ao[k]]*j;C.push(col.r*f,col.g*f,col.b*f);
        }
        const fl=ao[0]+ao[2]<ao[1]+ao[3];
        if(sg>0){fl?I.push(vc+1,vc+2,vc+3,vc+1,vc+3,vc):I.push(vc,vc+1,vc+2,vc,vc+2,vc+3)}
        else{fl?I.push(vc+1,vc+3,vc+2,vc+1,vc,vc+3):I.push(vc,vc+2,vc+1,vc,vc+3,vc+2)}
        vc+=4;
      }
    }
    const G=new THREE.BufferGeometry();
    G.setAttribute('position',new THREE.BufferAttribute(new Float32Array(P),3));
    G.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(N),3));
    G.setAttribute('color',new THREE.BufferAttribute(new Float32Array(C),3));
    G.setIndex(I);return G;
  }
}

/* ---------- renderer / scene ---------- */

const cyl=(cx,cz,r,y0,y1,c)=>{const m=Math.ceil(r);for(let a=-m;a<=m;a++)for(let b=-m;b<=m;b++)if(a*a+b*b<=r*r)for(let y=y0;y<=y1;y++)V.set(cx+a,y,cz+b,typeof c==='function'?c(a,y,b):c)};
const dome=(cx,cy,cz,r)=>{for(let a=-r;a<=r;a++)for(let b=0;b<=r;b++)for(let c=-r;c<=r;c++)if(a*a+b*b+c*c<=r*r+.6)V.set(cx+a,cy+b,cz+c,[0x5fae96,0x52a08a,0x76c4aa][(hash3(a+cx,b,c)*3)|0])};

const clearA=(x0,z0,x1,z1,c)=>{for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++)if(gh(x,z)>-99){for(let y=1;y<45;y++)V.del(x,y,z);V.set(x,0,z,c);tops[ti(x,z)]=0}};

const rimN=a=>1+.07*Math.sin(3*a-2)+.05*Math.sin(5*a-4.4)+.03*Math.sin(9*a+.7);

const shoreZ=x=>33+2.5*Math.sin(x*.09)+1.5*n2(x*.1,3);
const STR=[[-3,0x7b5438],[-7,0xc77a45],[-10,0xe0b987],[-14,0xb5673f],[-19,0xe6c796],[-22,0x9c5b40],[-28,0xcda676],[-33,0x8a6253]];

  if(top<0){const d=z-sh;return d<1.5&&h>.45?0xf2fffb:d<4?0x86e6d6:d<11?(h>.9?0x8ae6dc:0x55d0cf):(h>.92?0x74dcda:0x3cc0cc)}

  const az=Math.abs(z);
  if(az<=3)return z===0&&((x%4)+4)%4<2?0xf0d98c:(h>.8?0x55505c:0x4b4753);
  if(az<=6){const m=((x%6)+6)%6;if(m===0&&az===5)return 0xe0b24e;if(m===0||(az===5&&(m===1||m===5)))return 0xe88cab;return h>.75?0xc4bbb9:0xd3cbc8}
  if(z>=24)return h>.8?0xe9d09c:0xf2deb0;
  return h>.85?0x79a852:n2(x*.2,z*.2)>.5?0x8fba60:0x84b259;
}
for(let x=-84;x<=84;x++)for(let z=-62;z<=62;z++){
  const r=rho(x,z);if(r>=1)continue;
  let top=Math.round((38*Math.exp(-(((x+8)/40)**2)-(((z+40)/15)**2))+10*Math.exp(-(((x-37)/11)**2)-(((z+31)/8)**2))+(n2(x*.15,z*.15)-.5)*2.4)*sstep(-20,-28,z));

  for(let y=-Math.round(dep);y<top;y++)V.set(x,y,z,y>0?(((y/3)|0)%2?0xb9905e:0xa57c4e):strata(x,y,z));
  V.set(x,top,z,surf(x,z,top,sh));tops[ti(x,z)]=top;
}

/* ---------- flora & props ---------- */
function palm(v,x,y,z,h,s=0){const bx=(hash3(x,s+1,z)-.5)*3.4,bz=(hash3(x,s+2,z)-.5)*3.4;let tx=x,tz=z;
  for(let i=0;i<h;i++){const k=(i/h)**2;tx=Math.round(x+bx*k);tz=Math.round(z+bz*k);v.set(tx,y+i,tz,i%2?0x9b7a55:0x86684a)}
  const ty=y+h-1;v.set(tx,ty+1,tz,0x4b8f45);
  for(let k=0;k<8;k++){const a=k*Math.PI/4+s*.7,L=4+(k&1),ca=Math.cos(a),sa=Math.sin(a);
    for(let i=1;i<=L;i++){const yy=ty+1+Math.round(1.5*Math.sin(Math.min(i,2)*.785)-Math.max(0,i-2)*.95),px=tx+Math.round(ca*i),pz=tz+Math.round(sa*i);
      v.set(px,yy,pz,[0x4f9a48,0x3f8842,0x68b254][(i+k)%3]);if(i>=3)v.set(px,yy-1,pz,(i+k)%2?0x5aa64c:0x76bd5e);if(i===L)v.set(px,yy-2,pz,0x82c468)}}

function jac(x,y,z){for(let i=0;i<4;i++)V.set(x,y+i,z,0x6a4b3a);V.set(x+1,y+3,z,0x6a4b3a);
  for(let a=-3;a<=3;a++)for(let b=-2;b<=2;b++)for(let c=-3;c<=3;c++){const d=a*a+b*b*1.9+c*c,h=hash3(x+a,y+b,z+c);
    if(d<=8.5&&h>.12&&!(d>5&&h<.45))V.set(x+a,y+5+b,z+c,[0x9b80e2,0xb59af0,0x8469d0,0xc9aef8][(h*40|0)%4])}
  for(let k=0;k<5;k++)V.set(x+(hash3(x,k,z)*7-3|0),y-1,z+(hash3(z,k,x)*7-3|0),0xb9a0ee);}
function lamp(x,z){B(x,1,z,x,5,z,0x403c4a);glow('warm',x,6,z,.95)}
function umb(x,z,c){B(x,1,z,x,2,z,0xf5f0e6);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)V.set(x+a,3,z+b,(a+b)&1?0xffffff:c);V.set(x,4,z,c);V.set(x+2,0,z,c);V.set(x+2,0,z+1,0xffffff)}
const people=[];const addP=(x,z,y,amp,ax,ph)=>people.push({x,z,y,amp,ax,ph:ph??rnd(),c:new THREE.Color().setHSL(rnd(),.5,.62),s:new THREE.Color([0xf2c9a4,0xd9a47c,0xa8744e,0xf7d9bd][rnd()*4|0])});

/* ---------- HOLLYWOOD sign ---------- */
const FONT={H:['10001','10001','10001','11111','10001','10001','10001'],O:['01110','10001','10001','10001','10001','10001','01110'],L:['10000','10000','10000','10000','10000','10000','11111'],
  Y:['10001','10001','01010','00100','00100','00100','00100'],W:['10001','10001','10001','10101','10101','11011','10001'],D:['11110','10001','10001','10001','10001','10001','11110']};
const signLights=[];
[...'HOLLYWOOD'].forEach((ch,i)=>{const x0=-37+Math.round(i*6.5),zs=-35;let base=99;for(let a=0;a<5;a++)base=Math.min(base,gh(x0+a,zs+1));
  base+=1+[0,1,0,-1,0,1,0,0,1][i];
  for(let y=0;y<10;y++){const row=FONT[ch][6-Math.floor(y*.7)];for(let a=0;a<5;a++)if(row[a]==='1')B(x0+a,base+y,zs,x0+a,base+y,zs+1,y%4===3?0xf7ead0:0xfff5df)}
  if(i%2===0){const lx=x0+2,ly=gh(lx,zs+5)+1;glow('warm',lx,ly,zs+5,.8);signLights.push([lx,ly+1.5,zs+5])}});

/* ---------- Griffith Observatory ---------- */
{const cx=37,cz=-31,by=16;B(cx-10,1,cz-5,cx+10,by,cz+5,0xe6dccb);B(cx-11,by,cz+5,cx+11,by,cz+6,0xf4eee2);
  B(cx-8,by+1,cz-3,cx+8,by+4,cz+3,0xf6f1e8);for(let x=cx-7;x<=cx+7;x+=2)B(x,by+2,cz+3,x,by+3,cz+3,x%4?0x8fa6bd:0xffdf9e);
  B(cx-9,by+5,cz-4,cx+9,by+5,cz+4,0xe9e2d4);cyl(cx,cz,4.3,by+1,by+7,0xf8f4ec);dome(cx,by+8,cz,4);V.set(cx,by+13,cz,0xd9b24e);

  B(cx-2,by+1,cz+4,cx+2,by+3,cz+4,0x5a4a52);B(cx,by+1,cz+8,cx,by+6,cz+8,0xfbf7ee);for(let i=0;i<4;i++)B(cx-3,by-i,cz+6+i,cx+3,by-i,cz+6+i,0xdcd2c2);

/* ---------- Hollywood Bowl ---------- */
{const cx=-46,cz=-25;clearA(cx-11,cz-8,cx+11,cz+4,0xb98a5e);pave(cx-13,-21,cx+13,-8,0xcdbf9f);
  for(let k=0;k<5;k++){const R=10-k*1.7,zz=cz+2-k*2;for(let a=-10;a<=10;a++)for(let b=0;b<=10;b++){const d=Math.hypot(a,b);if(d<=R+.3&&d>R-1.4)B(cx+a,1+b,zz-1,cx+a,1+b,zz,k%2?0xe9e2d4:0xfaf6ee)}}

  for(let a=-13;a<=13;a++)for(let b=1;b<=13;b++){const d=Math.hypot(a,b),r=Math.round(d);if(r>=4&&r<=13&&Math.abs(a)<b*2.2+3){const hh=1+((r-4)/3|0);

  for(let i=0;i<10;i++)addP(cx-6+i*1.3,cz+1,1,.3,0);}

/* ---------- Chinese Theatre ---------- */

{const cx=TH;pave(cx-12,-21,cx+12,-7,0xd8c9b8);B(cx-9,1,-20,cx+9,8,-13,0xb23a32);
  B(cx-10,1,-12,cx-7,6,-9,0xa8322c);B(cx+7,1,-12,cx+10,6,-9,0xa8322c);B(cx-11,7,-13,cx-6,7,-8,0x4c9079);B(cx+6,7,-13,cx+11,7,-8,0x4c9079);

  B(cx-4,1,-12,cx-3,9,-11,0xc8443a);B(cx+3,1,-12,cx+4,9,-11,0xc8443a);B(cx-4,10,-12,cx+4,10,-11,0xe0b040);
  B(cx-2,1,-12,cx+2,5,-12,0x3a2420);B(cx-2,6,-12,cx+2,7,-12,0xe0b040);B(cx-1,1,-12,cx+1,4,-12,0x7a1f24);
  for(let x=cx-8;x<=cx+8;x+=4){B(x,3,-12,x,6,-12,0xe0b040);glow('warm',x,8,-12,.5)}
  for(let z=-11;z<=-4;z++)for(let x=cx-1;x<=cx+1;x++)V.set(x,0,z,0xc81e2e);
  for(let z=-10;z<=-7;z+=3)for(const s of[-2,2]){V.set(cx+s,1,z,0xe0b040);glow('warm',cx+s,2,z,.35)}
  for(let i=0;i<8;i++)addP(cx+(i%2?3:-3)+rnd(),-10+i*.6,1,.25,0);for(let i=0;i<3;i++)addP(cx,-9,1,2,1,i/3);
