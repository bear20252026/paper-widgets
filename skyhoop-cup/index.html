<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyhoop Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#150f2b;--pan:#221841;--pan2:#2c2054;--line:#4a3a86;--txt:#efe9ff;--dim:#b9aee0;--teal:#3fd6c0;--gold:#f2c14e;--vio:#9a6cf0;--red:#ff6b7d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'VT323',ui-monospace,monospace;font-size:19px;line-height:1.15;overflow-x:hidden}
body{display:flex;flex-direction:column}
#app{display:flex;flex:1;min-height:0;width:100%}
#left{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;background:#0d0920;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{pointer-events:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--gold);font-family:'Silkscreen',monospace;font-size:14px}
#panel{width:372px;flex:none;background:var(--pan);border-left:3px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:10px 12px 28px}
h1{font-family:'Silkscreen',monospace;font-size:19px;margin:2px 0 2px;color:var(--gold);letter-spacing:1px;text-shadow:2px 2px 0 #5b2ea6}
.sub{color:var(--dim);margin:0 0 8px;font-size:17px}
h2{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1px;color:var(--teal);margin:14px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--line);text-transform:uppercase}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
.row>label{flex:0 0 88px;color:var(--dim)}
.row>select,.row>input[type=range]{flex:1;min-width:0}
select,button{font-family:'VT323',monospace;font-size:19px;color:var(--txt);background:var(--pan2);border:2px solid var(--line);border-radius:3px;padding:3px 7px;min-height:32px}
select option{background:#2c2054;color:#efe9ff}
button{cursor:pointer;box-shadow:0 2px 0 #120b26;transition:background .12s,border-color .12s,transform .05s}
button:hover{background:#3a2a72;border-color:var(--vio)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.on{background:#1f6f68;border-color:var(--teal);color:#fff}
button.gold{background:#7a5a12;border-color:var(--gold);color:#fff6d8}
button.gold:hover{background:#96701a}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:5px 0}
.btns.c4{grid-template-columns:repeat(4,1fr)}
.btns.c3{grid-template-columns:repeat(3,1fr)}
input[type=range]{accent-color:var(--teal);height:24px}
.chk{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;color:var(--txt);cursor:pointer}
.chk input{accent-color:var(--teal);width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-size:18px}
td,th{padding:2px 5px;border-bottom:1px solid #3a2d6b;text-align:center}
th{font-family:'Silkscreen',monospace;font-size:10px;color:var(--gold);font-weight:400}
td:first-child,th:first-child{text-align:left;color:var(--dim)}
#log{height:150px;overflow-y:auto;background:#160f2e;border:2px solid var(--line);border-radius:3px;padding:5px 7px;font-size:17px;color:var(--dim)}
#log b{color:var(--gold);font-weight:400}
#log div{margin-bottom:2px}
.keys{color:var(--dim);font-size:16px;margin-top:6px}
.keys kbd{font-family:'Silkscreen',monospace;font-size:9px;background:#160f2e;border:1px solid var(--line);border-radius:2px;padding:1px 4px;color:var(--txt)}
#pad{display:none;background:#1b1336;border-top:3px solid var(--line);padding:8px 10px;gap:10px;justify-content:space-between;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
#pad .dp{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,42px);gap:4px}
#pad button{font-family:'Silkscreen',monospace;font-size:11px;padding:0;min-height:42px;touch-action:none}
#pad .act{display:grid;grid-template-columns:repeat(2,minmax(54px,70px));grid-template-rows:repeat(2,52px);gap:6px}
#pad button.hold{background:#1f6f68;border-color:var(--teal)}
@media (max-width:860px),(pointer:coarse) and (max-width:1100px){
  html,body{height:auto}
  #app{flex-direction:column}
  #stage{flex:none;height:56vh;min-height:300px}
  #panel{width:100%;border-left:0;border-top:3px solid var(--line);overflow:visible}
  #pad{display:flex}
}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
      <div id="err"></div>
    </div>
    <div id="pad">
      <div class="dp">
        <span></span><button data-k="up">▲</button><span></span>
        <button data-k="left">◀</button><button data-k="auto" id="padAuto">G</button><button data-k="right">▶</button>
        <span></span><button data-k="down">▼</button><span></span>
      </div>
      <div class="act">
        <button data-k="climb">UP</button><button data-k="boost">BOOST</button>
        <button data-k="dive">DN</button><button data-k="act" class="gold">ACT</button>
      </div>
    </div>
  </div>
  <aside id="panel">
    <h1>SKYHOOP CUP</h1>
    <p class="sub">Broomstick hoops over the floating isle</p>

    <h2>Match</h2>
    <div class="row"><label for="selLen">Length</label><select id="selLen"><option value="quick">Quick · 3:30</option><option value="standard">Standard · 6:00</option><option value="long">Long · 9:00</option></select></div>
    <div class="row"><label for="selHome">Your team</label><select id="selHome"></select></div>
    <div class="row"><label for="selAway">Rival</label><select id="selAway"></select></div>
    <div class="row"><label for="selRole">Your role</label><select id="selRole"><option value="0">Chaser</option><option value="3">Beater</option><option value="5">Keeper</option><option value="6">Seeker</option></select></div>
    <div class="row"><label for="selStr">Rival level</label><select id="selStr"><option value="0.8">Novice</option><option value="1" selected>League</option><option value="1.15">Elite</option><option value="1.3">Legend</option></select></div>
    <div class="btns"><button id="btnNew" class="gold">New match</button><button id="btnSkip">Skip to end</button></div>
    <div class="row"><label for="selSpeed">Speed</label><select id="selSpeed"><option value="0.5">Slow ×0.5</option><option value="1" selected>Normal ×1</option><option value="2">Fast ×2</option><option value="4">Rush ×4</option></select></div>
    <div class="row"><label class="chk" style="flex:1"><input type="checkbox" id="chkNext" checked>Auto-next match</label><button id="btnPause">Pause</button></div>

    <h2>World</h2>
    <div class="row"><label for="selTurf">Turf</label><select id="selTurf"><option value="0">Grass</option><option value="1">Meadow</option><option value="2">Sand</option><option value="3">Snow</option><option value="4">Moss</option></select></div>
    <div class="row"><label for="selWeather">Weather</label><select id="selWeather"><option value="0">Clear</option><option value="1">Windy</option><option value="2">Rain</option><option value="3">Snow</option></select></div>
    <div class="row"><label for="selLight">Light</label><select id="selLight"><option value="0">Day</option><option value="1">Dusk</option><option value="2">Night</option></select></div>

    <h2>Coach</h2>
    <div class="row"><label for="selTactic">Tactic</label><select id="selTactic"><option value="0">Balanced</option><option value="1">Press high</option><option value="2">Hold deep</option></select></div>
    <div class="btns"><button id="cmdAll" data-cmd="allin">All in</button><button id="cmdBack" data-cmd="back">Fall back</button><button id="cmdSeek" data-cmd="seeker">Hit seeker</button><button id="cmdFree" data-cmd="free">Free beaters</button></div>

    <h2>Camera</h2>
    <div class="btns c4" id="camBtns"><button data-cam="0" class="on">Action</button><button data-cam="1">Follow</button><button data-cam="2">Pitch</button><button data-cam="3">Island</button></div>
    <div class="row"><label for="rngRot">Rotate</label><input type="range" id="rngRot" min="-180" max="180" value="35" step="1"></div>
    <div class="row"><label for="rngZoom">Zoom</label><input type="range" id="rngZoom" min="50" max="220" value="100" step="1"></div>
    <div class="row"><label for="rngPix">Pixel size</label><input type="range" id="rngPix" min="1" max="6" value="2" step="1"></div>
    <div>
      <label class="chk"><input type="checkbox" id="chkOutline" checked>Outlines</label>
      <label class="chk"><input type="checkbox" id="chkPal" checked>Palette</label>
      <label class="chk"><input type="checkbox" id="chkDither" checked>Dither</label>
      <label class="chk"><input type="checkbox" id="chkShadow" checked>Shadows</label>
      <label class="chk"><input type="checkbox" id="chkLift" checked>Doll's-house lift</label>
      <label class="chk"><input type="checkbox" id="chkTags" checked>Tags</label>
      <label class="chk"><input type="checkbox" id="chkSound" checked>Sound</label>
    </div>

    <h2>Team stats</h2>
    <table id="stats"></table>

    <h2>Match log</h2>
    <div id="log"></div>

    <p class="keys"><kbd>ARROWS</kbd>/<kbd>WASD</kbd> fly · <kbd>R</kbd> climb · <kbd>F</kbd> dive · <kbd>SHIFT</kbd> boost · <kbd>SPACE</kbd> act · <kbd>G</kbd> coach on/off · <kbd>TAB</kbd> switch · <kbd>P</kbd> pause · <kbd>N</kbd> new · <kbd>K</kbd> skip · <kbd>X</kbd> turf · <kbd>O</kbd> light · <kbd>C</kbd> weather · <kbd>1</kbd>-<kbd>4</kbd> cameras</p>
  </aside>
</div>
<script>
/* ===== Skyhoop Cup · core engine ===== */
const $=id=>document.getElementById(id);
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const wr=mulberry(771177),wrr=(a,b)=>a+(b-a)*wr(),wpick=a=>a[Math.floor(wr()*a.length)];
const rnd=Math.random,rr=(a,b)=>a+(b-a)*Math.random();
if(!window.THREE){const e=$('err');e.style.display='flex';e.textContent='three.js could not be loaded. Check your connection and reload.';throw new Error('three.js missing');}
const V3=THREE.Vector3;
function shade(c,f){const r=clamp(Math.round((c>>16&255)*f),0,255),g=clamp(Math.round((c>>8&255)*f),0,255),b=clamp(Math.round((c&255)*f),0,255);return r<<16|g<<8|b}
function mixc(a,b,t){const r=Math.round(lerp(a>>16&255,b>>16&255,t)),g=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));return r<<16|g<<8|bl}
const css=c=>'#'+('000000'+c.toString(16)).slice(-6);

/* --- fixed 90-colour OKLab palette + 32^3 LUT --- */
function oklab2rgb(L,a,b){const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;const l=l_*l_*l_,m=m_*m_*m_,s=s_*s_*s_;
  const f=x=>{x=clamp(x,0,1);return x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055};
  return[f(4.0767416621*l-3.3077115913*m+0.2309699292*s),f(-1.2684380046*l+2.6097574011*m-0.3413193965*s),f(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]}
function rgb2oklab(r,g,b){const f=x=>x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);r=f(r);g=f(g);b=f(b);
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return[0.2104542553*l+0.7936177850*m-0.0040720468*s,1.9779984951*l-2.4285922050*m+0.4505937099*s,0.0259040371*l+0.7827717662*m-0.8086757660*s]}
const PALETTE=(()=>{const out=[],hues=[25,55,90,135,170,205,255,290,320,355],Ls=[.22,.32,.42,.52,.62,.72,.82,.91];
  for(const h0 of hues)for(const L of Ls){const h=(h0+(290-h0)*.22*(1-L))*PI/180,C=.155*Math.pow(Math.sin(PI*clamp((L-.06)/.92,0,1)),.75)+.012;out.push(oklab2rgb(L,C*Math.cos(h),C*Math.sin(h)))}
  for(let i=0;i<10;i++){const L=.1+i*.098,h=290*PI/180,C=.022;out.push(oklab2rgb(L,C*Math.cos(h),C*Math.sin(h)))}
  return out})();
const lutTex=(()=>{const N=32,labs=PALETTE.map(c=>rgb2oklab(c[0],c[1],c[2])),d=new Uint8Array(N*N*N*4);
  for(let b=0;b<N;b++)for(let g=0;g<N;g++)for(let r=0;r<N;r++){const q=rgb2oklab(r/31,g/31,b/31);let best=0,bd=1e9;
    for(let i=0;i<labs.length;i++){const p=labs[i],dl=(q[0]-p[0])*1.15,da=q[1]-p[1],db=q[2]-p[2],dd=dl*dl+da*da+db*db;if(dd<bd){bd=dd;best=i}}
    const o=(g*N*N+b*N+r)*4,c=PALETTE[best];d[o]=c[0]*255;d[o+1]=c[1]*255;d[o+2]=c[2]*255;d[o+3]=255}
  const t=new THREE.DataTexture(d,N*N,N,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();

/* --- renderer, scene, post --- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-50,50,50,-50,1,1700);
let rt=null,RW=2,RH=2,pxSize=2;
const postMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
  uniforms:{tD:{value:null},tZ:{value:null},tL:{value:lutTex},res:{value:new THREE.Vector2(2,2)},outl:{value:1},dith:{value:1},pal:{value:1},eth:{value:.001},stars:{value:0},time:{value:0},skyA:{value:new THREE.Color()},skyB:{value:new THREE.Color()},inkC:{value:new THREE.Color(0x221640)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`precision highp float;
uniform sampler2D tD,tZ,tL;uniform vec2 res;uniform float outl,dith,pal,eth,stars,time;uniform vec3 skyA,skyB,inkC;varying vec2 vUv;
float b2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
float h21(vec2 p){p=fract(p*vec2(.1031,.1030)+.31);p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
void main(){
  vec2 px=floor(vUv*res),uv=(px+.5)/res,t=1./res;
  vec4 c=texture2D(tD,uv);float d=texture2D(tZ,uv).x;
  vec3 sky=mix(skyB,skyA,smoothstep(0.,1.,uv.y));
  float tw=h21(px);float st=step(.9965,tw)*stars*(.55+.45*sin(time*2.5+tw*900.));
  sky+=vec3(st*.9,st*.85,st);
  vec3 col=sky*(1.-clamp(c.a,0.,1.))+c.rgb;
  if(outl>.5){
    float m=max(max(texture2D(tZ,uv+vec2(t.x,0.)).x,texture2D(tZ,uv-vec2(t.x,0.)).x),max(texture2D(tZ,uv+vec2(0.,t.y)).x,texture2D(tZ,uv-vec2(0.,t.y)).x));
    col=mix(col,inkC,step(eth,m-d)*.66);
  }
  if(dith>.5)col+=(b4(px)-.47)*.09;
  col=clamp(col,0.,1.);
  if(pal>.5){vec3 q=floor(col*31.+.5);col=texture2D(tL,vec2((q.b*32.+q.r+.5)/1024.,(q.g+.5)/32.)).rgb;}
  gl_FragColor=vec4(col,1.);
}`});
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
{const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat);q.frustumCulled=false;postScene.add(q)}
const hudC=$('hud'),hctx=hudC.getContext('2d');let HW=2,HH=2,HS=1;
function resize(){const st=$('stage'),w=Math.max(2,st.clientWidth),h=Math.max(2,st.clientHeight);
  renderer.setSize(w,h,false);RW=Math.max(2,Math.round(w/pxSize));RH=Math.max(2,Math.round(h/pxSize));
  if(rt)rt.dispose();
  rt=new THREE.WebGLRenderTarget(RW,RH,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,stencilBuffer:false});
  rt.depthTexture=new THREE.DepthTexture(RW,RH);rt.depthTexture.type=renderer.capabilities.isWebGL2?THREE.UnsignedIntType:THREE.UnsignedShortType;
  postMat.uniforms.tD.value=rt.texture;postMat.uniforms.tZ.value=rt.depthTexture;postMat.uniforms.res.value.set(RW,RH);
  HS=Math.min(2,window.devicePixelRatio||1);HW=w;HH=h;hudC.width=Math.round(w*HS);hudC.height=Math.round(h*HS);}

/* --- camera rig: ortho, 850 m from target, far 1700 --- */
const CAM={mode:0,az:35*PI/180,zoom:1,tilt:.62,view:92,cur:new V3(0,10,0),tgt:new V3(0,10,0),viewCur:92,tiltCur:.62,dir:new V3()};
function placeCam(){const a=CAM.az,t=CAM.tiltCur;CAM.dir.set(Math.sin(a)*Math.cos(t),Math.sin(t),Math.cos(a)*Math.cos(t));
  cam.position.copy(CAM.cur).addScaledVector(CAM.dir,850);cam.up.set(0,1,0);cam.lookAt(CAM.cur);
  const asp=RW/RH,hv=Math.max(CAM.viewCur/2,CAM.viewCur*.42/asp);cam.left=-hv*asp;cam.right=hv*asp;cam.top=hv;cam.bottom=-hv;cam.near=1;cam.far=1700;
  cam.updateProjectionMatrix();cam.updateMatrixWorld(true);
  postMat.uniforms.eth.value=((2*hv/RH)*1.7/Math.max(.2,Math.tan(t))+.75)/1700;}

/* --- lights + time of day --- */
const sun=new THREE.DirectionalLight(0xffffff,1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
{const sc=sun.shadow.camera;sc.left=-200;sc.right=200;sc.top=200;sc.bottom=-200;sc.near=10;sc.far=900;sun.shadow.bias=-.0012;sun.shadow.normalBias=.5}
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,.6);
scene.add(sun,sun.target,hemi);
const TODS=[
 {n:'Day',skyA:0x6274e6,skyB:0xc3ccff,sun:0xfff0d4,si:.8,hs:0xbcc2ff,hg:0x6a5aa0,hi:.56,dir:[.48,.78,.4],lamp:.3,glass:.45,stars:0,night:0,ink:0x2a1d52},
 {n:'Dusk',skyA:0x5b3fae,skyB:0xff9fc6,sun:0xff9d7c,si:.78,hs:0xc9a0ff,hg:0x553678,hi:.58,dir:[-.78,.34,.5],lamp:1.05,glass:1.15,stars:.4,night:.6,ink:0x24143f},
 {n:'Night',skyA:0x100a36,skyB:0x2c2174,sun:0x93a6ff,si:.5,hs:0x7478e0,hg:0x2e2666,hi:.7,dir:[.36,.7,-.5],lamp:1.2,glass:1.3,stars:1,night:1,ink:0x0c0726}];
const LIT={i:0,lamp:.3,glass:.45,night:0,stars:0,si:.92,hi:.66,dir:new V3(.48,.78,.4).normalize(),c:{}};
['skyA','skyB','sun','hs','hg','ink'].forEach(k=>LIT.c[k]=new THREE.Color(TODS[0][k]));
const _tc=new THREE.Color(),_td=new V3();
const MATS={
  std:new THREE.MeshLambertMaterial({vertexColors:true}),
  dbl:new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}),
  glass:new THREE.MeshBasicMaterial({vertexColors:true}),
  lamp:new THREE.MeshBasicMaterial({vertexColors:true}),
  glow:new THREE.MeshBasicMaterial({vertexColors:true})};
function updateTOD(dt){const T=TODS[LIT.i],k=Math.min(1,dt*1.6);
  for(const n in LIT.c)LIT.c[n].lerp(_tc.setHex(T[n]),k);
  for(const n of['lamp','glass','night','stars','si','hi'])LIT[n]=lerp(LIT[n],T[n],k);
  LIT.dir.lerp(_td.set(T.dir[0],T.dir[1],T.dir[2]).normalize(),k).normalize();
  sun.color.copy(LIT.c.sun);sun.intensity=LIT.si;hemi.color.copy(LIT.c.hs);hemi.groundColor.copy(LIT.c.hg);hemi.intensity=LIT.hi;

function setPause(p){G.paused=p;$('btnPause').textContent=p?'Resume':'Pause';$('btnPause').classList.toggle('on',p)}
function cyc(id){const s=$(id);s.selectedIndex=(s.selectedIndex+1)%s.options.length;s.dispatchEvent(new Event('change'))}
function syncUI(){$('padAuto').classList.toggle('on',G.auto);for(const b of document.querySelectorAll('[data-cmd]'))b.classList.toggle('on',!!G.cmd[b.dataset.cmd])}
function nextMatch(){const h=+$('selHome').value;let a=(+$('selAway').value+1)%TEAMS.length;if(a===h)a=(a+1)%TEAMS.length;$('selAway').value=a;newMatch()}
window.addEventListener('keydown',e=>{const tg=e.target&&e.target.tagName;if(tg==='SELECT'||tg==='INPUT'||tg==='TEXTAREA')return;if(e.ctrlKey||e.metaKey||e.altKey)return;auInit();const c=e.code;
  if(FLY[c]||c==='Tab')e.preventDefault();
  if(FLY[c]){if(!KEYS[c]&&c==='Space')INPUT.act=true;KEYS[c]=true;takeOver();return}
  if(e.repeat)return;
  if(c==='KeyG')toggleAuto();else if(c==='Tab')switchFlier();else if(c==='KeyP')setPause(!G.paused);else if(c==='KeyN')newMatch();else if(c==='KeyK')skipMatch();
  else if(c==='KeyX')cyc('selTurf');else if(c==='KeyO')cyc('selLight');else if(c==='KeyC')cyc('selWeather');else if(c>='Digit1'&&c<='Digit4')setCam(+c.slice(5)-1)});
window.addEventListener('keyup',e=>{KEYS[e.code]=false});
window.addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;for(const k in PADK)PADK[k]=false});
function readInput(){const k=KEYS,p=PADK;INPUT.x=((k.ArrowRight||k.KeyD||p.right)?1:0)-((k.ArrowLeft||k.KeyA||p.left)?1:0);INPUT.z=((k.ArrowUp||k.KeyW||p.up)?1:0)-((k.ArrowDown||k.KeyS||p.down)?1:0);INPUT.y=((k.KeyR||p.climb)?1:0)-((k.KeyF||p.dive)?1:0);INPUT.boost=!!(k.ShiftLeft||k.ShiftRight||p.boost)}
for(const b of document.querySelectorAll('#pad button')){const key=b.dataset.k;
  const down=e=>{e.preventDefault();auInit();if(key==='auto'){toggleAuto();return}takeOver();if(key==='act')INPUT.act=true;else PADK[key]=true;b.classList.add('hold');try{b.setPointerCapture(e.pointerId)}catch(_){}},up=e=>{PADK[key]=false;b.classList.remove('hold')};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);b.addEventListener('contextmenu',e=>e.preventDefault())}
{const st=$('stage');let drag=null;
  st.addEventListener('pointerdown',e=>{auInit();const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x>=HUDBTN.x&&x<=HUDBTN.x+HUDBTN.w&&y>=HUDBTN.y&&y<=HUDBTN.y+HUDBTN.h){toggleAuto();return}drag={x:e.clientX,az:CAM.az};try{st.setPointerCapture(e.pointerId)}catch(_){}});
  st.addEventListener('pointermove',e=>{if(!drag)return;CAM.az=drag.az-(e.clientX-drag.x)*.006;let d=Math.round(CAM.az*180/PI);d=((d+180)%360+360)%360-180;$('rngRot').value=d});
  const end=()=>{drag=null};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('wheel',e=>{e.preventDefault();const z=$('rngZoom');z.value=clamp(+z.value-Math.sign(e.deltaY)*8,+z.min,+z.max);CAM.zoom=z.value/100},{passive:false})}
/* panel */
TEAMS.forEach((t,i)=>{for(const id of['selHome','selAway']){const o=document.createElement('option');o.value=i;o.textContent=t.n;$(id).appendChild(o)}});$('selHome').value=0;$('selAway').value=1;
$('selHome').addEventListener('change',()=>{if($('selAway').value===$('selHome').value)$('selAway').value=(+$('selHome').value+1)%TEAMS.length;newMatch()});
$('selAway').addEventListener('change',()=>{if($('selAway').value===$('selHome').value)$('selAway').value=(+$('selHome').value+1)%TEAMS.length;newMatch()});
$('selLen').addEventListener('change',newMatch);$('selStr').addEventListener('change',newMatch);
$('selRole').addEventListener('change',()=>{G.me=+$('selRole').value;const f=G.fl[G.me];if(f)caption(ROLEN[f.role].toUpperCase()+' '+f.num,1.2)});
$('btnNew').addEventListener('click',()=>{auInit();newMatch()});$('btnSkip').addEventListener('click',skipMatch);$('btnPause').addEventListener('click',()=>setPause(!G.paused));
$('selSpeed').addEventListener('change',()=>{simSpeed=+$('selSpeed').value});
$('selTurf').addEventListener('change',()=>paintPitch(+$('selTurf').value));
$('selWeather').addEventListener('change',()=>{FX.weather=+$('selWeather').value});
$('selLight').addEventListener('change',()=>{LIT.i=+$('selLight').value});
$('selTactic').addEventListener('change',()=>{G.tactic=+$('selTactic').value});
for(const b of document.querySelectorAll('[data-cmd]'))b.addEventListener('click',()=>{const k=b.dataset.cmd;G.cmd[k]=!G.cmd[k];if(G.cmd[k]){if(k==='allin')G.cmd.back=false;if(k==='back')G.cmd.allin=false;if(k==='seeker')G.cmd.free=false;if(k==='free')G.cmd.seeker=false}
  logEv('Coach: '+b.textContent+(G.cmd[k]?' ON':' off'));syncUI()});
for(const b of $('camBtns').children)b.addEventListener('click',()=>setCam(+b.dataset.cam));
$('rngRot').addEventListener('input',()=>{CAM.az=+$('rngRot').value*PI/180});
$('rngZoom').addEventListener('input',()=>{CAM.zoom=+$('rngZoom').value/100});
$('rngPix').addEventListener('input',()=>{pxSize=+$('rngPix').value;resize()});
$('chkOutline').addEventListener('change',e=>{postMat.uniforms.outl.value=e.target.checked?1:0});
$('chkPal').addEventListener('change',e=>{postMat.uniforms.pal.value=e.target.checked?1:0});
$('chkDither').addEventListener('change',e=>{postMat.uniforms.dith.value=e.target.checked?1:0});
$('chkShadow').addEventListener('change',e=>{sun.castShadow=e.target.checked});
$('chkLift').addEventListener('change',e=>{liftOn=e.target.checked});
$('chkTags').addEventListener('change',e=>{showTags=e.target.checked});
$('chkSound').addEventListener('change',e=>{AU.on=e.target.checked;if(AU.on)auInit();if(AU.master)AU.master.gain.value=AU.on?.5:0});
function drawStats(){if(!G.stats)return;const s=G.stats,T=G.teams,tot=(s[0].poss+s[1].poss)||1,pc=i=>Math.round(s[i].poss/tot*100)+'%';
  const rows=[['Score',G.score[0],G.score[1]],['Goals',s[0].goals,s[1].goals],['Shots',s[0].shots,s[1].shots],['Saves',s[0].saves,s[1].saves],['Passes',s[0].passes,s[1].passes],['Tackles',s[0].tackles,s[1].tackles],['Bludger hits',s[0].hits,s[1].hits],['Possession',pc(0),pc(1)]];
  $('stats').innerHTML='<tr><th></th><th style="color:'+css(mixc(T[0].c,0xffffff,.4))+'">'+T[0].s+'</th><th style="color:'+css(mixc(T[1].c,0xffffff,.4))+'">'+T[1].s+'</th></tr>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}

/* main loop */
let lastT=performance.now(),accT=0,gt=0,statT=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.1,Math.max(0,(now-lastT)/1000));lastT=now;gt+=dt;
  readInput();
  if(!G.paused){accT+=dt*simSpeed;let n=0;while(accT>=DT&&n<30){simStep();accT-=DT;n++}if(n>=30)accT=0;
    if(G.phase==='final'&&G.pt>9&&$('chkNext').checked)nextMatch()}
  updateCam(dt);updateTOD(dt);updateLifts(dt);syncActors(dt,gt);updateFX(gt,dt);
  postMat.uniforms.time.value=gt;
  if(AU.crowd&&AU.ctx)AU.crowd.gain.value=AU.on&&!G.paused?.035+FX.cheer*.16:0;
  renderer.setRenderTarget(rt);renderer.clear();renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  drawHUD();statT-=dt;if(statT<=0){statT=.5;drawStats()}}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));
resize();placeCam();newMatch();syncUI();drawStats();requestAnimationFrame(frame);
/* headless test hook: run matches without rendering */
window.__skyhoop={G,simStep,newMatch,skipMatch,
  run(seconds){const q=G.quiet;G.quiet=true;const n=Math.round(seconds*60);for(let i=0;i<n&&G.phase!=='final';i++)simStep();G.quiet=q;return this.summary()},
  bot(matches){const out=[];const q=G.quiet;G.quiet=true;for(let m=0;m<(matches||5);m++){newMatch();let n=0;while(G.phase!=='final'&&n++<90000)simStep();out.push(this.summary())}G.quiet=q;newMatch();return out},
  summary(){return{phase:G.phase,time:+G.t.toFixed(1),score:G.score.slice(),goals:G.stats[0].goals+G.stats[1].goals,endBy:G.endBy,winner:G.winner,meshes:(()=>{let n=0;scene.traverse(o=>{if(o.isMesh||o.isPoints||o.isLine)n++});return n})()}}};
</script>
