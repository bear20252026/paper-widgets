<style>
:root {
  --ink: #16141d; --ink2: #3a3646; --mute: #8b8799; --mute2: #b4b0c2;

}
* { box-sizing: border-box; }

canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
#hud { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
#hud .hit { pointer-events: auto; }

/* brand + live pill */
.brand { position: absolute; left: 28px; top: 20px; display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; display: block; filter: drop-shadow(0 2px 6px rgba(123, 60, 240, .28)); }
.live { position: absolute; right: 26px; top: 20px; display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 11px; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid var(--line); font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(30, 20, 60, .05); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px rgba(123, 60, 240, .16); animation: blink 2.2s ease-in-out infinite; }
body.capmode .live i { animation: none; }
body.capmode *, body.capmode *::before { transition: none !important; }
@keyframes blink { 50% { opacity: .35; } }

/* title block */
.head { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.head .model { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.head .model b { color: var(--acc); font-weight: 700; }
.head h1 { margin: 5px 0 0; font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -.025em; }
.head .bar { width: 58px; height: 3px; border-radius: 2px; margin: 11px auto 0; background: linear-gradient(90deg, rgba(123,60,240,.15), var(--acc) 30%, var(--acc) 70%, rgba(123,60,240,.15)); }
.head .date { margin-top: 8px; font: 500 11.5px var(--mono); color: var(--mute); letter-spacing: .02em; }

/* mode pills */
.pills { position: absolute; left: 50%; top: 141px; transform: translateX(-50%); display: flex; gap: 8px; white-space: nowrap; }
.pill { display: flex; align-items: center; gap: 7px; height: 27px; padding: 0 13px 0 9px; border-radius: 999px; background: rgba(255,255,255,.82); border: 1px solid var(--line); font: 600 11.5px var(--sans); color: var(--ink2); cursor: pointer; transition: border-color .25s, background .25s, color .25s, box-shadow .25s; box-shadow: 0 1px 4px rgba(30, 20, 60, .04); }
.pill svg { width: 13px; height: 13px; flex: none; }

.pill svg path { fill: currentColor; opacity: .7; }
.pill:hover { border-color: var(--line2); color: var(--ink); }
.pill.on { border-color: var(--accLine); background: rgba(246, 240, 255, .95); color: var(--acc); box-shadow: 0 0 0 3px rgba(123, 60, 240, .07); }
.pill.on svg circle, .pill.on svg path { opacity: 1; }

/* left navigation */
.nav { position: absolute; left: 44px; top: 33%; width: 190px; }
.nav .it { position: relative; padding: 4px 0 4px 16px; font-size: 12.5px; font-weight: 600; color: var(--mute2); cursor: pointer; transition: color .3s; }
.nav .it::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--ink); opacity: 0; transition: opacity .3s; }
.nav .it.on { color: var(--ink); }
.nav .it.on::before { opacity: 1; }
.nav .it .sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; font: 500 10.5px var(--sans); color: var(--mute); }
.nav .it .sub > div { overflow: hidden; }
.nav .it .sub span { display: block; padding: 3px 0 0 9px; }
.nav .it.on .sub { grid-template-rows: 1fr; }
.nav .it:hover { color: var(--ink2); }
.nav .rail { position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: var(--line); }

/* right telemetry cards */
.cards { position: absolute; right: 30px; top: 31%; width: 176px; display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 10px; box-shadow: 0 4px 18px rgba(30, 20, 60, .045); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card .k { font: 600 9px var(--sans); letter-spacing: .09em; color: var(--mute); text-transform: uppercase; }
.card .v { margin-top: 5px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.card .v small { font-size: 10.5px; font-weight: 600; color: var(--mute); margin-left: 3px; letter-spacing: 0; }
.card svg { display: block; width: 100%; margin-top: 7px; overflow: visible; }
.card .meter { height: 4px; border-radius: 2px; background: rgba(26, 20, 48, .07); margin-top: 9px; overflow: hidden; }
.card .meter i { display: block; height: 100%; width: 50%; border-radius: 2px; background: var(--acc); }
.card .bars { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 8px; }
.card .bars i { flex: 1; border-radius: 1.5px 1.5px 0 0; background: var(--acc); min-height: 3px; }
.card .bars i.t { background: var(--acc2); }

/* status bar */
.status { position: absolute; left: 17%; right: 17%; bottom: 22px; display: flex; align-items: center; gap: 14px; font-size: 11.5px; font-weight: 600; }
.status .st { display: flex; align-items: center; gap: 7px; white-space: nowrap; min-width: 150px; }
.status .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }
.status .track { position: relative; flex: 1; height: 2px; background: rgba(26, 20, 48, .08); border-radius: 1px; }
.status .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--acc); border-radius: 1px; }
.status .track b { position: absolute; top: -3px; width: 1px; height: 8px; background: rgba(26, 20, 48, .18); }
.status .tc { font: 500 11px var(--mono); color: var(--ink2); min-width: 58px; text-align: right; }

/* callouts */
svg#lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
svg#lines path { fill: none; stroke: #2b2738; stroke-width: 1; stroke-opacity: .5; }
svg#lines circle.a { fill: var(--acc); stroke: #fff; stroke-width: 1.6; }
svg#lines circle.r { fill: none; stroke: var(--acc); stroke-opacity: .35; stroke-width: 1; }
.co { position: absolute; left: 0; top: 0; padding: 6px 10px 7px; background: rgba(255,255,255,.93); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 3px 14px rgba(30, 20, 60, .06); white-space: nowrap; will-change: transform, opacity; }
.co b { display: block; font-size: 12px; font-weight: 700; letter-spacing: -.005em; }
.co span { display: block; margin-top: 1px; font-size: 10.5px; font-weight: 500; color: var(--mute); }

.hint { position: absolute; right: 30px; bottom: 22px; font: 500 10.5px var(--sans); color: var(--mute2); }
.hint { display: none; }

@media (max-width: 980px) {
  .nav { display: none; }
  .cards { right: 14px; width: 146px; top: auto; bottom: 64px; gap: 7px; }
  .card { padding: 8px 10px; }
  .card .v { font-size: 18px; }
  .card:nth-child(n+3) { display: none; }
  .status { left: 16px; right: 16px; bottom: 16px; }
}
@media (max-width: 700px) {
  .head { top: 58px; }
  .head h1 { font-size: 20px; }
  .head .model { font-size: 13px; }
  .pills { top: 140px; left: 16px; right: 16px; transform: none; overflow-x: auto; scrollbar-width: none; pointer-events: auto; }
  .pills::-webkit-scrollbar { display: none; }
  .co span { display: none; }
  .co { padding: 4px 7px; }
  .co b { font-size: 10.5px; }
  .cards { display: none; }
  .status .st { min-width: 0; }
}

/* =====================================================================================

   ===================================================================================== */

const DPR = Q.has('dpr') ? +Q.get('dpr') : Math.min(devicePixelRatio || 1, LOWQ ? 1.5 : 2);

renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.03, 80);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

/* ---------- background: soft lavender corners and a fading dot grid (screen space) ---------- */
const bgCanvas = document.createElement('canvas');
const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.colorSpace = THREE.SRGBColorSpace;
function drawBackground() {
  const W = 1600, H = Math.max(400, Math.round((1600 * innerHeight) / innerWidth));
  bgCanvas.width = W; bgCanvas.height = H;
  const g = bgCanvas.getContext('2d');
  g.fillStyle = '#fcfbfe'; g.fillRect(0, 0, W, H);
  const blob = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  blob(0, 0, W * 0.5, 'rgba(206, 186, 255, .42)');
  blob(W * 0.08, H * 0.95, W * 0.33, 'rgba(222, 208, 255, .30)');
  blob(W, H, W * 0.42, 'rgba(214, 198, 255, .32)');
  blob(W * 0.98, 0, W * 0.22, 'rgba(232, 222, 255, .35)');
  blob(W * 0.5, H * 0.55, W * 0.42, 'rgba(255, 255, 255, .85)');
  g.fillStyle = 'rgba(70, 50, 120, 1)';
  for (let y = 10; y < H * 0.5; y += 14) for (let x = W * 0.62; x < W; x += 14) {
    const f = sstep(W * 0.62, W * 0.98, x) * (1 - sstep(0, H * 0.48, y));
    if (f < 0.02) continue;
    g.globalAlpha = 0.13 * f; g.beginPath(); g.arc(x, y, 1.05, 0, TAU); g.fill();

drawBackground();
scene.background = bgTex;

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xfdfbff, 0xbdb5d0, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.22);
key.position.set(2.2, 5.2, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(LOWQ ? 1024 : 2048, LOWQ ? 1024 : 2048);
key.shadow.camera.left = -2.6; key.shadow.camera.right = 2.6; key.shadow.camera.top = 2.6; key.shadow.camera.bottom = -2.6;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 14;

scene.add(key, key.target);

fill.position.set(-4, 2.2, 1.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.55);
rim.position.set(-1.5, 3.5, -4.5);
scene.add(rim);

/* ---------- floor: shadow catcher + contact blob ---------- */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ color: 0x2a2045, opacity: 0.13 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;

const blobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);

composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const AO_HIDE = [floor, blob];
const gtao = new GTAOPass(scene, camera, rtW(), rtH());

gtao.updateGtaoMaterial({ radius: 0.2, distanceExponent: 1.4, thickness: 1.4, scale: 1.0, samples: LOWQ ? 8 : 16, distanceFallOff: 1.0 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 12 });
{
  const inner = gtao.render.bind(gtao);
  gtao.render = (...args) => {
    const bg = scene.background; scene.background = null;
    const vis = AO_HIDE.map((o) => o.visible);
    for (const o of AO_HIDE) o.visible = false;
    // only the AO prepass sees the hidden set; the blend reads the untouched beauty buffer
    inner(...args);
    AO_HIDE.forEach((o, i) => (o.visible = vis[i]));
    scene.background = bg;

composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(rtW() / 2, rtH() / 2), 0.26, 0.35, 1.5);
bloom.enabled = !Q.has('nobloom');
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =====================================================================================
   2. Materials. The white shell carries a procedural surface detail shader:
      clustered drill holes, short slots, rivet rows parallel to panel edges and a seam
      groove at every panel border. It reads two attributes the geometry builders write:
      aPU (surface coordinates in metres) and aED (distance to the panel edges in metres).
   ===================================================================================== */
const GLSL_DETAIL = /* glsl */ `
float hh(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

float detailMask(vec2 P, vec2 E, float sd, float dens) {
  float px = max(length(fwidth(P)), 1e-6);

  vec2 o = vec2(fract(sd * 7.13) * 97.0, fract(sd * 3.71) * 61.0);

    float d = length(f - p0) * cs;

  applyParts(S.explode, S.exSpin);

  CHAMBERS.forEach((c, k) => { c.fluid.g.scale.set(1, 1, Math.max(0.04, S.levels[k])); });

  for (let k = 0; k < SEPTA.length; k++) {

  body.updateMatrixWorld(true);
  key.target.position.set(body.position.x, 0.4, body.position.z);
  key.position.copy(key.target.position).add(_t.set(2.2, 5.2, 3.0));
  const hb = Math.max(0, body.position.y - 0.9);
  blob.position.set(body.position.x, 0.002, body.position.z);
  blob.scale.setScalar(1.5 + hb * 0.6);
  blob.material.opacity = clamp(0.32 - hb * 0.3);
}

const DUR = 28.6;
const SEGS = [
  { t: 0.0, id: 'jetin', nav: 'overview', label: 'Jetting in' },
  { t: 3.3, id: 'hover', nav: 'overview', label: 'Hovering' },
  { t: 4.15, id: 'optics', nav: 'optics', label: 'Optics open', key: 'optics' },
  { t: 6.75, id: 'hood', nav: 'hood', label: 'Hood open', key: 'hood' },
  { t: 9.35, id: 'cirri', nav: 'cirri', label: 'Cirrus C24 apart', key: 'cirOut' },
  { t: 11.95, id: 'shell', nav: 'shell', label: 'Shell open', key: 'shell' },
  { t: 14.55, id: 'ballast', nav: 'ballast', label: 'Ballast pumping', key: 'pump' },
  { t: 17.15, id: 'funnel', nav: 'funnel', label: 'Funnel open', key: 'funnel' },
  { t: 19.75, id: 'tear', nav: 'tear', label: 'Teardown', key: 'explode' },
  { t: 24.25, id: 'reasm', nav: 'tear', label: 'Reassembly', key: 'explode' },
  { t: 25.4, id: 'launch', nav: 'launch', label: 'Jetting off' },

const segAt = (t) => { let i = 0; while (i + 1 < SEGS.length && t >= SEGS[i + 1].t) i++; return i; };
function trapInt(t, a, b, c, d) {

}

const HOVER = { x: 0.12, y: 0.98, z: 0.0, yaw: -1.05 };

function stateAt(t, S) {

  S.wJet = clamp(1 - jin + jout);
  S.yaw = HOVER.yaw + 0.04 * Math.sin(t * 0.37);
  S.pitch = 0.035 * Math.sin(t * 0.8) * (1 - S.wJet) - 0.05 * S.wJet;
  S.roll = 0.03 * Math.sin(t * 0.55 + 1);

  S.pump = clamp((t - 14.7) / 1.9) * (1 - ramp(t, 17.3, 18.6));

  S.z = HOVER.z + ZB.z * dIn - ZB.z * dOut;
  S.y = HOVER.y + 0.018 * Math.sin(t * 1.1) + 0.05 * ease5(clamp((t - 14.7) / 2.2)) * (1 - ramp(t, 17.3, 18.8)) + 0.12 * pulse(t, 19.6, 20.8, 23.6, 25.0) + 2.0 * Math.pow(u, 2.3);
  // chapters

  S.iris = pulse(t, 5.15, 5.4, 5.6, 5.95);
  S.hood = pulse(t, 6.85, 7.75, 8.6, 9.3);
  S.wheelPh = 0.8 * t + 14 * trapInt(t, 6.85, 7.6, 8.7, 9.3);
  S.cirOut = pulse(t, 9.45, 10.5, 11.15, 11.95);

  for (let k = 0; k < 10; k++) S.levels[k] = 1 - 0.68 * ease5(clamp(S.pump * 1.7 - k * 0.07));
  S.pulsePh = (t - 14.6) * 7.5 % 22 - 3;
  S.pulseAmp = pulse(t, 14.6, 14.9, 16.9, 17.3);
  S.funnel = pulse(t, 17.25, 18.0, 18.9, 19.6);

}

const sph = (az, el) => V3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));

  const vis = S.sid === 'tear' || S.sid === 'reasm' ? sstep(0.45, 0.85, S.explode) : S.key ? sstep(0.35, 0.8, S.pct) : 0;
  const items = [];
  list.forEach((c, i) => {
    const p = c.a(); _pr.copy(p).project(camera);
    const ax = (_pr.x * 0.5 + 0.5) * vw, ay = (-_pr.y * 0.5 + 0.5) * vh;
    if (_pr.z > 1 || !isFinite(ax)) return;
    items.push({ c, ax, ay, i });
  });
  const narrow = vw < 700;
  const colL = narrow ? 10 : vw * 0.165, colR = narrow ? vw - 10 : vw * 0.735;
  for (const side of ['L', 'R']) {
    const col = items.filter((o) => o.c.side === side).sort((a, b) => a.ay - b.ay);
    let y = vh * 0.24;
    for (const o of col) { o.y = Math.max(clamp(o.ay, vh * 0.26, vh * 0.86), y); y = o.y + (narrow ? 30 : 44); }
    for (let k = col.length - 1, lim = vh * 0.88; k >= 0; k--) { col[k].y = Math.min(col[k].y, lim); lim = col[k].y - (narrow ? 30 : 44); }
  }
  H.pool.forEach((pl, k) => {
    const o = items[k];
    if (!o || vis <= 0.001) { if (pl.w !== 0) { pl.el.style.opacity = 0; pl.path.style.opacity = 0; pl.dot.style.opacity = 0; pl.ring.style.opacity = 0; pl.w = 0; } return; }
    const key = o.c.t + o.c.s;
    if (pl.key !== key) { pl.el.children[0].textContent = o.c.t; pl.el.children[1].textContent = o.c.s; pl.key = key; pl.wid = pl.el.offsetWidth; pl.hgt = pl.el.offsetHeight; }
    const a = clamp(vis * 1.2 - k * 0.06);
    const lx = o.c.side === 'L' ? (narrow ? colL : colL) : narrow ? colR - pl.wid : colR;
    const ly = o.y - pl.hgt / 2;
    pl.el.style.transform = `translate(${lx.toFixed(1)}px, ${ly.toFixed(1)}px)`;
    pl.el.style.opacity = a.toFixed(3);
    const ex = o.c.side === 'L' ? lx + pl.wid : lx;
    const mx = o.c.side === 'L' ? ex + 18 : ex - 18;
    pl.path.setAttribute('d', `M${o.ax.toFixed(1)} ${o.ay.toFixed(1)}L${mx.toFixed(1)} ${o.y.toFixed(1)}L${ex.toFixed(1)} ${o.y.toFixed(1)}`);
    pl.dot.setAttribute('cx', o.ax.toFixed(1)); pl.dot.setAttribute('cy', o.ay.toFixed(1));
    pl.ring.setAttribute('cx', o.ax.toFixed(1)); pl.ring.setAttribute('cy', o.ay.toFixed(1));
    pl.path.style.opacity = a; pl.dot.style.opacity = a; pl.ring.style.opacity = a;
    pl.w = a;
  });
}
function setText(id, v) { if (HUD.last[id] !== v) { $(id).textContent = v; HUD.last[id] = v; } }

/* =====================================================================================
   9. Main loop, camera, input and the capture API
   ===================================================================================== */
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches && !Q.has('t') && !CAPTURE;
let T = Q.has('t') ? clamp(+Q.get('t') || 0, 0, DUR - 0.001) : CALM ? 4.0 : 0;
let playing = !Q.has('t') && !CAPTURE && !CALM;
let camMode = 'auto';
let camFrom = null, camBlend = 1, lastShot = null;
const S = newState();
let DBGCAM = Q.has('cam') ? Q.get('cam').split(',').map(Number) : null;
const camK = () => (camera.aspect < 1.45 ? Math.pow(1.45 / camera.aspect, 0.8) : 1);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.45; controls.maxDistance = 9; controls.maxPolarAngle = Math.PI * 0.49;
controls.enabled = !CAPTURE;
controls.addEventListener('start', () => { camMode = 'free'; });

function placeCam(c) {
  camera.position.copy(c.t).addScaledVector(c.d, c.r * camK());
  camera.position.y = Math.max(0.05, camera.position.y);
  camera.lookAt(c.t);
  controls.target.copy(c.t);
  lastShot = c;
}
function currentShot() {
  const off = camera.position.clone().sub(controls.target);
  return { t: controls.target.clone(), d: off.clone().normalize(), r: off.length() / camK() };
}
function seek(t) {
  camFrom = camMode === 'free' ? currentShot() : lastShot;
  camBlend = camFrom ? 0 : 1;
  camMode = 'auto';
  T = clamp(t, 0, DUR - 0.001);
  playing = true;
}

let decorFocus = 0;
function updateDecor(S, dt, snap) {
  const f = ['optics', 'hood', 'cirri', 'shell', 'ballast', 'funnel', 'tear'].includes(S.sid) ? 1 : 0.35;
  decorFocus = snap ? f : damp(decorFocus, f, 2.5, dt);
  decor.position.copy(controls.target);
  DECOR.forEach((ln, i) => {
    ln.material.opacity = ln.userData.base * decorFocus;
    ln.quaternion.copy(ln.userData.q0).multiply(_qa.setFromAxisAngle(ln.userData.axis, ln.userData.rate * T * 3));
    for (const c of ln.children) { c.quaternion.copy(ln.quaternion).invert().multiply(camera.quaternion); c.material.opacity = ln.material.opacity * 1.6; }
  });
}

function frame(dt, snap = false) {
  stateAt(T, S);
  poseRig(S);
  if (DBGCAM) placeCam({ t: V3(DBGCAM[3], DBGCAM[4], DBGCAM[5]), d: sph(DBGCAM[0], DBGCAM[1]), r: DBGCAM[2] });
  else if (camMode === 'auto') {
    let c = shotAt(S);
    if (camBlend < 1 && camFrom) { camBlend = Math.min(1, camBlend + dt / 1.2); c = mixShot(camFrom, c, ease5(camBlend)); }
    placeCam(c);
  } else controls.update();
  camera.updateMatrixWorld();
  updateDecor(S, dt, snap);
  updateHud(S);
  renderer.info.reset();
  composer.render(dt);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  drawBackground();
  if (!playing || CAPTURE) frame(0, true);
}
addEventListener('resize', onResize);
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('.pill')) return;
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; }
  if (e.key === 'r' || e.key === 'R') { camFrom = currentShot(); camBlend = 0; camMode = 'auto'; }
});
canvas.addEventListener('dblclick', () => { camFrom = currentShot(); camBlend = 0; camMode = 'auto'; });

buildHud(seek);
renderer.info.autoReset = false;
renderer.compile(scene, camera);

let last = performance.now();
// adaptive quality: watch real frame times and shed the costliest passes if the GPU struggles
const perf = { n: 0, acc: 0, level: 0 };
function governor(dtRaw) {
  if (perf.level >= 3 || document.hidden) return;
  perf.n++; perf.acc += dtRaw;
  if (perf.n < 75) return;
  const avg = perf.acc / perf.n; perf.n = 0; perf.acc = 0;
  if (avg < 0.026) return;
  perf.level++;
  if (perf.level === 1) { gtao.updateGtaoMaterial({ samples: 8 }); gtao.updatePdMaterial({ samples: 6 }); }
  if (perf.level === 2) { renderer.setPixelRatio(1); composer.setPixelRatio(1); composer.setSize(innerWidth, innerHeight); }
  if (perf.level === 3) gtao.enabled = false;
}
function loop(now) {
  const raw = (now - last) / 1000;
  const dt = Math.min(0.05, raw); last = now;
  governor(raw);
  if (playing) { T += dt; if (T >= DUR) { T = 0; camFrom = null; camBlend = 1; } }
  frame(dt);
  requestAnimationFrame(loop);
}

window.SIM = null;
if (CAPTURE) window.__scene = scene;
document.fonts.ready.then(() => {
  frame(0, true);
  window.SIM = {
    dur: DUR, parts: PARTS.length, pieces: PIECES, meshes: scene.children.length,
    info() { return JSON.stringify({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, pieces: PIECES, parts: PARTS.length }); },
    cam(c) { DBGCAM = c; frame(0, true); return true; },
    seek(t, warm = 0) { T = clamp(t, 0, DUR - 0.001); camMode = 'auto'; camBlend = 1; camFrom = null; for (let i = 0; i < warm; i++) frame(0, true); frame(0, true); return true; },
  };
  if (!CAPTURE) requestAnimationFrame((n) => { last = n; loop(n); });
});
</script>
