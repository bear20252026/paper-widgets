<!DOCTYPE html>
<html lang="en">
<head>

<title>Rain Waltz — Eight Scenes of Love in the Rain</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .bar{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:2;pointer-events:none}
  .bar.t{top:0}.bar.b{bottom:0}
  #title{position:fixed;top:calc(7vh + 18px);left:28px;z-index:3;letter-spacing:.45em;font-size:12px;opacity:.7;text-transform:uppercase}
  #cap{position:fixed;left:28px;bottom:calc(7vh + 26px);z-index:3;max-width:min(560px,80vw);text-shadow:0 2px 18px rgba(0,0,0,.8)}
  #cap .n{font-size:13px;letter-spacing:.5em;opacity:.75}
  #cap .h{font-size:clamp(26px,4.2vw,46px);font-style:italic;margin:4px 0 6px;font-weight:400}
  #cap .l{font-size:clamp(13px,1.5vw,16px);opacity:.85;line-height:1.6}
  #cap.in>*{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
  #cap.in .h{animation-delay:.15s}#cap.in .l{animation-delay:.35s}
  @keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{transform:none;filter:none}}
  #dots{position:fixed;right:28px;bottom:calc(7vh + 30px);z-index:3;display:flex;gap:10px}
  #dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.7);cursor:pointer;transition:.4s}
  #dots i.on{background:#fff;box-shadow:0 0 12px #fff;transform:scale(1.25)}
  #hint{position:fixed;right:28px;top:calc(7vh + 18px);z-index:3;font-size:11px;letter-spacing:.2em;opacity:.5}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,8,20,.35),rgba(0,0,0,.85));cursor:pointer;transition:opacity 1.2s;text-align:center}
  #start h1{font-weight:400;font-style:italic;font-size:clamp(40px,8vw,96px);margin:0;letter-spacing:.04em;text-shadow:0 0 40px rgba(140,180,255,.6)}
  #start p{letter-spacing:.4em;font-size:12px;opacity:.8;margin:14px 0 34px;text-transform:uppercase}
  #start b{font-weight:400;border:1px solid rgba(255,255,255,.6);padding:14px 34px;letter-spacing:.35em;font-size:13px;border-radius:40px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 30px rgba(255,255,255,.5);background:rgba(255,255,255,.08)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<canvas id="c"></canvas>
<div class="bar t"></div><div class="bar b"></div>
<div id="title">Rain Waltz · 雨中圆舞</div>
<div id="hint">← → SCENES · M MUTE</div>

<div id="start"><h1>Rain Waltz</h1><p>a romance in eight scenes of rain</p><b>ENTER THE RAIN ♪</b></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $=q=>document.querySelector(q);
const {sin,cos,PI,abs,max,min,floor,exp}=Math, rnd=Math.random;
const sstep=(a,b,x)=>{x=min(1,max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const C=c=>new THREE.Color(c);
const BPM=100,BEAT=60/BPM,STEP=BEAT/2,NS=8,TOT=NS*32;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:false,powerPreference:'high-performance'});
const DPR=min(devicePixelRatio||1,1.5);
renderer.setPixelRatio(DPR);renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0,.03);
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,600);
const G={rim:{value:C('#88aaff')},time:{value:0},h:{value:innerHeight*DPR*1.4}};

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.9,.75,.8);composer.addPass(bloom);
const fx=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uFade:{value:1},uPulse:{value:0},uTint:{value:C('#ffffff')}},
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uFade,uPulse;uniform vec3 uTint;varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 uv=vUv;vec2 c=uv-.5;float w=uFade;
uv+=vec2(sin(uv.y*38.+uTime*5.),cos(uv.x*31.-uTime*4.))*.012*w;uv.y+=w*w*.05*sin(uv.x*9.+uTime);
float ca=(.0012+uPulse*.002+w*.012)*length(c)*2.;
vec3 col=vec3(texture2D(tDiffuse,uv+c*ca).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-c*ca).b);
col*=1.-dot(c,c)*1.1;col+=uTint*uPulse*.02;
float m=smoothstep(0.,1.,w*1.8-.8*h(vec2(floor(uv.x*140.),3.)));
col=mix(col,uTint,m);
col+=(h(uv*vec2(1920.,1080.)+uTime)-.5)*.035;
gl_FragColor=vec4(max(col,0.),1.);}`});
composer.addPass(fx);composer.addPass(new OutputPass());

/* ---------- sky ---------- */
const skyU={uTop:{value:C(0)},uBot:{value:C(0)},uGlow:{value:C(0)},uMoonCol:{value:C(0)},uMoonDir:{value:new THREE.Vector3(0,1,0)},uMoon:{value:2},uStars:{value:0},uTime:G.time,uFlash:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,
vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`uniform vec3 uTop,uBot,uGlow,uMoonCol,uMoonDir;uniform float uMoon,uStars,uTime,uFlash;varying vec3 vD;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){vec3 d=normalize(vD);float y=d.y;
vec3 c=mix(uBot,uTop,smoothstep(-.05,.6,y));c+=uGlow*exp(-abs(y)*7.)*.35;
vec2 sp=d.xz/(abs(y)+.25)*30.;vec2 ip=floor(sp);float st=step(.975,h(ip))*smoothstep(.05,.35,y);
c+=uStars*st*smoothstep(.45,0.,length(fract(sp)-.5))*(.6+.4*sin(uTime*3.+h(ip+2.)*30.))*1.5;
float m=dot(d,normalize(uMoonDir));float disk=smoothstep(uMoon,uMoon+.0012,m);
c=mix(c,uMoonCol,disk);c+=uMoonCol*pow(max(m,0.),90.)*.12*step(uMoon,1.5);
c+=uFlash*vec3(.6,.7,1.)*(.4+.6*smoothstep(-.2,.8,y));
gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x111111,.6);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,1.5);scene.add(key);
const rimL=new THREE.DirectionalLight(0xffffff,2);rimL.position.set(-3,4,-7);scene.add(rimL);
const aura=new THREE.PointLight(0xffffff,6,7,2);scene.add(aura);

/* ---------- wet reflective ground ---------- */
const ground=new Reflector(new THREE.CircleGeometry(220,48),{clipBias:.003,textureWidth:floor(innerWidth*DPR*.6),textureHeight:floor(innerHeight*DPR*.6),color:0x888888,shader:{name:'Wet',
uniforms:{color:{value:null},tDiffuse:{value:null},textureMatrix:{value:null},uTime:{value:0},uCol:{value:C(0)},uFog:{value:C(0)},uDen:{value:.03},uRefl:{value:.8},uRing:{value:new THREE.Vector4()},uRingCol:{value:C(0)},uTile:{value:0},uCam:{value:new THREE.Vector3()}},
vertexShader:`uniform mat4 textureMatrix;varying vec4 vUv;varying vec3 vW;void main(){vUv=textureMatrix*vec4(position,1.);vW=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`uniform vec3 uCol,uFog,uRingCol,uCam;uniform sampler2D tDiffuse;uniform float uTime,uDen,uRefl,uTile;uniform vec4 uRing;varying vec4 vUv;varying vec3 vW;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float rip(vec2 uv,float t){float s=0.;for(int i=0;i<3;i++){float fi=float(i);vec2 g=uv*(1.1+fi*.6)+fi*13.7;vec2 c=floor(g);vec2 f=fract(g)-.5;float h=hash(c+fi);float tt=fract(t*(.7+h*.5)+h*7.);vec2 o=(vec2(hash(c+3.1),hash(c+7.7))-.5)*.6;float d=length(f-o);float r=tt*.42;s+=sin((d-r)*50.)*smoothstep(.07,0.,abs(d-r))*(1.-tt);}return s;}
void main(){vec2 p=vW.xz;float e=.03;float r0=rip(p,uTime);
vec2 n=vec2(rip(p+vec2(e,0.),uTime)-r0,rip(p+vec2(0.,e),uTime)-r0)/e*.012;
n+=vec2(sin(p.y*3.+uTime*.8),cos(p.x*2.7-uTime*.6))*.004;
vec4 uv=vUv;uv.xy+=n*uv.w*1.5;vec3 refl=texture2DProj(tDiffuse,uv).rgb;
vec3 V=normalize(uCam-vW);float fr=pow(1.-max(V.y,0.),3.)*.8+.2;
float on=step(.01,uTile);vec2 tp=p*uTile;vec2 tf=abs(fract(tp)-.5);float line=smoothstep(.45,.5,max(tf.x,tf.y))*on;
vec3 c=uCol*mix(1.,hash(floor(tp))*.7+.6,on)*(1.-line*.6)+refl*uRefl*fr*(1.-line*.5);
c+=uRingCol*max(r0,0.)*.22*fr;
float rd=length(p-uRing.xy);c+=uRingCol*uRing.w*smoothstep(.22,0.,abs(rd-uRing.z))*1.4/(1.+uRing.z*.6);
float dist=length(uCam-vW);c=mix(c,uFog,1.-exp(-uDen*uDen*dist*dist));
gl_FragColor=vec4(c,1.);}`}});
ground.rotation.x=-PI/2;scene.add(ground);const gU=ground.material.uniforms;

/* ---------- rain ---------- */
const NR=22000,rg=new THREE.BufferGeometry(),sd=new Float32Array(NR*8),tp=new Float32Array(NR*2);
for(let i=0;i<NR;i++){const a=[rnd(),rnd(),rnd(),rnd()];sd.set(a,i*8);sd.set(a,i*8+4);tp[i*2+1]=1}
rg.setAttribute('seed',new THREE.BufferAttribute(sd,4));rg.setAttribute('tip',new THREE.BufferAttribute(tp,1));rg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NR*6),3));
const rainU={uTime:{value:0},uLen:{value:.4},uSwirl:{value:0},uBeat:{value:0},uAlpha:{value:.5},uWind:{value:new THREE.Vector2()},uC:{value:new THREE.Vector3()},uUmb:{value:new THREE.Vector3()},uUmb2:{value:new THREE.Vector3(0,-99,0)},uCol:{value:C('#9fc4ff')}};
const rain=new THREE.LineSegments(rg,new THREE.ShaderMaterial({uniforms:rainU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec4 seed;attribute float tip;uniform float uTime,uLen,uSwirl,uAlpha;uniform vec2 uWind;uniform vec3 uC,uUmb,uUmb2;varying float vA;
const vec3 B=vec3(38.,16.,38.);
vec3 at(float y){vec3 p;p.y=y;p.xz=(seed.xz-.5)*B.xz+uWind*(B.y-y);vec2 q=p.xz-uC.xz;float r=length(q);float a=uSwirl*exp(-r*.22)*(.5+.5*sin(y*.8+seed.w*6.));float c=cos(a),s=sin(a);p.xz=uC.xz+mat2(c,-s,s,c)*q;return p;}
void main(){float k=.7+seed.w*.6;float y=mod(seed.y*B.y-uTime*k,B.y);vec3 p=at(y+tip*uLen*k);
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;float dz=-mv.z;
float hid=step(length(p.xz-uUmb.xz),.66)*step(p.y,uUmb.y)+step(length(p.xz-uUmb2.xz),.66)*step(p.y,uUmb2.y);
vA=(.25+.75*seed.w)*uAlpha*smoothstep(.3,2.,dz)*(1.-smoothstep(20.,34.,dz))*(1.-tip*.9)*(1.-min(hid,1.));}`,
fragmentShader:`uniform vec3 uCol;uniform float uBeat;varying float vA;void main(){gl_FragColor=vec4(uCol*(1.+uBeat*1.4),vA);}`}));
rain.frustumCulled=false;scene.add(rain);

/* ---------- material helper with rim glow ---------- */
function rim(m,k,keyName,vert){
  m.onBeforeCompile=s=>{s.uniforms.uRim=G.rim;
    s.fragmentShader='uniform vec3 uRim;\n'+s.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
    totalEmissiveRadiance+=uRim*${k.toFixed(2)}*pow(1.-clamp(abs(dot(normalize(vViewPosition),normal)),0.,1.),2.5);`);
    if(vert)vert(s)};
  m.customProgramCacheKey=()=>'rim'+k+keyName;return m}

/* ---------- figure ---------- */
function makeFigure(o){
  const f={flare:{value:0},tw:{value:0},swZ:0,pyaw:0,fl:0,hair:[]},root=f.root=new THREE.Group();
  const M=(c,r=.5)=>rim(new THREE.MeshStandardMaterial({color:c,roughness:r}),.55,'b');
  const skin=M(o.skin,.6),dress=f.dress=M(o.dress,.4),hairM=M(o.hair,.3),legM=o.legs?M(o.legs):skin,armM=o.sleeve?dress:skin,shoe=M(o.shoe,.3);
  const cap=(r,l,m,p)=>{const g=new THREE.CapsuleGeometry(r,l,4,10);g.translate(0,-l/2,0);const x=new THREE.Mesh(g,m);p.add(x);return x};
  const grp=(p,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};
  const sph=(r,m,p,x,y,z,sx=1,sy=1,sz=1)=>{const s=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);s.position.set(x,y,z);s.scale.set(sx,sy,sz);p.add(s);return s};
  const hips=f.hips=grp(root,0,.9,0);sph(.115,o.legs?legM:dress,hips,0,0,0,1.15,.8,.9);
  f.legs=[-1,1].map(s=>{const up=grp(hips,s*.075,-.03,0);cap(.06,.4,legM,up);const lo=grp(up,0,-.42,0);cap(.046,.38,legM,lo);sph(.05,shoe,lo,0,-.42,.045,.85,.6,1.9);return{up,lo}});
  const spine=f.spine=grp(hips,0,.05,0);
  const tor=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[.1,0],[.088,.09],[.105,.2],[.118,.3],[.085,.365],[.035,.4],[0,.4]].map(a=>new THREE.Vector2(a[0],a[1])),20),dress);
  tor.scale.set(o.broad?1.18:1,1,.72);spine.add(tor);
  cap(.036,.07,skin,grp(spine,0,.47,0));
  const head=f.head=grp(spine,0,.5,0);sph(.1,skin,head,0,.03,0,.93,1.08,1);
  const eyeM=new THREE.MeshBasicMaterial({color:'#2a1820'});[-1,1].forEach(s=>sph(.014,eyeM,head,s*.036,.035,.091,1.3,.35,.4));
  const hc=new THREE.Mesh(new THREE.SphereGeometry(.108,18,12,0,PI*2,0,PI*.56),hairM);hc.position.set(0,.035,-.008);hc.rotation.x=-.42;hc.scale.set(.96,1.08,1.03);head.add(hc);
  if(o.long){let p=grp(head,0,0,-.075);for(let i=0;i<7;i++){const m=cap(.075-i*.008,.09,hairM,p);m.scale.z=.7;f.hair.push(p);p=grp(p,0,-.1,0)}
    [-1,1].forEach(s=>cap(.028,.16,hairM,grp(head,s*.088,.05,.03)))}
  f.arms=[-1,1].map(s=>{const up=grp(spine,s*.135,.345,0);cap(.036,.22,armM,up);const lo=grp(up,0,-.26,0);cap(.03,.21,armM,lo);const hand=sph(.036,skin,lo,0,-.26,0,.9,1.2,.7);return{up,lo,hand,s}});
  if(o.skirt){const pts=[];for(let i=0;i<=14;i++){const t=i/14;pts.push(new THREE.Vector2(.1+.27*Math.pow(t,.85),-.52*t))}
    f.skirt=rim(new THREE.MeshStandardMaterial({color:o.dress,roughness:.4,side:THREE.DoubleSide}),.55,'skirt',s=>{
      s.uniforms.uFlare=f.flare;s.uniforms.uT=G.time;s.uniforms.uTw=f.tw;
      s.vertexShader='uniform float uFlare,uT,uTw;\n'+s.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      float hh=clamp(-position.y/.52,0.,1.);float an=atan(position.z,position.x);
      transformed.xz*=1.+uFlare*hh*hh*1.2;transformed.y+=uFlare*hh*hh*.2;
      transformed.xz*=1.+(sin(an*5.+uT*3.)*.04+sin(an*9.-uT*4.3)*.02*hh)*hh*(1.+uFlare);
      float tw=uTw*hh;float cs=cos(tw),sn=sin(tw);transformed.xz=mat2(cs,-sn,sn,cs)*transformed.xz;`)});
    const sk=new THREE.Mesh(new THREE.LatheGeometry(pts,56),f.skirt);sk.position.y=.07;hips.add(sk)}
  if(o.scale)root.scale.setScalar(o.scale);
  scene.add(root);return f}

const _d=new THREE.Vector3(),_n=new THREE.Vector3(),_u=new THREE.Vector3(),_w=new THREE.Vector3(),_q=new THREE.Quaternion(),_q2=new THREE.Quaternion(),DOWN=new THREE.Vector3(0,-1,0);
function ik(arm,tx,ty,tz){const L=.26;
  _d.set(tx,ty,tz).sub(arm.up.position);let D=_d.length();if(D<.08){_d.set(0,-.08,.01);D=_d.length()}
  const mx=L*1.99;if(D>mx){_d.multiplyScalar(mx/D);D=mx}
  const a=Math.acos(min(1,max(-1,D/(2*L))));
  _u.copy(_d).normalize();_n.set(arm.s*.6,-1,-.5);_n.crossVectors(_u,_n).normalize();
  _q.setFromUnitVectors(DOWN,_u);_q2.setFromAxisAngle(_n,a);_q.premultiply(_q2);arm.up.quaternion.copy(_q);
  _w.copy(DOWN).applyQuaternion(_q).multiplyScalar(L);_w.subVectors(_d,_w).normalize().applyQuaternion(_q2.copy(_q).invert());
  arm.lo.quaternion.setFromUnitVectors(DOWN,_w)}

const KEYS='x z y yaw pitch lean sx twist sz hx hy hz ll lk ls rl rk rs ax ay az ux uy uz utx utz uspin free'.split(' ');
const DEF={ax:.24,ay:.02,az:.1,ux:-.2,uy:.3,uz:.22};
const reset=p=>{KEYS.forEach(k=>p[k]=DEF[k]||0);return p};
function blend(a,b,t,o){KEYS.forEach(k=>{if(k==='yaw'){let d=(b.yaw-a.yaw)%(2*PI);if(d>PI)d-=2*PI;if(d<-PI)d+=2*PI;o.yaw=a.yaw+d*t}else o[k]=a[k]+(b[k]-a[k])*t})}

function applyPose(f,p,dt,t){
  f.root.position.set(p.x,0,p.z);f.root.rotation.y=p.yaw;
  const dl=i=>{const a=(i?p.ll:p.rl)-p.pitch,k=i?p.lk:p.rk;return .42*cos(a)+.45*cos(a-k)};
  f.hips.position.y=max(dl(0),dl(1))+.03+p.y;f.hips.rotation.set(p.pitch,0,p.lean);
  f.spine.rotation.set(p.sx,p.twist,p.sz);f.head.rotation.set(p.hx,p.hy,p.hz);
  const L=f.legs;L[0].up.rotation.set(-p.rl,0,-p.rs);L[0].lo.rotation.x=p.rk;L[1].up.rotation.set(-p.ll,0,p.ls);L[1].lo.rotation.x=p.lk;
  ik(f.arms[0],p.ux,p.uy,p.uz);ik(f.arms[1],p.ax,p.ay,p.az);
  let yv=(p.yaw-f.pyaw)/max(dt,.001);if(abs(yv)>20)yv=0;f.pyaw=p.yaw;
  const k=min(1,dt*5);f.swZ+=(min(.4,max(-.4,-yv*.05))-f.swZ)*k;
  f.fl+=(min(1,abs(yv)*.16+max(p.ll,p.rl,0)*.5+abs(min(p.ll,p.rl,0))*.5+max(0,p.y)*1.5)-f.fl)*k;
  f.flare.value=f.fl;f.tw.value=-f.swZ*2;
  f.hair.forEach((h,i)=>h.rotation.set(.1+sin(t*2.1-i*.5)*.04+f.fl*.12+(i===0?-p.hx*.6-p.pitch*.7:0),0,f.swZ*.5+sin(t*1.6-i*.6)*.05))}

/* ---------- umbrella ---------- */
function makeUmbrella(col){
  const g=new THREE.Group(),spin=new THREE.Group();g.add(spin);
  const R=.72,pm=1.05,N=8,SU=48,SV=10,pos=[],idx=[],y0=cos(pm),H=.72;
  for(let j=0;j<=SV;j++){const v=j/SV,ph=v*pm;for(let i=0;i<=SU;i++){const u=i/SU*PI*2,f=Math.pow(abs(sin(u*N/2)),1.5)*v*v,r=R*sin(ph)*(1-.07*f);pos.push(cos(u)*r,R*(cos(ph)-y0)+.035*f+H,sin(u)*r)}}
  for(let j=0;j<SV;j++)for(let i=0;i<SU;i++){const a=j*(SU+1)+i,b=a+1,c=a+SU+1,d=c+1;idx.push(a,c,b,b,c,d)}

/* ---------- audio (fully synthesised) ---------- */
let AC=null,master=null,rev,nb,muted=false,stepN=0;
const PROG=[[53,60,64,69],[55,59,62,67],[52,59,62,67],[57,60,64,67],[53,60,64,69],[55,59,62,67],[48,55,64,67],[48,55,62,67]];
const TR=[0,0,3,3,-2,-2,0,2],LV=[0,3,1,2,1,1,2,3],MEL=[3,-1,2,-1,1,-1,2,3];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(t,m,type,a,d,vol,wet,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  let n=o;if(cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f}
  n.connect(g);g.connect(master);if(wet){const w=AC.createGain();w.gain.value=wet;g.connect(w);w.connect(rev)}o.start(t);o.stop(t+a+d+.05)}
function noise(t,d,vol,freq,type='highpass',q=1){const s=AC.createBufferSource();s.buffer=nb;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,rnd());s.stop(t+d+.02)}
function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35)}
function play(n,t){const gs=((n%(NS*64))+NS*64)%(NS*64),sc=floor(gs/64),ss=gs%64,br=floor(ss/8),s8=ss%8,tr=TR[sc],ch=PROG[br],lv=LV[sc];
  if(s8===0){ch.forEach(m=>{tone(t,m+tr,'sawtooth',.5,BEAT*4.2,.02,.6,700+lv*250);tone(t,m+tr+.08,'triangle',.4,BEAT*4,.028,.5)});tone(t,ch[0]+tr-12,'sine',.02,BEAT*3.5,.2,.1)}
  if(s8===4&&lv>0)tone(t,ch[0]+tr-12,'triangle',.01,BEAT*1.5,.1,.1,300);
  tone(t,ch[[0,2,1,3,2,3,1,2][s8]]+tr+12,'triangle',.005,.7,.065,.7);
  const me=MEL[(s8+br*3)%8];if(me>=0&&(lv>1||s8%2===0))tone(t,ch[me]+tr+24,'sine',.005,1.2,.045,.9);
  if(lv>=2&&(s8===0||s8===4||(lv>=3&&s8===7)))kick(t,.5);
  if(lv>=1&&s8%2===1)noise(t,.05,.035,7000);
  if(lv>=2&&(s8===2||s8===6))noise(t,.16,.07,1800,'bandpass',.8);
  if(lv>=3&&s8%2===0)noise(t,.03,.02,9000);
  if(ss===63)noise(t,.9,.1,3000,'bandpass',.5);
  if(ss===0){tone(t,ch[0]+tr+36,'sine',.005,2.5,.06,1);tone(t,ch[0]+tr+43,'sine',.005,2.5,.04,1)}}
function sched(){if(!AC||AC.state!=='running')return;const nowS=(performance.now()-t0)/1000;
  if(abs(stepN*STEP-nowS)>1)stepN=Math.ceil(nowS/STEP);
  while(stepN*STEP<nowS+.2){play(stepN,AC.currentTime+max(0,stepN*STEP-nowS)+.03);stepN++}}
function startAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
  master=AC.createGain();master.gain.value=muted?0:.8;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
  rev=AC.createConvolver();const L=floor(AC.sampleRate*2.8),ir=AC.createBuffer(2,L,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/L,2.8)}
  rev.buffer=ir;const rgn=AC.createGain();rgn.gain.value=.5;rev.connect(rgn);rgn.connect(master);
  nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;
  const rs=AC.createBufferSource();rs.buffer=nb;rs.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5200;bp.Q.value=.4;const g=AC.createGain();g.gain.value=.07;rs.connect(bp);bp.connect(g);g.connect(master);rs.start();
  stepN=Math.ceil(((performance.now()-t0)/1000)/STEP);setInterval(sched,50)}
$('#start').onclick=()=>{jump(0);try{startAudio()}catch(e){}const s=$('#start');s.style.opacity=0;setTimeout(()=>s.remove(),1300)};

/* ---------- main loop ---------- */
const pA=reset({}),pB=reset({}),pBoy=reset({}),uS={free:0},uS2={free:0},tg=new THREE.Vector3();
let last=performance.now(),rainT=0,lastShot=-1;
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now(),dt=min(.05,(now-last)/1000);last=now;
  const T=(now-t0)/1000,bf=T/BEAT,gb=((bf%TOT)+TOT)%TOT,si=min(NS-1,floor(gb/32)),sb=gb-si*32;
  if(si!==cur)setScene(si);
  const ph=((bf%1)+1)%1,pulse=exp(-ph*5),bar=exp(-(((bf%4)+4)%4)*2.2);
  G.time.value=T;fx.uniforms.uTime.value=T;fx.uniforms.uPulse.value=pulse;
  fx.uniforms.uFade.value=min(1,sstep(30.8,32,sb)+1-sstep(0,1.2,sb));

  // dance
  const mi=min(3,floor(sb/8)),ms=sb-mi*8;
  reset(pA);MOVES[S.moves[mi]](bf,pA,0);
  if(mi>0&&ms<1.5){reset(pB);MOVES[S.moves[mi-1]](bf,pB,0);blend(pB,pA,sstep(0,1.5,ms),pA)}
  if(S.hook)S.hook(pA,sb,bf);
  applyPose(girl,pA,dt,T);updUmb(U1,girl,pA,uS,dt,T,0);
  U1.g.localToWorld(rainU.uUmb.value.set(0,U1.H+.1,0));
  if(cur>=6){reset(pBoy);S.boy(pBoy,sb,bf);applyPose(boy,pBoy,dt,T);updUmb(U2,boy,pBoy,uS2,dt,T,1);U2.g.localToWorld(rainU.uUmb2.value.set(0,U2.H+.1,0))}

  // rain dances with the beat
  rainT+=dt*S.rain[3]*(1-pulse*.45);rainU.uTime.value=rainT;rainU.uBeat.value=pulse;
  rainU.uSwirl.value=S.rain[5]*(sin(bf*PI/4)*1.0-girl.swZ*2.5);rainU.uC.value.set(pA.x,0,pA.z);

  // lights & ground
  let fl=0;if(S.thunder){const q=sb%16;if(q>=12&&q<13)fl=exp(-(q-12)*5)*(.5+.5*sin(T*60))}
  skyU.uFlash.value=fl;hemi.intensity=S.hemi[2]*(1+bar*.2)+fl*4;key.intensity=S.key[1]*(1+bar*.25);
  aura.position.set(pA.x,1.7,pA.z+.2);aura.intensity=5+pulse*6;
  gU.uTime.value=T;gU.uRing.value.set(pA.x,pA.z,ph*5,pulse);
  envs[cur].upd(T,pulse,sb,dt);

  // camera: new shot every two bars, cut on the beat
  const sh=SHOTS[S.shots[mi]],ts=ms*BEAT,id=si*4+mi,fxp=pA.x*.7,fzp=pA.z*.7;
  if(id!==lastShot){lastShot=id;tg.set(fxp,0,fzp)}else{const k=min(1,dt*2.5);tg.x+=(fxp-tg.x)*k;tg.z+=(fzp-tg.z)*k}
  const az=sh.a+sh.da*ts,r=sh.r+sh.dr*ts,hy=max(.22,sh.h+sh.dh*ts);
  cam.position.set(tg.x+sin(az)*r+sin(T*.7)*.03,hy+sin(T*.9)*.02,tg.z+cos(az)*r);
  cam.lookAt(tg.x,sh.ty+pA.y*.3,tg.z);cam.fov=sh.fov-pulse*.5;cam.updateProjectionMatrix();
  sky.position.copy(cam.position);gU.uCam.value.copy(cam.position);
  composer.render();
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();G.h.value=innerHeight*DPR*1.4});
frame();
