<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>The Sunlit Crown</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #78796c; }
    body { touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const SETTINGS = Object.freeze({
      desktopPixelRatio: 1.6,
      mobilePixelRatio: 1.25,
      maxRenderPixels: 2800000,
      simulationStep: 1 / 60,
      maxCatchUpSteps: 3,
      shadowInterval: 1 / 20,
      reflectionWidth: 768
    });
    const eventScope = new AbortController();
    function listen(target, type, handler, options = {}) {
      target.addEventListener(type, handler, { ...options, signal: eventScope.signal });
    }
    function viewportSize() {
      return { width: Math.max(1, window.innerWidth), height: Math.max(1, window.innerHeight) };
    }
    function renderPixelRatio(width, height) {
      const limit = width < 700 ? SETTINGS.mobilePixelRatio : SETTINGS.desktopPixelRatio;
      return Math.min(window.devicePixelRatio || 1, limit, Math.sqrt(SETTINGS.maxRenderPixels / (width * height)));
    }
    const initialViewport = viewportSize();
    const geometryCache = new Map();
    function sharedGeometry(key, create) {
      if (!geometryCache.has(key)) geometryCache.set(key, create());
      return geometryCache.get(key);
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x78796c);
    scene.fog = new THREE.FogExp2(0xc9b6a0, 0.0062);

    const camera = new THREE.PerspectiveCamera(85, initialViewport.width / initialViewport.height, 0.1, 500);
    camera.position.set(0, 1.6, 20);
    camera.lookAt(0, 7, -12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(renderPixelRatio(initialViewport.width, initialViewport.height));
    renderer.setSize(initialViewport.width, initialViewport.height);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'A sunlit throne hall with an animated king. Drag to look and scroll to zoom. W waves, T and S animate speaking and singing, R raises the sceptre. Space advances the performance. Home resets the view.');
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    // The target lies on the original sightline, but close enough to inspect the throne.
    controls.target.set(0, 9.2, -25);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.enablePan = false;
    controls.minDistance = 3.6;
    controls.maxDistance = 55;
    controls.minPolarAngle = 1.55;
    controls.maxPolarAngle = 1.85;
    controls.minAzimuthAngle = -0.16;
    controls.maxAzimuthAngle = 0.16;
    controls.rotateSpeed = 0.25;
    controls.update();

    let seed = 91734;
    function random() {
      seed = (1664525 * seed + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    // A small procedural environment gives the metal and marble something to reflect.
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x56615e);
    function envPanel(x, y, z, w, h, color) {
      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, toneMapped: false })
      );
      panel.position.set(x, y, z);
      panel.lookAt(0, 0, 0);
      envScene.add(panel);
    }
    let environment = null;
    function rebuildEnvironment() {
      envPanel(-4, 2, 0, 1.4, 8, 0xffedca);
      envPanel(4, 2, 0, 1.5, 8, 0xdcebf0);
      envPanel(0, 5, -3, 6, 2, 0xf4ebd7);
      envPanel(0, 3, 4, 3, 5, 0xb4bfc1);
      const generator = new THREE.PMREMGenerator(renderer);
      const previous = environment;
      environment = generator.fromScene(envScene, 0.06);
      scene.environment = environment.texture;
      previous?.dispose();
      generator.dispose();
      envScene.traverse(object => {
        if (object.isMesh) { object.geometry.dispose(); object.material.dispose(); }
      });
      envScene.clear();
    }
    rebuildEnvironment();

    function stoneGrain() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const image = ctx.createImageData(512, 512);
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const u = x / 512;
          const v = y / 512;
          const grain = 9 * Math.sin(u * 14 + v * 27) + 5 * Math.sin(u * 46 - v * 32);
          const sweep = Math.sin(u * 21 + v * 13 + 1.6 * Math.sin(v * 11 + u * 4));
          const vein = 75 * Math.pow(Math.max(0, 1 - Math.abs(sweep)), 27);
          const value = 207 + grain + random() * 15 - vein;
          const index = (y * 512 + x) * 4;
          image.data[index] = value + 5;
          image.data[index + 1] = value + 2;
          image.data[index + 2] = value - 4;
          image.data[index + 3] = 255;
        }
      }
      ctx.putImageData(image, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }
    const carvedMarble = stoneGrain();
    const marbleRelief = carvedMarble.clone();
    marbleRelief.colorSpace = THREE.NoColorSpace;
    marbleRelief.needsUpdate = true;
    const stone = new THREE.MeshStandardMaterial({ color: 0xb6a88f, map: carvedMarble, bumpMap: marbleRelief, bumpScale: 0.018, roughness: 0.69, metalness: 0.04 });
    const paleStone = new THREE.MeshStandardMaterial({ color: 0xe5d9bf, map: carvedMarble, bumpMap: marbleRelief, bumpScale: 0.014, roughness: 0.58, metalness: 0.05 });
    const deepStone = new THREE.MeshStandardMaterial({ color: 0x56605c, map: carvedMarble, bumpMap: marbleRelief, bumpScale: 0.02, roughness: 0.84, metalness: 0.05 });
    const wallStone = new THREE.MeshStandardMaterial({ color: 0xa89e8d, map: carvedMarble, bumpMap: marbleRelief, bumpScale: 0.022, roughness: 0.91, metalness: 0.03 });
    const ceilingStone = new THREE.MeshStandardMaterial({ color: 0x918875, roughness: 0.93, metalness: 0.06, side: THREE.DoubleSide });
    const gold = new THREE.MeshStandardMaterial({ color: 0xb89250, metalness: 0.9, roughness: 0.27, envMapIntensity: 1.05 });
    const brightGold = new THREE.MeshStandardMaterial({ color: 0xe7c983, metalness: 0.86, roughness: 0.24, envMapIntensity: 1.25 });
    const darkGold = new THREE.MeshStandardMaterial({ color: 0x75562f, metalness: 0.85, roughness: 0.36, envMapIntensity: 0.85 });
    const agedGilt = new THREE.MeshStandardMaterial({ color: 0xb7a47b, metalness: 0.68, roughness: 0.4, envMapIntensity: 0.85 });
    const flutedGold = new THREE.MeshStandardMaterial({ color: 0xc2a66d, vertexColors: true, metalness: 0.82, roughness: 0.31, envMapIntensity: 1.0 });
    const crimson = new THREE.MeshPhysicalMaterial({ color: 0x9f3543, roughness: 0.78, sheen: 0.3, sheenColor: 0xeaa293, sheenRoughness: 0.85, side: THREE.DoubleSide });
    const purple = new THREE.MeshPhysicalMaterial({ color: 0x3f506d, roughness: 0.68, sheen: 0.25, sheenColor: 0xa6bbd4, sheenRoughness: 0.8, side: THREE.DoubleSide });
    const pearlMaterial = new THREE.MeshPhysicalMaterial({ color: 0xf4ecd9, roughness: 0.3, clearcoat: 0.35, clearcoatRoughness: 0.24 });

    function mesh(geometry, material, parent = scene, shadows = true) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = shadows;
      object.receiveShadow = shadows;
      parent.add(object);
      return object;
    }
    function block(w, h, d, material, x, y, z, parent = scene, shadows = true) {
      const geometry = sharedGeometry(`box:${w}:${h}:${d}`, () => new THREE.BoxGeometry(w, h, d));
      const object = mesh(geometry, material, parent, shadows);
      object.position.set(x, y, z);
      return object;
    }
    function ball(radius, material, x, y, z, parent = scene, detail = 12) {
      const geometry = sharedGeometry(`sphere:${radius}:${detail}`,
        () => new THREE.SphereGeometry(radius, detail, Math.max(8, detail >> 1)));
      const object = mesh(geometry, material, parent);
      object.position.set(x, y, z);
      return object;
    }
    function rod(from, to, radius, material, parent = scene, sides = 8) {
      const start = new THREE.Vector3(...from);
      const end = new THREE.Vector3(...to);
      const direction = end.clone().sub(start);
      const object = mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), sides), material, parent);
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return object;
    }
    function batchRods(segments, material, parent) {
      const rods = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 7), material, segments.length);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < segments.length; i++) {
        const [from, to, radius] = segments[i];
        const a = new THREE.Vector3(...from);
        const b = new THREE.Vector3(...to);
        const direction = b.clone().sub(a);
        const length = direction.length();
        dummy.position.copy(a).add(b).multiplyScalar(0.5);
        dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        dummy.scale.set(radius, length, radius);
        dummy.updateMatrix();
        rods.setMatrixAt(i, dummy.matrix);
      }
      rods.instanceMatrix.needsUpdate = true;
      rods.castShadow = false;
      parent.add(rods);
      return rods;
    }
    function instances(geometry, material, transforms, castsShadow = true) {
      const object = new THREE.InstancedMesh(geometry, material, transforms.length);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < transforms.length; i++) {
        const [x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0] = transforms[i];
        dummy.position.set(x, y, z);
        dummy.scale.set(sx, sy, sz);
        dummy.rotation.set(rx, ry, rz);
        dummy.updateMatrix();
        object.setMatrixAt(i, dummy.matrix);
      }
      object.instanceMatrix.needsUpdate = true;
      object.castShadow = castsShadow;
      object.receiveShadow = true;
      scene.add(object);
      return object;
    }

    function makeMarbleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 512;
      const context = canvas.getContext('2d');
      const image = context.createImageData(512, 512);
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const u = x / 512;
          const v = y / 512;
          const flow = Math.sin(u * 21 + v * 8 + Math.sin(v * 18 + u * 7) * 2.1 + Math.sin(u * 39 - v * 15) * 0.48);
          const vein = Math.pow(Math.max(0, 1 - Math.abs(flow)), 23);
          const mist = 7 * Math.sin(u * 19 - v * 13) + 5 * Math.sin(u * 43 + v * 28);
          const fleck = random() * 11;
          const base = 85 + mist + fleck + 87 * vein;
          const i = (y * 512 + x) * 4;
          image.data[i] = base * 1.03;
          image.data[i + 1] = base;
          image.data[i + 2] = base * 0.94;
          image.data[i + 3] = 255;
        }
      }
      context.putImageData(image, 0, 0);
      context.strokeStyle = 'rgba(8, 12, 15, 0.62)';
      context.lineWidth = 4;
      for (let i = 0; i <= 4; i++) {
        const p = i * 128;
        context.beginPath(); context.moveTo(p, 0); context.lineTo(p, 512); context.stroke();
        context.beginPath(); context.moveTo(0, p); context.lineTo(512, p); context.stroke();
      }
      context.strokeStyle = 'rgba(214, 181, 116, 0.16)';
      context.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const p = i * 128 + 7;
        context.beginPath(); context.moveTo(p, 0); context.lineTo(p, 512); context.stroke();
        context.beginPath(); context.moveTo(0, p); context.lineTo(512, p); context.stroke();
      }
      context.strokeStyle = 'rgba(12, 16, 18, 0.28)';
      for (let i = 0; i < 26; i++) {
        const x = random() * 512;
        const y = random() * 512;
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(x + (random() - 0.5) * 90, y + (random() - 0.5) * 46);
        context.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(7, 10);
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const mirror = new Reflector(new THREE.PlaneGeometry(140, 150), {
      clipBias: 0.004,
      textureWidth: innerWidth < 700 ? 384 : 768,
      textureHeight: innerWidth < 700 ? 256 : 512,
      multisample: 0,
      color: 0x7c817a
    });
    mirror.rotation.x = -Math.PI / 2;
    mirror.position.y = -0.025;
    scene.add(mirror);

    const floorTexture = makeMarbleTexture();
    const floorRelief = floorTexture.clone();
    floorRelief.colorSpace = THREE.NoColorSpace;
    floorRelief.needsUpdate = true;
    const floor = mesh(
      new THREE.PlaneGeometry(140, 150),
      new THREE.MeshPhysicalMaterial({
        color: 0x858983,
        map: floorTexture,
        bumpMap: floorRelief,
        bumpScale: 0.01,
        metalness: 0.1,
        roughness: 0.38,
        roughnessMap: floorRelief,
        clearcoat: 0.72,
        clearcoatRoughness: 0.12,
        transparent: true,
        opacity: 0.65,
        depthWrite: false,
        envMapIntensity: 0.55
      }),
      scene,
      false
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.014;
    floor.receiveShadow = true;
    floor.renderOrder = 1;
    // At the camera's feet, stone takes over from the distant mirror reflection.
    floor.material.onBeforeCompile = shader => {
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <alphatest_fragment>',
        'diffuseColor.a = mix(0.92, opacity, smoothstep(3.0, 32.0, length(vViewPosition)));\n#include <alphatest_fragment>'
      );
    };
    floor.material.customProgramCacheKey = () => 'sunlit-marble-distance-fade';

    // Hairline inlays converge toward the dais without breaking up the reflective floor.
    const inlay = new THREE.MeshBasicMaterial({ color: 0xb79a62, transparent: true, opacity: 0.2, depthWrite: false });
    for (const x of [-3.65, 3.65]) {
      const line = block(0.032, 0.012, 47, inlay, x, 0.038, -2.5, scene, false);
      line.renderOrder = 2;
    }
    for (let z = 17; z > -19; z -= 7) {
      const line = block(7.32, 0.012, 0.026, inlay, 0, 0.038, z, scene, false);
      line.renderOrder = 2;
    }

    // Warm window sunlight and open-sky fill keep the shadows gentle, not empty.
    scene.add(new THREE.AmbientLight(0xfff1db, 0.38));
    scene.add(new THREE.HemisphereLight(0xe6eff5, 0xa58965, 0.72));
    const daylight = new THREE.DirectionalLight(0xffe7bc, 2.3);
    daylight.position.set(-20, 29, -8);
    daylight.target.position.set(0, 7, -18);
    daylight.castShadow = true;
    daylight.shadow.mapSize.set(innerWidth < 700 ? 1024 : 2048, innerWidth < 700 ? 1024 : 2048);
    daylight.shadow.camera.left = -37;
    daylight.shadow.camera.right = 37;
    daylight.shadow.camera.top = 42;
    daylight.shadow.camera.bottom = -36;
    daylight.shadow.camera.near = 1;
    daylight.shadow.camera.far = 105;
    daylight.shadow.bias = -0.0003;
    daylight.shadow.normalBias = 0.025;
    scene.add(daylight, daylight.target);
    const skyFill = new THREE.DirectionalLight(0xe4eef3, 0.52);
    skyFill.position.set(24, 18, 12);
    skyFill.target.position.set(0, 6, -21);
    scene.add(skyFill, skyFill.target);
    const throneLight = new THREE.SpotLight(0xffe4b9, 155, 46, Math.PI / 6, 0.8, 1.5);
    throneLight.position.set(2, 24, -14);
    throneLight.target.position.set(0, 6.5, -26);
    throneLight.castShadow = true;
    throneLight.shadow.mapSize.set(1024, 1024);
    throneLight.shadow.bias = -0.0002;
    throneLight.shadow.normalBias = 0.02;
    scene.add(throneLight, throneLight.target);
    const apseLight = new THREE.PointLight(0xffebc5, 42, 26, 2);
    apseLight.position.set(-2, 14, -40);
    scene.add(apseLight);
    const vaultLight = new THREE.PointLight(0xffedce, 45, 38, 2);
    vaultLight.position.set(0, 19, -5);
    scene.add(vaultLight);
    const faceLight = new THREE.PointLight(0xffe6c8, 24, 16, 2);
    faceLight.position.set(-3, 10.5, -19);
    const rimLight = new THREE.PointLight(0xd8e8ef, 18, 16, 2);
    rimLight.position.set(-3, 10, -30);
    scene.add(faceLight, rimLight);

    // Ivory masonry and darker insets preserve depth within the sunlit room.
    for (const side of [-1, 1]) {
      block(1.2, 27, 77, wallStone, side * 29.7, 13.5, -10);
      block(1.7, 4, 77, deepStone, side * 29.05, 2, -10);
      block(0.35, 0.24, 77, gold, side * 28.86, 4.12, -10);
      block(0.45, 0.6, 77, stone, side * 29.05, 17.4, -10);
      block(10.8, 0.65, 69, deepStone, side * 21, 19.3, -10.5);
      block(10.8, 0.13, 69, darkGold, side * 21, 18.87, -10.5);
      for (const z of [9, -2, -13, -24, -35]) {
        block(0.16, 3.4, 5.6, deepStone, side * 28.78, 6.12, z);
        for (const y of [4.35, 7.89]) block(0.2, 0.085, 5.75, gold, side * 28.65, y, z);
        for (const edge of [-2.82, 2.82]) block(0.2, 3.6, 0.085, darkGold, side * 28.65, 6.12, z + edge);
        const medallion = mesh(new THREE.TorusGeometry(0.85, 0.085, 7, 32), gold, scene, false);
        medallion.rotation.y = Math.PI / 2;
        medallion.position.set(side * 28.57, 6.15, z);
        const relief = mesh(new THREE.IcosahedronGeometry(0.46, 1), stone, scene, false);
        relief.scale.x = 0.3;
        relief.position.set(side * 28.49, 6.15, z);
        block(8.15, 0.055, 7.9, darkGold, side * 20.8, 18.91, z, scene, false);
        block(7.64, 0.06, 7.37, deepStone, side * 20.8, 18.86, z, scene, false);
      }
    }
    block(59.4, 28, 1.3, wallStone, 0, 14, -48.4);
    block(59.4, 4.4, 0.35, deepStone, 0, 2.2, -47.55);

    function flutedCylinder(radius, height) {
      const geometry = new THREE.CylinderGeometry(radius * 0.9, radius, height, 64, 1);
      const positions = geometry.attributes.position;
      const colors = [];
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const z = positions.getZ(i);
        const phase = Math.atan2(z, x);
        const flute = Math.cos(20 * phase);
        const ripple = 1 + 0.045 * flute;
        positions.setX(i, x * ripple);
        positions.setZ(i, z * ripple);
        const shade = 0.74 + 0.26 * (0.5 + 0.5 * flute);
        colors.push(shade, shade * 0.94, shade * 0.78);
      }
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      return geometry;
    }
    function capitalLeaf() {
      const shape = new THREE.Shape();
      shape.moveTo(0, -0.43);
      shape.bezierCurveTo(-0.09, -0.24, -0.3, -0.21, -0.24, 0.12);
      shape.bezierCurveTo(-0.18, 0.29, -0.02, 0.37, 0, 0.45);
      shape.bezierCurveTo(0.03, 0.33, 0.18, 0.25, 0.23, 0.1);
      shape.bezierCurveTo(0.28, -0.17, 0.08, -0.26, 0, -0.43);
      return new THREE.ExtrudeGeometry(shape, {
        depth: 0.05, bevelEnabled: true, bevelSize: 0.025,
        bevelThickness: 0.02, bevelSegments: 1, curveSegments: 5
      });
    }
    const leafGeometry = capitalLeaf();

    function columnRows(x, zs, height, radius, outer = false) {
      const positions = [];
      for (const z of zs) for (const side of [-1, 1]) positions.push([side * x, z]);
      const mapped = (y, sx = 1, sy = 1, sz = 1, rx = 0) => positions.map(([px, pz]) => [px, y, pz, sx, sy, sz, rx]);
      const plinth = outer ? 2.45 : 3.05;
      instances(new THREE.BoxGeometry(plinth, 1.65, plinth), outer ? stone : paleStone, mapped(0.825));
      instances(new THREE.BoxGeometry(plinth + 0.22, 0.16, plinth + 0.22), darkGold, mapped(1.7));
      instances(new THREE.CylinderGeometry(radius * 1.4, radius * 1.62, 0.76, 16), gold, mapped(2.15));
      instances(flutedCylinder(radius, height), flutedGold, mapped(2.53 + height / 2));
      instances(new THREE.CylinderGeometry(radius * 1.13, radius * 1.24, 3.05, 24), darkGold, mapped(4.02));
      instances(new THREE.CylinderGeometry(radius * 1.18, radius * 1.08, 0.34, 24), brightGold, mapped(5.68));
      instances(new THREE.CylinderGeometry(radius * 1.56, radius * 1.05, 0.66, 16), brightGold, mapped(2.57 + height));
      instances(new THREE.BoxGeometry(plinth * 0.9, 0.46, plinth * 0.9), stone, mapped(3.12 + height));
      instances(new THREE.BoxGeometry(plinth, 0.16, plinth), gold, mapped(3.46 + height));
      const plaques = positions.map(([px, pz]) => [px, 0.88, pz + plinth / 2 + 0.055]);
      instances(new THREE.BoxGeometry(plinth * 0.69, 1.12, 0.09), deepStone, plaques, false);
      instances(new THREE.BoxGeometry(plinth * 0.76, 0.055, 0.12), gold,
        positions.flatMap(([px, pz]) => [
          [px, 0.31, pz + plinth / 2 + 0.1],
          [px, 1.45, pz + plinth / 2 + 0.1]

    const headPositions = headGeometry.attributes.position;
    const headColors = [];
    const skinColor = new THREE.Color(0xd5a987);
    const cheekColor = new THREE.Color(0xd29b80);
    for (let i = 0; i < headPositions.count; i++) {
      const y = headPositions.getY(i) * 0.49;
      const x = headPositions.getX(i) * faceWidth(y);
      const nz = headPositions.getZ(i);
      const z = nz >= 0 ? faceFrontZ(x, y) : 0.18 + nz * 0.32;
      headPositions.setXYZ(i, x, 4.1 + y, z);
      const blush = 0.35 * gauss(Math.abs(x), 0.21, 0.12) * gauss(y, -0.05, 0.14) * Math.max(0, nz);

      jawPositions.setY(i, THREE.MathUtils.lerp(y, 4.07 + dy * Math.cos(jawAngle) - dz * Math.sin(jawAngle), weight));
      jawPositions.setZ(i, THREE.MathUtils.lerp(z, 0.12 + dy * Math.sin(jawAngle) + dz * Math.cos(jawAngle), weight));
    }
    jawTarget.computeVertexNormals();
    headGeometry.morphAttributes.position = [jawPositions.clone()];
    headGeometry.morphAttributes.normal = [jawTarget.attributes.normal.clone()];

    const faceMaterial = skin.clone();

      const nostrilZ = faceFrontZ(side * 0.042, -0.093);

    const smile = [];
    const lowerLip = [];
    for (let j = 0; j <= 16; j++) {

    const beardGeometry = new THREE.PlaneGeometry(1, 1, 36, 20);
    const beardPositions = beardGeometry.attributes.position;
    const beardColors = [];
    for (let i = 0; i < beardPositions.count; i++) {

      const y = -0.25 - 0.23 * t + 0.055 * Math.abs(a) * (1 - t);
      beardPositions.setXYZ(i, x, 4.1 + y, faceFrontZ(x, y) + 0.013 + 0.002 * Math.sin(a * 115));

    const moustacheLines = [];
    for (let i = 0; i < 120; i++) {

    for (const level of [0.255, 0.29]) {

    const crown = mesh(new THREE.CylinderGeometry(0.38, 0.365, 0.2, 48, 1, true), brightGold, headParts);
    crown.position.set(0, 4.57, 0.16);
    const crownBand = mesh(new THREE.TorusGeometry(0.368, 0.028, 8, 48), gold, headParts);
    crownBand.rotation.x = Math.PI / 2;

    function glowTexture() {
      const canvas = document.createElement('canvas');

      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 1, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255,255,255,0.75)');
      gradient.addColorStop(0.19, 'rgba(255,215,151,0.35)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const glowMap = glowTexture();
    function flameTexture() {
      const canvas = document.createElement('canvas');

      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const glow = ctx.createLinearGradient(0, 255, 0, 10);
      glow.addColorStop(0, 'rgba(255,191,109,0)');
      glow.addColorStop(0.22, 'rgba(255,204,130,0.65)');
      glow.addColorStop(0.5, 'rgba(255,235,180,0.86)');
      glow.addColorStop(0.8, 'rgba(255,223,155,0.38)');
      glow.addColorStop(1, 'rgba(255,212,134,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.moveTo(64, 8);
      ctx.bezierCurveTo(86, 67, 91, 96, 105, 143);
      ctx.bezierCurveTo(128, 217, 101, 250, 64, 254);
      ctx.bezierCurveTo(25, 250, 0, 210, 25, 145);
      ctx.bezierCurveTo(43, 97, 37, 64, 64, 8);
      ctx.fill();
      const heart = ctx.createRadialGradient(64, 201, 2, 64, 178, 66);
      heart.addColorStop(0, 'rgba(255,255,221,0.95)');
      heart.addColorStop(0.38, 'rgba(255,219,128,0.52)');
      heart.addColorStop(1, 'rgba(255,156,41,0)');
      ctx.fillStyle = heart;
      ctx.fillRect(0, 95, 128, 160);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const flameMap = flameTexture();

    const sparkCount = 24;
    const sparkPositions = new Float32Array(sparkCount * 3);
    const sparkColors = new Float32Array(sparkCount * 3);
    const sparkSpeeds = new Float32Array(sparkCount);
    for (let i = 0; i < sparkCount; i++) {
      const side = i % 2 ? 1 : -1;
      sparkPositions[i * 3] = side * 13.6 + (random() - 0.5) * 1.45;
      sparkPositions[i * 3 + 1] = 2.7 + random() * 2.5;
      sparkPositions[i * 3 + 2] = 5.8 + (random() - 0.5) * 1.5;
      sparkSpeeds[i] = 0.3 + random() * 0.45;
      const c = new THREE.Color(random() > 0.35 ? 0xffdfa3 : 0xeac28e);
      sparkColors[i * 3] = c.r;
      sparkColors[i * 3 + 1] = c.g;
      sparkColors[i * 3 + 2] = c.b;
    }
    const sparkGeometry = new THREE.BufferGeometry();
    sparkGeometry.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3).setUsage(THREE.DynamicDrawUsage));
    sparkGeometry.setAttribute('color', new THREE.BufferAttribute(sparkColors, 3));
    const sparks = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({
      size: 0.1, map: glowMap, vertexColors: true, transparent: true,

    // ================= Storybook layer =================
    // Carpet, blossoms, fairy lights, falling petals, butterflies and twinkling motes.
    const toLinear = (hex, k = 1) => { const c = new THREE.Color(hex); return [c.r * k, c.g * k, c.b * k]; };
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const pointScale = { value: initialViewport.height * renderer.getPixelRatio() * 0.5 };
    const fairyTime = { value: 0 };

    // Twinkling star-sprites: one shader, a handful of draw calls, no per-frame CPU work.
    function sparkleCloud(items, drift, parent = scene) {
      const n = items.length;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      const size = new Float32Array(n);
      const phase = new Float32Array(n);
      items.forEach((item, i) => {
        pos.set(item.p, i * 3);
        col.set(item.c, i * 3);
        size[i] = item.s;
        phase[i] = random();
      });
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geometry.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(size, 1));
      geometry.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
      const material = new THREE.ShaderMaterial({
        uniforms: { time: fairyTime, scale: pointScale, drift: { value: drift } },
        vertexShader: `
          attribute vec3 aColor;
          attribute float size;
          attribute float phase;
          uniform float time;
          uniform float scale;
          uniform float drift;
          varying vec3 vColor;
          varying float vTw;
          void main() {
            vec3 p = position;
            p.y += sin(time * 0.4 + phase * 6.28) * 0.55 * drift;
            p.x += sin(time * 0.23 + phase * 17.0) * 0.7 * drift;
            p.z += cos(time * 0.19 + phase * 11.0) * 0.7 * drift;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp(size * scale / max(-mv.z, 0.1), 1.0, 96.0);
            gl_Position = projectionMatrix * mv;
            vColor = aColor;
            vTw = 0.5 + 0.5 * sin(time * (1.1 + phase * 2.2) + phase * 40.0);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vTw;
          void main() {
            vec2 c = gl_PointCoord - 0.5;
            float d = length(c);
            if (d > 0.5) discard;
            float core = exp(-d * d * 90.0);
            float halo = exp(-d * d * 14.0) * 0.4;
            float star = (exp(-abs(c.x) * 55.0 - abs(c.y) * 9.0) + exp(-abs(c.y) * 55.0 - abs(c.x) * 9.0)) * 0.75;
            float a = (core + halo + star) * (0.35 + 0.65 * vTw);
            gl_FragColor = vec4(vColor * 1.7, clamp(a, 0.0, 1.0));
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      parent.add(points);
      return points;
    }

    // Drifting pastel motes through the whole hall.
    const motePalette = [0xffe3a3, 0xffc6d3, 0xd7c6ff, 0xc8f0e0, 0xfff4d6];
    const moteItems = [];
    for (let i = 0; i < 340; i++) {

    // The chandelier crystals catch the room's warm light.

        const a = random() * Math.PI * 2;

    });
    // ---- Crimson and gold ceremonial carpet leading to the throne ----
    function makeCarpetTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const base = ctx.createLinearGradient(0, 0, 256, 0);
      base.addColorStop(0, '#7b2133');
      base.addColorStop(0.5, '#a63b4b');
      base.addColorStop(1, '#7b2133');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, 256, 512);
      ctx.strokeStyle = 'rgba(238, 200, 124, 0.34)';
      ctx.fillStyle = 'rgba(238, 200, 124, 0.26)';
      ctx.lineWidth = 2;
      for (let y0 = 0; y0 <= 512; y0 += 128) {
        const cy = y0 + 64;
        ctx.beginPath(); ctx.arc(128, cy, 30, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(128, cy - 44); ctx.lineTo(160, cy); ctx.lineTo(128, cy + 44); ctx.lineTo(96, cy);
        ctx.closePath(); ctx.stroke();
        for (let k = 0; k < 8; k++) {
          const a = k * Math.PI / 4;
          ctx.beginPath();
          ctx.ellipse(128 + Math.cos(a) * 17, cy + Math.sin(a) * 17, 9, 4, a, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath(); ctx.arc(128, cy, 5, 0, Math.PI * 2); ctx.fill();
        for (const x of [60, 196]) {
          ctx.beginPath();
          ctx.moveTo(x, y0 - 18); ctx.lineTo(x + 14, y0); ctx.lineTo(x, y0 + 18); ctx.lineTo(x - 14, y0);
          ctx.closePath(); ctx.stroke();
        }
      }
      const gold = ctx.createLinearGradient(0, 0, 26, 0);
      gold.addColorStop(0, '#caa05a'); gold.addColorStop(0.5, '#f1d795'); gold.addColorStop(1, '#c39a54');
      ctx.fillStyle = gold;
      ctx.fillRect(0, 0, 20, 512);
      ctx.fillRect(236, 0, 20, 512);
      ctx.fillStyle = '#5a1625';
      ctx.fillRect(20, 0, 5, 512);
      ctx.fillRect(231, 0, 5, 512);
      ctx.fillStyle = '#e8c982';
      ctx.fillRect(25, 0, 2, 512);
      ctx.fillRect(229, 0, 2, 512);
      ctx.fillStyle = 'rgba(122, 78, 36, 0.55)';
      for (let y = 8; y < 512; y += 32) {
        ctx.beginPath(); ctx.arc(10, y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(246, y, 4, 0, Math.PI * 2); ctx.fill();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }
    const carpetTexture = makeCarpetTexture();
    carpetTexture.repeat.set(1, 3.9);
    const carpetMaterial = new THREE.MeshPhysicalMaterial({
      map: carpetTexture, roughness: 0.88, sheen: 0.55, sheenColor: 0xf0b9a8, sheenRoughness: 0.7,

    const stepCarpetMaterial = carpetMaterial.clone();

    stepCarpetMaterial.map.repeat.set(1, 0.14);

    stepCarpetMaterial.polygonOffset = false;
    for (let i = 0; i < 3; i++) {
      const h = (i + 1) * 0.78;

    // ---- Ivy, blossoms and flower swags ----
    const ivyLeaves = [];

    const vineMaterial = new THREE.MeshStandardMaterial({ color: 0x56703f, roughness: 0.8 });
    const rand3 = k => V3(random() - 0.5, random() - 0.5, random() - 0.5).multiplyScalar(k);

    function ivyColumn(cx, cz, phase) {
      const pts = [];
      const steps = 96;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const y = 6.3 + 8.9 * t;
        const a = phase + t * 2.7 * Math.PI * 2;
        const r = 0.94 - (y - 2.53) * 0.0065 + 0.1;
        const n = V3(Math.cos(a), 0.3, Math.sin(a)).normalize();
        const p = V3(cx + Math.cos(a) * r, y, cz + Math.sin(a) * r);
        pts.push(p);
        ivyLeaves.push({ p: p.clone().addScaledVector(n, 0.06), n, s: 0.34 + random() * 0.24 });
        ivyLeaves.push({
          p: p.clone().addScaledVector(n, 0.1).add(V3(0, (random() - 0.5) * 0.2, 0)),
          n: n.clone().add(rand3(0.8)).normalize(), s: 0.28 + random() * 0.2
        });
        if (i % 6 === 3) ivyBlooms.push({ p: p.clone().addScaledVector(n, 0.14), n, s: 0.3 + random() * 0.2 });
      }
      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, 0.03, 5, false), vineMaterial, scene, false);
    }
    for (const side of [-1, 1]) {
      for (const z of bayZ) ivyColumn(side * 15.5, z, random() * Math.PI * 2);
    }

    function flowerSwag(a, b, sag, bulge) {
      const pts = [];
      const count = Math.round(a.distanceTo(b) * 3.4);
      const inward = V3(-Math.sign(a.x) * 0.8, 0.25, 0);
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = a.clone().lerp(b, t);
        p.y -= sag * 4 * t * (1 - t);
        p.x += bulge * Math.sin(Math.PI * t);
        pts.push(p);
        ivyLeaves.push({ p: p.clone().add(rand3(0.12)), n: inward.clone().add(rand3(1.2)).normalize(), s: 0.4 + random() * 0.26 });
        ivyLeaves.push({ p: p.clone().add(rand3(0.2)), n: inward.clone().add(rand3(1.4)).normalize(), s: 0.32 + random() * 0.22 });
        if (i % 2 === 0) ivyBlooms.push({ p: p.clone().add(V3(inward.x * 0.1, -0.05, 0)), n: inward.clone().add(rand3(0.5)).normalize(), s: 0.38 + random() * 0.24 });
      }
      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), count * 3, 0.035, 5, false), vineMaterial, scene, false);
    }

    // ---- Fairy-light strings ----
    const beads = [];
    function lightString(a, b, sag) {
      const count = Math.max(6, Math.round(a.distanceTo(b) / 0.6));
      const pts = [];
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = a.clone().lerp(b, t);
        p.y -= sag * 4 * t * (1 - t);
        pts.push(p);
        if (i > 0 && i < count) beads.push(p.clone());

      mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), count * 4, 0.012, 4, false), darkGold, scene, false);

        flowerSwag(V3(side * 14.3, 16.9, z0), V3(side * 14.3, 16.9, z1), 2.0, -side * 0.5);
        lightString(V3(side * 13.6, 13.4, z0), V3(side * 13.6, 13.4, z1), 1.1);

    const bead = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.075, 8, 6),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 2.5, 1.4) }),

    );
    const beadDummy = new THREE.Object3D();
    beads.forEach((p, i) => { beadDummy.position.copy(p); beadDummy.updateMatrix(); bead.setMatrixAt(i, beadDummy.matrix); });
    bead.frustumCulled = false;
    scene.add(bead);
    sparkleCloud(beads.map(p => ({ p: p.toArray(), c: toLinear(0xffd89a, 1.2), s: 0.5 + random() * 0.25 })), 0);

    // ---- Build all foliage as two instanced meshes ----
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, -0.5);

    leafShape.quadraticCurveTo(-0.36, -0.1, 0, -0.5);
    const foliageLeafGeometry = new THREE.ShapeGeometry(leafShape, 4);
    function makeFlowerGeometry() {
      const parts = [];
      const add = (geo, color) => {
        const count = geo.attributes.position.count;
        const colors = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) colors.set(color, i * 3);
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        parts.push(geo);
      };
      for (let k = 0; k < 5; k++) {
        const g = new THREE.SphereGeometry(1, 8, 6);
        g.scale(0.27, 0.19, 0.07);
        g.translate(0.3, 0, 0);
        g.rotateZ(k * Math.PI * 2 / 5);
        add(g, [1, 1, 1]);
      }
      const heart = new THREE.SphereGeometry(0.13, 8, 6);
      heart.scale(1, 1, 0.8);
      heart.translate(0, 0, 0.04);
      add(heart, toLinear(0xf0b84c));
      const flower = mergeGeometries(parts);
      parts.forEach(part => part.dispose());
      return flower;
    }
    const foliageDummy = new THREE.Object3D();
    const foliageColor = new THREE.Color();
    function placeFoliage(list, meshObject, palette) {
      list.forEach((item, i) => {
        foliageDummy.position.copy(item.p);

        foliageDummy.rotateX((random() - 0.5) * 0.8);

        meshObject.setMatrixAt(i, foliageDummy.matrix);
        meshObject.setColorAt(i, foliageColor.setHex(palette[Math.floor(random() * palette.length)]));
      });
      meshObject.instanceMatrix.needsUpdate = true;
      meshObject.instanceColor.needsUpdate = true;

    placeFoliage(ivyLeaves, new THREE.InstancedMesh(

    // ---- Soft stained-glass colour pools on the floor ----
    function makePoolTexture() {

      ctx.fillStyle = mask;

      ctx.restore();
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;

    const sunburst = new THREE.Mesh(
      new THREE.PlaneGeometry(26, 26),
      new THREE.MeshBasicMaterial({
        map: makeSunburstTexture(), transparent: true, opacity: 0.5,

      })
    );
    sunburst.position.set(0, 8.7, -31.2);
    sunburst.renderOrder = 1;
    scene.add(sunburst);

    // ---- Falling rose petals ----
    const PETALS = 140;
    const petalGeometry = new THREE.PlaneGeometry(0.26, 0.34, 2, 3);
    {
      const pp = petalGeometry.attributes.position;
      for (let i = 0; i < pp.count; i++) {

    }

      petalGeometry,
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide, emissive: 0x40161f, emissiveIntensity: 0.5 }),
      PETALS
    );
    petalMesh.frustumCulled = false;
    petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const petalState = [];
    const petalPalette = [0xf6b3c3, 0xffd5dd, 0xfff1e6, 0xe98fa8];
    for (let i = 0; i < PETALS; i++) {
      petalState.push({
        x: (random() - 0.5) * 26, y: random() * 22, z: -9 + random() * 23,
        fall: 0.35 + random() * 0.45, ph: random() * 6.28,

    // ---- Butterflies ----
    function makeWingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const fill = () => {
        const g = ctx.createLinearGradient(0, 0, 128, 0);
        g.addColorStop(0, '#c8c8c8'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#f0f0f0');

        ctx.lineWidth = 4; ctx.strokeStyle = '#6a6a6a'; ctx.stroke();
      };

        }
        expect(completedLoop && visited.size === STAGES.length, 'The performance did not complete a full cycle.');
        expect(Math.abs(performance.z - SEAT_Z) < 0.001, 'The king did not return to his seat.');
        requestAction('wave');
        expect(STAGES[performance.index].id === 'rise', 'A seated action must begin by rising.');
        let reachedWave = false;
        for (let i = 0; i < 30 * 60; i++) {
          updateKing(i / 60, 1 / 60);
          if (STAGES[performance.index].id === 'wave') { reachedWave = true; break; }
        }
        expect(reachedWave && Math.abs(performance.z - FRONT_Z) < 0.001, 'A queued gesture was lost or began before arrival.');
        const before = performance.z;
        requestAction('scepter');
        expect(STAGES[performance.index].id === 'scepter' && performance.z === before, 'Gesture changes must not teleport the king.');
      } finally {
        Object.assign(performance, savedState);
        Object.assign(cur, savedPose);
        updateKing(0, 0);
      }
      if (failures.length) console.error('Sunlit Crown checks failed:', failures);
      else console.info('Sunlit Crown checks passed: geometry, instances, resolution budget, full performance cycle, and queued gestures.');
    }

    function disposeApplication() {
      if (runtime.disposed) return;
      runtime.disposed = true;
      renderer.setAnimationLoop(null);
      eventScope.abort();
      controls.dispose();
      const geometries = new Set(geometryCache.values());
      const materials = new Set();
      const textures = new Set();
      scene.traverse(object => {
        if (object.geometry) geometries.add(object.geometry);
        if (object.material) {
          const list = Array.isArray(object.material) ? object.material : [object.material];
          list.forEach(material => materials.add(material));
        }
        if (object.isInstancedMesh) object.dispose();
        if (object.shadow) {
          object.shadow.map?.dispose();
          object.shadow.mapPass?.dispose();
        }
      });
      materials.forEach(material => {
        Object.values(material).forEach(value => { if (value?.isTexture) textures.add(value); });
        if (material.uniforms) Object.values(material.uniforms).forEach(uniform => {
          if (uniform.value?.isTexture) textures.add(uniform.value);
        });
      });
      textures.delete(environment.texture);
      textures.delete(mirror.getRenderTarget().texture);
      materials.delete(mirror.material);
      textures.forEach(texture => texture.dispose());
      materials.forEach(material => material.dispose());
      geometries.forEach(geometry => geometry.dispose());
      mirror.dispose();
      environment.dispose();
      composer.passes.forEach(pass => pass.dispose?.());
      composer.dispose();
      renderer.dispose();
      geometryCache.clear();
      scene.clear();
      renderer.domElement.remove();
    }

    listen(window, 'resize', () => { runtime.resizePending = true; });
    listen(document, 'visibilitychange', synchronizeLoop);
    listen(window, 'pagehide', event => {
      if (event.persisted) { runtime.pageHidden = true; synchronizeLoop(); }
      else disposeApplication();
    });
    listen(window, 'pageshow', () => { runtime.pageHidden = false; synchronizeLoop(); });
    listen(renderer.domElement, 'webglcontextlost', event => {
      event.preventDefault();
      runtime.contextLost = true;
      synchronizeLoop();
    });
    listen(renderer.domElement, 'webglcontextrestored', () => {
      runtime.contextLost = false;
      rebuildEnvironment();
      composer.reset();
      runtime.resizePending = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.shadowMap.autoUpdate = false;
      renderer.shadowMap.needsUpdate = true;
      synchronizeLoop();
    });

    // Seed all instance transforms before the first frame, then use one pausable clock.
    updateStorybook(0, 0);
    updateKing(0, 0);
    if (new URLSearchParams(window.location.search).has('check')) runSelfChecks();
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    synchronizeLoop();
  </script>
</body>
</html>
